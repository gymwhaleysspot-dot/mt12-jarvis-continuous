[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="momto"
version="0.1.0"
requires-python=">=3.11"
dependencies=["typer>=0.16","sqlalchemy>=2.0","fastapi>=0.115","cryptography>=43.0","uvicorn[standard]>=0.30","python-multipart>=0.0.9"]
[project.scripts]
momto="momto.cli:app"
[project.optional-dependencies]
dev=["pytest>=8.0","httpx2>=0.1"]
