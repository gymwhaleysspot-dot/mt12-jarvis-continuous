services:
  - type: web
    name: momto-private
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: MOMTO_DATA_DIR
        value: /data
      - key: MOMTO_VAULT_DIR
        value: /data/vault
      - key: CORS_ORIGINS
        value: https://gymwhaleysspot-dot.github.io
      - key: MOMTO_API_TOKEN
        sync: false
      - key: MOMTO_VAULT_KEY
        sync: false
      - key: MOMTO_OPENAI_API_KEY
        sync: false
      - key: MOMTO_RESEARCH_MODEL
        value: gpt-5.6
    disk:
      name: momto-data
      mountPath: /data
      sizeGB: 10
