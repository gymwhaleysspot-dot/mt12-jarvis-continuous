<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marble Maze: PAC-MARBLE</title>
<!-- Pages deployment repair: 2026-09-25 -->
<!-- AI player upgrade: maze-aware pellet targeting + hunter avoidance -->
<style>
:root{--bg:#03030a;--yellow:#ffe84a;--blue:#244cff;--cyan:#38d9ff;--pink:#ff54d8;--red:#ff4b5c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle,#17153a 0,#060612 55%,#010104 100%);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:12px}
.wrap{width:min(720px,100%);text-align:center}h1{margin:0 0 4px;color:var(--yellow);letter-spacing:.1em;text-shadow:0 0 16px #ffd400;font-size:clamp(24px,7vw,42px)}
.hud{display:flex;justify-content:space-between;font-size:12px;font-weight:900;letter-spacing:.08em;margin:7px 2px}.hud span{color:#fff}.hud b{color:var(--yellow)}
.frame{position:relative;padding:7px;background:#020207;border:3px solid #292a62;border-radius:18px;box-shadow:0 0 35px #1d28a855}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:#000}
.overlay{position:absolute;inset:7px;display:grid;place-items:center;pointer-events:none}.panel{display:none;background:#05050fee;border:2px solid var(--yellow);border-radius:18px;padding:20px 25px;box-shadow:0 0 28px #ffd40055}.panel.show{display:block}.panel strong{font-size:28px;color:var(--yellow)}
.controls{display:grid;grid-template-columns:repeat(3,64px);gap:7px;justify-content:center;margin-top:10px}.controls button{height:55px;border:2px solid #41489d;border-radius:14px;background:#101331;color:white;font-size:23px;font-weight:900;touch-action:manipulation}.controls button:active{transform:scale(.93);background:#292f78}.blank{visibility:hidden}.help{font-size:11px;opacity:.65;margin-top:8px}
</style>
<style>
/* AI PLAYER */
#aiToggle{margin-top:10px;width:min(420px,100%);height:46px;border:2px solid #ffd400;border-radius:14px;background:#101331;color:#ffe84a;font-weight:900;letter-spacing:.06em}
#aiStats{font-size:11px;opacity:.7;margin-top:6px}

/* EPIC ARCADE BOARD */
body{background:#000;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1}
body:before{background:radial-gradient(circle at 50% 35%,#171c68 0,transparent 34%),radial-gradient(circle at 15% 80%,#55135b 0,transparent 28%),radial-gradient(circle at 85% 70%,#0b5470 0,transparent 30%)}
.wrap{filter:drop-shadow(0 18px 45px #000)}
h1{font-size:clamp(28px,8vw,54px);text-shadow:0 0 8px #fff200,0 0 22px #ff9d00,0 0 48px #ff3c00;animation:titlePulse 1.8s infinite alternate}
@keyframes titlePulse{to{filter:brightness(1.25);letter-spacing:.14em}}
.hud{background:linear-gradient(90deg,#090b2b,#15113b,#090b2b);border:1px solid #343da5;border-radius:12px;padding:8px 12px;box-shadow:inset 0 0 18px #111b66,0 0 18px #111a55}
.frame{padding:10px;border:3px solid #455cff;border-radius:22px;background:linear-gradient(135deg,#090a22,#020208);box-shadow:0 0 0 2px #11164d,0 0 24px #294cff,0 0 70px #7c24ff55,inset 0 0 35px #18268f}
canvas{border:2px solid #5e75ff;border-radius:13px;box-shadow:0 0 16px #2f62ff,inset 0 0 25px #000;image-rendering:auto}
.controls button,#aiToggle{box-shadow:0 0 12px #2639a8,inset 0 0 15px #161b5c;transition:.15s}
.controls button:hover,#aiToggle:hover{transform:translateY(-2px);box-shadow:0 0 20px #536cff}
#aiToggle{font-size:13px}
#aiStats{color:#93b9ff}
.panel{border-color:#ffe84a;box-shadow:0 0 12px #fff000,0 0 45px #ff6a0055}
</style>
<style>
/* EPIC BOARD EFFECTS */
#game{background:radial-gradient(circle,#090b2a,#000)}
</style>
<style>
<!-- TRUE 3D MAZE UPGRADE 2026-09-25 -->
<!-- PERSISTENT AI BRAIN 2026-09-25 -->
<!-- PERSISTENT AI MAZE BUILDER 2026-09-25 -->
body{perspective:1200px}
.frame{transform:perspective(1100px) rotateX(2deg);transform-style:preserve-3d}
#game{transform:translateZ(12px);transform-style:preserve-3d}
</style>
</head>
<body><main class="wrap">
<h1>PAC-MARBLE</h1>
<div class="hud"><span>🏆 SCORE <b id="score">000000</b></span><span>⚡ LEVEL <b id="level">1</b></span><span>❤️ <b id="lives">●●●</b></span><span>🤖 <b id="mode">HUMAN</b></span></div>
<div class="frame"><canvas id="game" width="560" height="560"></canvas><div class="overlay"><div id="panel" class="panel"><strong id="message">READY!</strong><div style="margin-top:7px">Choose a direction</div></div></div></div>
<div class="controls"><button class="blank">.</button><button data-d="up">▲</button><button class="blank">.</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>
<button id="aiToggle">🤖 AI PLAYER: OFF</button><div id="aiStats">AI: BFS maze pathfinding • pellet targeting • power-marble strategy • hunter avoidance</div><div class="help">TRUE 3D DEPTH MAZE • Arrow keys / WASD • P pause • R restart • Eat glowing power marbles to turn hunters blue</div>
</main>
<script>
const C=document.getElementById('game'),X=C.getContext('2d'),T=28,S=C.width/T,TAU=Math.PI*2;
const FALLBACK_ROWS=[
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.#  #.#   #.##.#   #.#  #.#",
"#.#  #.#   #....#   #.#  #.#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"     #.#....    ....#.#     ",
"######.#.### ## ###.#.######",
"#..........#    #..........#",
"#.####.###.# ## #.###.####.#",
"#......#...#    #...#......#",
"######.#.########.#.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.#  #.#   #....#   #.#  #.#",
"#.#  #.#   #.##.#   #.#  #.#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.#####.##.#####.######",
"#............##............#",
"#..........................#",
"############################"].map(r=>[...r].map(c=>c==="#"?1:0));
let rows=FALLBACK_ROWS;
let mazeBrain={version:1,generation:0,levels_built:0,levels:[]};
let mazeBrainReady=false;
async function loadMazeBrain(){
  try{
    const r=await fetch("maze-brain.json?v="+Date.now(),{cache:"no-store"});
    if(r.ok){const b=await r.json(); if(Array.isArray(b.levels)&&b.levels.length){mazeBrain=b; mazeBrainReady=true; const n=Math.min(level,b.levels.length)-1; const m=b.levels[n]; if(Array.isArray(m)&&m.length===T) rows=m.map(r=>[...r].map(c=>c==="#"?1:0));}}
  }catch(e){}
  const el=document.getElementById("aiStats"); if(el) el.textContent="AI: persistent player brain • persistent maze builder • "+(mazeBrainReady?("MAZE GEN "+Number(mazeBrain.generation||0).toLocaleString()+" • LEVELS "+mazeBrain.levels.length):"MAZE BUILDER FALLBACK");
}
const open=(x,y)=>x>=0&&x<T&&y>=0&&y<T&&!rows[y][x],id=(x,y)=>y*T+x;

// PERSISTENT BRAIN: learned policy is stored in brain.json and loaded when the game opens.
// The brain itself evolves independently through the scheduled headless self-play trainer.
let brain={version:1,episodes:0,epsilon:.18,q:{}},brainReady=false,brainStatus="LOCAL POLICY";
async function loadBrain(){
  try{
    const r=await fetch("brain.json?v="+Date.now(),{cache:"no-store"});
    if(r.ok){brain=await r.json();brainReady=true;brainStatus="PERSISTENT BRAIN • "+Number(brain.episodes||0).toLocaleString()+" EPISODES";}
  }catch(e){brainStatus="LOCAL FALLBACK";}
  const el=document.getElementById("aiStats"); if(el)el.textContent="AI: persistent Q-brain • self-play evolution • maze pathfinding • danger prediction • "+brainStatus;
}
function brainState(){
  const gs=ghosts.map(g=>Math.min(9,Math.abs(p.x-g.x)+Math.abs(p.y-g.y))).sort((a,b)=>a-b);
  let pd=9,fd=9;
  powers.forEach(k=>{const x=k%T,y=Math.floor(k/T);pd=Math.min(pd,Math.abs(x-p.x)+Math.abs(y-p.y))});
  pellets.forEach(k=>{const x=k%T,y=Math.floor(k/T);fd=Math.min(fd,Math.abs(x-p.x)+Math.abs(y-p.y))});
  return p.x+","+p.y+","+dir.x+","+dir.y+","+gs.join("|")+","+Math.min(9,pd)+","+Math.min(9,fd)+","+(powered?1:0);
}
function brainAction(){
  const q=brain.q?.[brainState()]; if(!q)return null;
  const ds=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}], candidates=ds.map((d,i)=>({d,i})).filter(o=>can(p,o.d));
  if(!candidates.length)return null;
  candidates.sort((a,b)=>(q[b.i]??0)-(q[a.i]??0));
  return candidates[0].d;
}

let score=0,level=1,lives=3,paused=false,ready=true,over=false,powered=0,ai=false,aiMoves=0,aiTarget=null,aiThink=0;
let p,ghosts,pellets=new Set(),powers=new Set(),dir={x:0,y:0},next={x:0,y:0},last=0;
function show(m){document.getElementById('message').textContent=m;document.getElementById('panel').classList.add('show')}
function hide(){document.getElementById('panel').classList.remove('show')}
function hud(){document.getElementById("score").textContent=String(score).padStart(6,"0");document.getElementById("level").textContent=level;document.getElementById("lives").textContent="●".repeat(lives)+"○".repeat(3-lives);document.getElementById("mode").textContent=ai?"AI":"HUMAN"}
function selectMazeForLevel(){
  if(!mazeBrainReady||!Array.isArray(mazeBrain.levels)||!mazeBrain.levels.length)return;
  const m=mazeBrain.levels[(level-1)%mazeBrain.levels.length];
  if(Array.isArray(m)&&m.length===T)rows=m.map(r=>[...r].map(c=>c==="#"?1:0));
}
function reset(){
 p={x:14,y:26};dir={x:0,y:0};next={x:0,y:0};powered=0;pellets.clear();powers.clear();
 for(let y=0;y<T;y++)for(let x=0;x<T;x++)if(open(x,y)&&!(x==14&&y>=24))pellets.add(id(x,y));
 [[1,1],[26,1],[1,26],[26,26]].forEach(([x,y])=>powers.add(id(x,y)));
 ghosts=[{x:13,y:12,dx:1,dy:0,c:"#ff4b5c",f:0},{x:14,y:12,dx:-1,dy:0,c:"#38d9ff",f:0},{x:15,y:12,dx:0,dy:-1,c:"#ff54d8",f:0}];
 ready=true;show("READY!");setTimeout(()=>{if(!over){ready=false;hide()}},750);
}
function can(e,d){return open(e.x+d.x,e.y+d.y)}
function choose(g){
 let a=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>can(g,d));
 if(!a.length)return;
 a.sort((u,v)=>{let du=(g.x+u.x-p.x)**2+(g.y+u.y-p.y)**2,dv=(g.x+v.x-p.x)**2+(g.y+v.y-p.y)**2;return g.f?dv-du:du-dv});
 g.dx=a[0].x;g.dy=a[0].y;
}
function bfsPath(sx,sy,tx,ty){
 const q=[[sx,sy]],prev=new Map([[id(sx,sy),null]]),ds=[[1,0],[-1,0],[0,1],[0,-1]];
 while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;for(const [dx,dy] of ds){let nx=x+dx,ny=y+dy;if(nx<0)nx=T-1;if(nx>=T)nx=0;if(!open(nx,ny))continue;let k=id(nx,ny);if(!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny])}}}
 const end=id(tx,ty);if(!prev.has(end))return null;let cur=[tx,ty];while(prev.get(id(cur[0],cur[1]))!==null){let pr=prev.get(id(cur[0],cur[1]));if(pr[0]===sx&&pr[1]===sy)return {x:cur[0]-sx||((cur[0]===T-1&&sx===0)?-1:((cur[0]===0&&sx===T-1)?1:0)),y:cur[1]-sy};cur=pr}return null;
}
function aiDanger(x,y){let n=0;ghosts.forEach(g=>{if(g.f)return;let d=Math.abs(x-g.x)+Math.abs(y-g.y);if(d<=5)n+=(6-d)*(powered?8:55)});return n}
function aiChoose(){
 const moves=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>can(p,d));if(!moves.length)return;
 let best=null,bestCost=1e9;
 for(const d of moves){const nx=(p.x+d.x+T)%T,ny=p.y+d.y;if(!open(nx,ny))continue;let cost=aiDanger(nx,ny);if(aiTarget){const step=bfsPath(nx,ny,aiTarget.x,aiTarget.y);if(step)cost+=(Math.abs(nx-aiTarget.x)+Math.abs(ny-aiTarget.y))*2;}if(pellets.has(id(nx,ny)))cost-=35;if(powers.has(id(nx,ny)))cost-=powered?5:140;if(d.x===-dir.x&&d.y===-dir.y)cost+=8;if(cost<bestCost){bestCost=cost;best=d}}
 if(best){next=best;aiMoves++}
}
function aiPlan(){
 let best=null,bd=1e9;
 powers.forEach(k=>{let x=k%T,y=Math.floor(k/T),d=Math.abs(x-p.x)+Math.abs(y-p.y);if(powered===0&&d<bd){bd=d;best={x,y}}});
 if(!best)pellets.forEach(k=>{let x=k%T,y=Math.floor(k/T),d=Math.abs(x-p.x)+Math.abs(y-p.y);if(d<bd){bd=d;best={x,y}}});
 aiTarget=best;
}
function update(){
 if(paused||ready||over)return;
 if(ai){if(++aiThink%3===0||!aiTarget)aiPlan(); const learned=brainAction(); if(learned)next=learned; else aiChoose()}
 if(can(p,next))dir=next;
 if(!can(p,dir))dir={x:0,y:0};
 p.x+=dir.x;p.y+=dir.y;
 let k=id(p.x,p.y);
 if(pellets.delete(k))score+=10;
 if(powers.delete(k)){score+=50;powered=80;ghosts.forEach(g=>g.f=80)}
 ghosts.forEach(g=>{
  if(Math.random()<.35||!can(g,{x:g.dx,y:g.dy}))choose(g);
  g.x+=g.dx;g.y+=g.dy;if(g.x<0)g.x=T-1;if(g.x>=T)g.x=0;
  if(g.x==p.x&&g.y==p.y){if(g.f){score+=200;g.x=14;g.y=12;g.f=0}else{lives--;hud();if(lives<=0){over=true;show("GAME OVER — PRESS R")}else{resetPos();ready=true;show("OUCH!");setTimeout(()=>{ready=false;hide()},700)}}}
  g.f=Math.max(0,g.f-1);
 });
 powered=Math.max(0,powered-1);
 if(!pellets.size){score+=1000;level++;hud();reset()}
 hud();
}
function resetPos(){p={x:14,y:26};dir={x:0,y:0};next={x:0,y:0};ghosts.forEach((g,i)=>{g.x=13+i;g.y=12;g.dx=i? -1:1;g.dy=0;g.f=0})}
function draw(){
 X.clearRect(0,0,C.width,C.height);
 // TRUE 3D DEPTH: every maze cell is rendered as a beveled block with floor, top edge and side depth.
 let bg=X.createRadialGradient(C.width/2,C.height/2,30,C.width/2,C.height/2,C.width*.72);bg.addColorStop(0,"#10134a");bg.addColorStop(.55,"#03041a");bg.addColorStop(1,"#000006");X.fillStyle=bg;X.fillRect(0,0,C.width,C.height);
 for(let y=0;y<T;y++)for(let x=0;x<T;x++)if(rows[y][x]){const z=7; X.shadowBlur=9; X.shadowColor="#152cff"; X.fillStyle="#07104b"; X.fillRect(x*S,y*S+z,S,S); X.shadowBlur=0; X.fillStyle="#101d75"; X.fillRect(x*S,y*S,S,S-z); X.fillStyle="#294dff"; X.fillRect(x*S+1,y*S+1,S-2,3); X.fillStyle="#05082c"; X.fillRect(x*S+2,y*S+S-5,S-4,4); X.strokeStyle="#5870ff"; X.lineWidth=1.2; X.strokeRect(x*S+1,y*S+1,S-2,S-2); X.strokeStyle="#1728a0"; X.strokeRect(x*S+4,y*S+4,S-8,S-8)}
 X.globalAlpha=.22;X.strokeStyle="#405cff";X.lineWidth=1;for(let i=0;i<18;i++){X.beginPath();X.moveTo(0,i*S*2);X.lineTo(C.width,i*S*2);X.stroke()}X.globalAlpha=1;X.shadowBlur=0;X.fillStyle="#ffe98a";pellets.forEach(k=>{let x=k%T,y=Math.floor(k/T);X.beginPath();X.arc((x+.5)*S,(y+.5)*S,1.7,0,TAU);X.fill()});
 powers.forEach(k=>{let x=k%T,y=Math.floor(k/T),r=4+Math.sin(Date.now()/120)*1.3;X.fillStyle="#fff35a";X.shadowBlur=13;X.shadowColor="#ffe000";X.beginPath();X.arc((x+.5)*S,(y+.5)*S,r,0,TAU);X.fill();X.shadowBlur=0});
 let px=(p.x+.5)*S,py=(p.y+.5)*S,r=S*.37,g=X.createRadialGradient(px-r*.35,py-r*.4,2,px,py,r);g.addColorStop(0,"#fffbd1");g.addColorStop(.3,"#ffe43d");g.addColorStop(.75,"#ff9700");g.addColorStop(1,"#b92f00");X.fillStyle=g;X.shadowBlur=18;X.shadowColor="#ffd400";X.beginPath();X.arc(px,py-5,r,0,TAU);X.fill();X.shadowBlur=0;X.fillStyle="#ff8b00";X.globalAlpha=.35;X.beginPath();X.ellipse(px,py+r*.65,r*.9,r*.28,0,0,TAU);X.fill();X.globalAlpha=1;
 ghosts.forEach(q=>{let x=(q.x+.5)*S,y=(q.y+.5)*S,r=S*.34;X.fillStyle=q.f?"#6976ff":q.c;X.shadowBlur=16;X.shadowColor=X.fillStyle;X.beginPath();X.arc(x,y-5,r,0,TAU);X.fill();X.shadowBlur=0;X.fillStyle="#111";X.globalAlpha=.35;X.beginPath();X.ellipse(x,y+r*.62,r*.85,r*.24,0,0,TAU);X.fill();X.globalAlpha=1;X.shadowBlur=0;X.fillStyle="#fff";X.beginPath();X.arc(x-r*.28,y-r*.1,r*.18,0,TAU);X.arc(x+r*.28,y-r*.1,r*.18,0,TAU);X.fill();X.fillStyle="#111";X.beginPath();X.arc(x-r*.23,y-r*.08,r*.08,0,TAU);X.arc(x+r*.33,y-r*.08,r*.08,0,TAU);X.fill()})
}
function loop(t){if(t-last>110){update();last=t}draw();requestAnimationFrame(loop)}
addEventListener("keydown",e=>{let k=e.key.toLowerCase(),d={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}}[k];if(d)next=d;if(k=="p"){paused=!paused;if(paused)show("PAUSED");else hide()}if(k=="r"){score=0;level=1;lives=3;over=false;aiMoves=0;reset();hud()}});
document.getElementById("aiToggle").addEventListener("click",()=>{ai=!ai;document.getElementById("aiToggle").textContent=ai?"🤖 AI PLAYER: ON":"🤖 AI PLAYER: OFF";if(ai){paused=false;ready=false;hide();aiPlan()}hud()});
document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("pointerdown",()=>{let m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};next=m[b.dataset.d]}));
loadMazeBrain().then(()=>{hud();reset();loadBrain();requestAnimationFrame(loop)});
</script></body></html>
