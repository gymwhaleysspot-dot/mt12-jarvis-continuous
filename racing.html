<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<title>Jarvis Racing</title>
<style>
:root{--bg:#02060a;--panel:#07131d;--line:#1d3d52;--text:#f3fbff;--muted:#85a4b7;--cyan:#63e6ff;--green:#75ee9d;--amber:#ffd56c;--red:#ff667a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#123a58 0,#05111a 34%,#02060a 70%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit}.shell{height:100svh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.brand{display:flex;align-items:center;gap:10px;min-width:0}.reactor{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 0 9%,#61e9ff 11% 28%,#1588c6 31% 50%,#06111a 52%);box-shadow:0 0 25px #42dfff77}.brand b{display:block;letter-spacing:.14em;font-size:13px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.stats{display:flex;gap:7px}.stat{min-width:74px;padding:6px 9px;border:1px solid var(--line);border-radius:10px;background:#07131ddd;text-align:center}.stat span{display:block;font-size:8px;letter-spacing:.12em;color:var(--muted)}.stat b{font-size:16px}.game-wrap{position:relative;min-height:0;border:1px solid #24485e;border-radius:20px;overflow:hidden;background:#02070b;box-shadow:0 18px 55px #000a}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#02070b88,#02070bd9);padding:20px;text-align:center}.overlay[hidden]{display:none}.card{width:min(520px,94%);padding:22px;border:1px solid #315f7a;border-radius:20px;background:#07131df0;box-shadow:0 24px 80px #000c}.kicker{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.15em}.card h1{font-size:clamp(34px,8vw,64px);line-height:.95;margin:8px 0 10px;letter-spacing:-.05em}.card p{color:#a7bfce;margin:0 auto 16px;max-width:430px}.btn{border:1px solid #37627a;background:#10283a;color:#fff;border-radius:12px;padding:12px 18px;font-weight:900}.btn.primary{border:0;background:linear-gradient(135deg,#ffe67a,#ff9b43);color:#1b1003}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.pad{display:grid;grid-template-columns:repeat(2,minmax(72px,110px));gap:8px}.pad.right{justify-content:end}.ctrl{height:58px;border:1px solid #2f5870;border-radius:15px;background:#0b1c29dd;color:#e8f7ff;font-size:18px;font-weight:950;touch-action:none;user-select:none}.ctrl:active,.ctrl.on{background:#17374d;border-color:#67dfff;transform:translateY(1px)}.ctrl.go{background:#123421;border-color:#32784a}.ctrl.brake{background:#32141a;border-color:#6f3440}.center-readout{text-align:center;color:var(--muted);font-size:9px;letter-spacing:.1em;white-space:nowrap}.center-readout b{display:block;color:var(--amber);font-size:12px;margin-top:2px}.boostbar{position:absolute;left:14px;right:14px;bottom:12px;height:7px;border-radius:999px;background:#091923aa;border:1px solid #25475c;overflow:hidden;pointer-events:none}.boostbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#45d6ff,#8fffae,#ffe077)}.message{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:#030b11cc;border:1px solid #2d5870;font-size:11px;font-weight:900;letter-spacing:.08em;opacity:0;transition:.2s;pointer-events:none}.message.show{opacity:1}.best{color:var(--green)}@media(max-width:680px){.shell{gap:7px}.hud{grid-template-columns:1fr}.stats{display:grid;grid-template-columns:repeat(4,1fr)}.stat{min-width:0;padding:5px 4px}.stat b{font-size:13px}.brand{display:none}.game-wrap{border-radius:15px}.controls{grid-template-columns:1fr 1fr}.center-readout{display:none}.pad{grid-template-columns:1fr 1fr}.ctrl{height:54px}}
</style>
</head>
<body>
<div class="shell">
  <header class="hud">
    <div class="brand"><span class="reactor"></span><div><b>JARVIS RACING</b><small>Arcade sprint simulator · touch + keyboard</small></div></div>
    <div class="stats">
      <div class="stat"><span>SPEED</span><b id="speed">0</b></div>
      <div class="stat"><span>LAP</span><b id="lap">1/3</b></div>
      <div class="stat"><span>POSITION</span><b id="pos">1/6</b></div>
      <div class="stat"><span>TIME</span><b id="time">0.0</b></div>
    </div>
  </header>
  <main class="game-wrap" id="wrap">
    <canvas id="game"></canvas>
    <div class="message" id="message">BOOST</div>
    <div class="boostbar"><i id="boostFill"></i></div>
    <div class="overlay" id="startOverlay">
      <div class="card">
        <div class="kicker">JARVIS // STREET CIRCUIT 01</div>
        <h1>NIGHT RUN</h1>
        <p>Three laps. Beat five Jarvis AI racers. Stay on the road, draft traffic for boost, and hit boost on the straights.</p>
        <div class="row"><button class="btn primary" id="start">START RACE</button></div>
      </div>
    </div>
    <div class="overlay" id="finishOverlay" hidden>
      <div class="card">
        <div class="kicker">RACE COMPLETE</div>
        <h1 id="finishTitle">P1</h1>
        <p id="finishText"></p>
        <div class="row"><button class="btn primary" id="again">RACE AGAIN</button></div>
      </div>
    </div>
  </main>
  <footer class="controls">
    <div class="pad">
      <button class="ctrl" data-key="left">◀</button>
      <button class="ctrl" data-key="right">▶</button>
    </div>
    <div class="center-readout">KEYBOARD<b>← → / W S / SPACE</b></div>
    <div class="pad right">
      <button class="ctrl brake" data-key="brake">BRAKE</button>
      <button class="ctrl go" data-key="gas">GO</button>
    </div>
  </footer>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap');
const speedEl=document.getElementById('speed'),lapEl=document.getElementById('lap'),posEl=document.getElementById('pos'),timeEl=document.getElementById('time'),boostFill=document.getElementById('boostFill'),msg=document.getElementById('message');
const startOverlay=document.getElementById('startOverlay'),finishOverlay=document.getElementById('finishOverlay'),finishTitle=document.getElementById('finishTitle'),finishText=document.getElementById('finishText');
const keys={left:false,right:false,gas:false,brake:false,boost:false};
let W=0,H=0,dpr=1,last=0,running=false,startTime=0,finishTime=0,roadScroll=0,shake=0;
const trackLength=5600,totalLaps=3;
const player={x:0,speed:0,max:330,progress:0,lap:1,boost:100,finished:false};
let bots=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){player.x=0;player.speed=0;player.progress=0;player.lap=1;player.boost=100;player.finished=false;roadScroll=0;finishTime=0;bots=Array.from({length:5},(_,i)=>({x:rnd(-.62,.62),speed:rnd(205,285)+i*5,progress:-i*100-rnd(50,300),laneTimer:rnd(.4,2),targetX:rnd(-.65,.65),color:['#ff6c7c','#71dcff','#ffd36b','#8cf09d','#c28dff'][i]}));updateHud()}
function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(320,Math.floor(r.width));H=Math.max(300,Math.floor(r.height));canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();
function roadCenter(y,t){const z=1-y/H;return W*.5+Math.sin((roadScroll*.0015)+z*4.8)*W*.095+Math.sin((roadScroll*.00055)+z*2.2)*W*.06}
function roadHalf(y){const p=y/H;return W*(.12+.32*p)}
function carYFromDistance(d){const n=1-clamp(d/900,0,1);return H*(.16+.72*n)}
function drawRoad(){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#07121a');grad.addColorStop(1,'#020406');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#0b2717';ctx.fillRect(0,H*.12,W,H*.88);const strips=80;for(let i=0;i<strips;i++){const y1=H*.08+(H*.94)*i/strips,y2=H*.08+(H*.94)*(i+1)/strips;const c1=roadCenter(y1),c2=roadCenter(y2),h1=roadHalf(y1),h2=roadHalf(y2);ctx.beginPath();ctx.moveTo(c1-h1,y1);ctx.lineTo(c1+h1,y1);ctx.lineTo(c2+h2,y2);ctx.lineTo(c2-h2,y2);ctx.closePath();ctx.fillStyle=i%2?'#1a2025':'#1d2328';ctx.fill();if(i%8===0){ctx.strokeStyle='#d8e2e6aa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c1,y1);ctx.lineTo(c2,y2);ctx.stroke()}if((i+Math.floor(roadScroll/80))%6===0){ctx.fillStyle='#fff';ctx.fillRect(c1-h1-4,y1,4,Math.max(4,y2-y1));ctx.fillStyle='#ff5d65';ctx.fillRect(c1+h1,y1,4,Math.max(4,y2-y1))}}
for(let i=0;i<15;i++){const y=(i*97+roadScroll*.7)%H;const c=roadCenter(y),h=roadHalf(y);ctx.fillStyle=i%2?'#1b7a42':'#2e9a52';ctx.fillRect(c-h-30-(i%3)*14,y,7,16);ctx.fillRect(c+h+22+(i%4)*11,y,7,18)}}
function drawCar(x,y,scale,color,isPlayer=false){ctx.save();ctx.translate(x+ (shake?rnd(-shake,shake):0),y);ctx.scale(scale,scale);ctx.fillStyle='#0008';ctx.fillRect(-18,-28,36,64);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-17,-31,34,62,8);ctx.fill();ctx.fillStyle='#09131b';ctx.beginPath();ctx.roundRect(-11,-19,22,21,5);ctx.fill();ctx.fillStyle='#bdefff';ctx.fillRect(-9,-17,18,7);ctx.fillStyle=isPlayer?'#ffe36f':'#f5fbff';ctx.fillRect(-12,23,7,4);ctx.fillRect(5,23,7,4);ctx.fillStyle='#020405';ctx.fillRect(-21,-18,5,15);ctx.fillRect(16,-18,5,15);ctx.fillRect(-21,11,5,15);ctx.fillRect(16,11,5,15);if(isPlayer&&keys.boost&&player.boost>0&&player.speed>80){ctx.fillStyle='#5de8ff';ctx.beginPath();ctx.moveTo(-8,32);ctx.lineTo(-2,48+rnd(0,12));ctx.lineTo(3,32);ctx.fill();ctx.fillStyle='#ffd66e';ctx.beginPath();ctx.moveTo(4,32);ctx.lineTo(9,44+rnd(0,10));ctx.lineTo(12,32);ctx.fill()}ctx.restore()}
function update(dt){if(!running)return;let steer=(keys.right?1:0)-(keys.left?1:0);let accel=keys.gas?150:45;if(keys.brake)accel=-260;if(keys.boost&&player.boost>0&&player.speed>70){accel+=210;player.boost=Math.max(0,player.boost-34*dt)}else player.boost=Math.min(100,player.boost+7*dt);player.speed+=accel*dt;player.speed-=player.speed*.16*dt;const off=Math.abs(player.x)>.84;if(off){player.speed-=150*dt;shake=Math.min(3,shake+8*dt)}else shake=Math.max(0,shake-12*dt);player.speed=clamp(player.speed,0,player.max+(keys.boost?70:0));player.x+=steer*(1.05+.95*(player.speed/player.max))*dt;player.x=clamp(player.x,-1.18,1.18);const meters=player.speed*dt*.2778;player.progress+=meters;roadScroll+=player.speed*dt*2.25;
for(const b of bots){b.laneTimer-=dt;if(b.laneTimer<=0){b.laneTimer=rnd(.7,2.5);b.targetX=rnd(-.72,.72)}b.x+=(b.targetX-b.x)*dt*rnd(.7,1.35);b.progress+=b.speed*dt*.2778;if(b.progress>trackLength*totalLaps)b.progress=trackLength*totalLaps;const d=b.progress-player.progress;if(d>-25&&d<85&&Math.abs(b.x-player.x)<.22){if(d<28){player.speed*=.84;player.x+=(player.x>b.x?.12:-.12);shake=5;showMessage('CONTACT')}else if(d<70&&player.speed>b.speed*.92){player.boost=Math.min(100,player.boost+14*dt)}}}
player.lap=Math.min(totalLaps,Math.floor(player.progress/trackLength)+1);if(player.progress>=trackLength*totalLaps&&!player.finished){player.finished=true;finishTime=(performance.now()-startTime)/1000;running=false;showFinish()}updateHud()}
function position(){let ahead=0;for(const b of bots)if(b.progress>player.progress)ahead++;return ahead+1}
function updateHud(){speedEl.textContent=Math.round(player.speed);lapEl.textContent=`${player.lap}/${totalLaps}`;posEl.textContent=`${position()}/6`;timeEl.textContent=((running?performance.now()-startTime:finishTime*1000)/1000).toFixed(1);boostFill.style.width=player.boost+'%'}
let msgTimer=0;function showMessage(t){msg.textContent=t;msg.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>msg.classList.remove('show'),600)}
function draw(){drawRoad();const racers=bots.map(b=>({b,d:b.progress-player.progress})).filter(o=>o.d>-50&&o.d<900).sort((a,b)=>b.d-a.d);for(const o of racers){const y=carYFromDistance(o.d),rw=roadHalf(y),cx=roadCenter(y);drawCar(cx+o.b.x*rw*.78,y,.45+.62*(y/H),o.b.color)}const py=H*.82,pc=roadCenter(py),ph=roadHalf(py);drawCar(pc+player.x*ph*.78,py,1.0,'#ffb647',true);if(running){ctx.fillStyle='#ffffff12';for(let i=0;i<18;i++){const x=rnd(0,W),y=rnd(H*.55,H);ctx.fillRect(x,y,1,rnd(8,30)*(player.speed/player.max))}}}
function loop(ts){const dt=Math.min(.035,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function begin(){reset();startOverlay.hidden=true;finishOverlay.hidden=true;running=true;startTime=performance.now();last=performance.now();showMessage('GO')}
function showFinish(){const p=position();finishTitle.textContent='P'+p;const best=localStorage.getItem('jarvis-racing-best');const won=p===1;let bestText='';if(!best||finishTime<Number(best)){localStorage.setItem('jarvis-racing-best',finishTime.toFixed(3));bestText=' · NEW BEST';}finishText.innerHTML=`${won?'Victory. Jarvis gives you the circuit.':'Race complete.'} Time <b>${finishTime.toFixed(2)}s</b>${bestText?` <span class="best">${bestText}</span>`:''}`;finishOverlay.hidden=false}
document.getElementById('start').onclick=begin;document.getElementById('again').onclick=begin;
const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'gas',w:'gas',W:'gas',ArrowDown:'brake',s:'brake',S:'brake',' ':'boost'};addEventListener('keydown',e=>{const k=map[e.key];if(k){keys[k]=true;e.preventDefault()}});addEventListener('keyup',e=>{const k=map[e.key];if(k){keys[k]=false;e.preventDefault()}});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on')},off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){keys.boost=true;showMessage('BOOST')}});canvas.addEventListener('pointerup',()=>keys.boost=false);canvas.addEventListener('pointercancel',()=>keys.boost=false);
})();
</script>
</body>
</html>
