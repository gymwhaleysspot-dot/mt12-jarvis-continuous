<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Michael System Health</title><style>body{font-family:system-ui;background:#101216;color:#eef;margin:0;padding:20px}h1{margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#1a1e25;border:1px solid #303746;border-radius:14px;padding:14px}.v{font-size:28px;font-weight:700}.ok{color:#7ee787}.warn{color:#f2cc60}.bad{color:#ff7b72}small{color:#9da7b3}pre{white-space:pre-wrap;font-size:12px}.bar{height:8px;background:#303746;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#58a6ff}</style></head><body><h1>Michael · Jarvis · Nickelle · Keleb</h1><p><small id="stamp">Loading isolated AI state…</small></p><div class="grid" id="cards"></div><h2>Latest Promotion Ledger</h2><div class="card"><pre id="ledger">Loading…</pre></div><script>const base='https://raw.githubusercontent.com/gymwhaleysspot-dot/mt12-jarvis-continuous/ai-state/';async function j(p){const r=await fetch(base+p+'?t='+Date.now());if(!r.ok)throw Error(p+' '+r.status);return r.json()}function n(v,d=3){return Number.isFinite(+v)?(+v).toFixed(d):'—'}function card(t,v,s='',c=''){return `<div class="card"><small>${t}</small><div class="v ${c}">${v}</div><div>${s}</div></div>`}async function run(){try{const[h,l,x,k]=await Promise.all([j('michael/system/health.json'),j('michael/system/promotion-ledger.json'),j('michael/system/cross-agent-tournament.json').catch(()=>null),j('keleb/measured-state.json').catch(()=>null)]);document.getElementById('stamp').textContent='Updated '+h.generatedAt+' · source '+h.sourceSha;const g=h.graphics||{},c=h.controller||{},i=h.interior||{};document.getElementById('cards').innerHTML=card('Overall',h.overall,h.compatibility?.reason||'',h.overall==='INTEGRATED_PASS'?'ok':'warn')+card('Graphics benchmark',n(g.benchmark),'Reality gap '+n(g.realityGap),g.benchmark>=.7?'ok':'warn')+card('Topology debt',g.topologyDebt??'—','Optimizer '+(g.optimizer||'—'),g.topologyDebt===0?'ok':'warn')+card('Keleb cockpit',k?('error '+n(k.meanError)):'—',k?`${k.truthImages} truth images · gate ${k.promotionGate?.pass?'PASS':'HOLD'}`:'Measured state pending',k?.promotionGate?.pass?'ok':'warn')+card('JRW controller',c.candidate||'—',`${c.build||''} · ${c.luacBytes||'—'} bytes · road ${c.roadRequired?'required':'gate unknown'}`,c.promotionEligible?'ok':'warn')+card('Cross-agent',x?(x.pass?'PASS':'HOLD'):'—',x?`combined ${n(x.combinedScore)}`:'Tournament pending',x?.pass?'ok':'warn')+card('Ledger events',l.events?.length??0,'Exterior · Interior · Controller ancestry')+card('Deployment state','ISOLATED','AI memory → ai-state · deploy source → main','ok');document.getElementById('ledger').textContent=JSON.stringify((l.events||[]).slice(-12).reverse(),null,2)}catch(e){document.getElementById('stamp').textContent='Dashboard state unavailable: '+e.message}}run();setInterval(run,60000)</script></body></html>
