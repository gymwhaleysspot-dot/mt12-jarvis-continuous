name: Pac-Marble Maze AI Evolution
on:
  workflow_dispatch:
concurrency:
  group: pac-marble-evolution
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate AI mazes
        run: |
          python3 tools/pac_marble_maze.py
          python3 - <<'PY'
          import json
          d=json.load(open("maze-brain.json"))
          assert d.get("version")==3
          assert len(d.get("levels",[]))==12
          assert all(len(z)==28 and all(len(r)==28 for r in z) for z in d["levels"])
          print("validated maze brain generation", d.get("generation"))
          PY
      - name: Save maze brain
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Evolve Pac-Marble maze brain"
          file_pattern: maze-brain.json
