name: Pac-Marble Maze AI Evolution
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/pac_marble_maze.py"
      - ".github/workflows/pac-marble-maze.yml"
      - "marble-pacman.html"
  schedule:
    - cron: "07,37 * * * *"
concurrency:
  group: pac-marble-evolution
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase latest main before maze evolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Build and evolve AI mazes
        run: python3 tools/pac_marble_maze.py
      - name: Validate and save maze brain
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Evolve Pac-Marble persistent AI maze brain"
          file_pattern: maze-brain.json
      - name: Verify saved maze brain
        run: python3 -c 'import json; d=json.load(open("maze-brain.json")); assert len(d.get("levels",[]))==12; assert all(len(r)==28 for z in d["levels"] for r in z)'
