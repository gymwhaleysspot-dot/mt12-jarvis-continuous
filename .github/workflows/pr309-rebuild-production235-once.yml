name: PR309 one-time Survivor 235 artifact rebuild
on:
  push:
    branches: [agent/survivor-235-full-audit-fixes]
    paths:
      - 'jarvis/production201-replay46-total-repair.inc.js'
      - '.github/workflows/pr309-rebuild-production235-once.yml'
permissions:
  contents: write
concurrency:
  group: pr309-rebuild-production235-once
  cancel-in-progress: true
jobs:
  rebuild-and-browser-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/survivor-235-full-audit-fixes
      - name: Rebuild canonical Production 235 artifact
        run: |
          set -Eeuo pipefail
          cp survivor.html /tmp/survivor-source.html
          node <<'NODE'
          const fs=require('fs'),p='survivor.html';let h=fs.readFileSync(p,'utf8');
          const rx=/jarvis\/core-survivor(?:-(?:221|230|231|234|235))?\.js(?:\?v=[^"'<>\s]*)?/g,refs=h.match(rx)||[];
          if(refs.length!==1)throw Error(`Expected one canonical source loader, found ${refs.length}`);
          h=h.replace(rx,'jarvis/core-survivor.js?v=production235-assembly-bootstrap');fs.writeFileSync(p,h);
          NODE
          for n in 204 205 206 207 209 210 211 212 213 215 217 218 219 220 222 224 225 227 229 230 231 234 235; do node "tools/build-survivor-production${n}.mjs"; done
          cp /tmp/survivor-source.html survivor.html
          node --check jarvis/core-survivor-235.js
          node tools/test-survivor-production235-contract.mjs
          git diff --exit-code -- jarvis/core-survivor-235.js
      - name: Install Playwright browser engines
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute Chromium and WebKit runtime gates
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          status=0
          SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/chromium node tools/survivor-runtime-smoke.mjs chromium > artifacts/chromium.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/webkit node tools/survivor-runtime-smoke.mjs webkit > artifacts/webkit.log 2>&1 || status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record executable runtime gate result
        run: |
          set -Eeuo pipefail
          code='${{ steps.browser.outputs.exit_code }}'
          {
            echo "PR309 Survivor Production 235 executable runtime gate"
            echo "head=$(git rev-parse HEAD)"
            echo "production=235"
            echo "chromium+webkit exit_code=$code"
            echo
            echo '--- chromium ---'
            cat artifacts/chromium.log 2>/dev/null || true
            echo
            echo '--- webkit ---'
            cat artifacts/webkit.log 2>/dev/null || true
          } > pr309-runtime-gate.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr309-runtime-gate.txt
          git commit -m "test(survivor): record PR309 browser runtime gate" || true
          git push origin HEAD:agent/survivor-235-full-audit-fixes
          test "$code" = 0
