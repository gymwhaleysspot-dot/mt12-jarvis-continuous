name: PR309 one-time Survivor 235 artifact rebuild
on:
  push:
    branches: [agent/survivor-235-full-audit-fixes]
    paths:
      - '.github/workflows/pr309-rebuild-production235-once.yml'
permissions:
  contents: write
concurrency:
  group: pr309-rebuild-production235-once
  cancel-in-progress: true
jobs:
  executable-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/survivor-235-full-audit-fixes
      - name: Patch source authority, rebuild, execute, and persist diagnostics
        run: |
          set +e
          mkdir -p artifacts
          status=0
          cp survivor.html /tmp/survivor-source.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jarvis/core-survivor.js')
          s=p.read_text()
          old='const p132CombatEvent=combatEvent;combatEvent=function(type,data={})'
          new='let p132CombatEvent=combatEvent;combatEvent=function(type,data={})'
          if old not in s and new not in s:
              raise SystemExit('Production 132 event hook declaration not found')
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          {
            echo '=== canonical rebuild ==='
            node <<'NODE'
          const fs=require('fs'),p='survivor.html';let h=fs.readFileSync(p,'utf8');
          const rx=/jarvis\/core-survivor(?:-(?:221|230|231|234|235))?\.js(?:\?v=[^"'<>\s]*)?/g,refs=h.match(rx)||[];
          if(refs.length!==1)throw Error(`Expected one canonical source loader, found ${refs.length}`);
          h=h.replace(rx,'jarvis/core-survivor.js?v=production235-assembly-bootstrap');fs.writeFileSync(p,h);
          NODE
            for n in 204 205 206 207 209 210 211 212 213 215 217 218 219 220 222 224 225 227 229 230 231 234 235; do node "tools/build-survivor-production${n}.mjs" || exit $?; done
            cp /tmp/survivor-source.html survivor.html
            node --check jarvis/core-survivor-235.js || exit $?
            node tools/test-survivor-production235-contract.mjs || exit $?
          } > artifacts/rebuild.log 2>&1 || status=$?
          cp /tmp/survivor-source.html survivor.html
          if [ "$status" -eq 0 ]; then
            echo '=== playwright install ===' > artifacts/install.log
            npm install --no-save playwright@1.55.0 >> artifacts/install.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then npx playwright install --with-deps chromium webkit >> artifacts/install.log 2>&1 || status=$?; fi
          fi
          if [ "$status" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/http.log 2>&1 &
            server=$!
            sleep 1
            SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/chromium node tools/survivor-runtime-smoke.mjs chromium > artifacts/chromium.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/webkit node tools/survivor-runtime-smoke.mjs webkit > artifacts/webkit.log 2>&1 || status=$?; fi
            kill "$server" 2>/dev/null || true
          fi
          {
            echo "PR309 Survivor Production 235 executable runtime gate"
            echo "tested_head=$(git rev-parse HEAD)"
            echo "production=235"
            echo "exit_code=$status"
            echo
            echo '--- rebuild ---'
            cat artifacts/rebuild.log 2>/dev/null || true
            echo
            echo '--- chromium ---'
            cat artifacts/chromium.log 2>/dev/null || true
            echo
            echo '--- webkit ---'
            cat artifacts/webkit.log 2>/dev/null || true
          } > pr309-runtime-gate.txt
          git restore -- survivor.html jarvis/core-survivor-204.js jarvis/core-survivor-205.js jarvis/core-survivor-206.js jarvis/core-survivor-207.js jarvis/core-survivor-209.js jarvis/core-survivor-210.js jarvis/core-survivor-211.js jarvis/core-survivor-212.js jarvis/core-survivor-213.js jarvis/core-survivor-215.js jarvis/core-survivor-217.js jarvis/core-survivor-218.js jarvis/core-survivor-219.js jarvis/core-survivor-220.js jarvis/core-survivor-222.js jarvis/core-survivor-224.js jarvis/core-survivor-225.js jarvis/core-survivor-227.js jarvis/core-survivor-229.js jarvis/core-survivor-230.js jarvis/core-survivor-231.js jarvis/core-survivor-234.js 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jarvis/core-survivor.js jarvis/core-survivor-235.js pr309-runtime-gate.txt
          git commit -m 'fix(survivor): make legacy event hook safely rebindable' || true
          git push origin HEAD:agent/survivor-235-full-audit-fixes
          exit "$status"
