name: Dispatch JRW6D Rewrite Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-jrw6d-rewrite.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Launch verified JRW6D rewrite generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/jarvis-complete-rewrite-factory.yml/dispatches" -f ref=main
