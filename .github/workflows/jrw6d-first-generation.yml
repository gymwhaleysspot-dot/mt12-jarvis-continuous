name: JRW6D First Generation Bootstrap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jrw6d-first-generation.yml
permissions:
  contents: write
  actions: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Repair stale rewrite parent assertion
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/jarvis-complete-rewrite-factory.yml')
          s=p.read_text()
          old="assert name=='a17zr1'"
          new="assert name=='jrw6d'"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('rewrite parent assertion not recognized')
          PY
          git config user.name 'Jarvis Engineering Authority'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/jarvis-complete-rewrite-factory.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Require JRW6D canonical parent in Rewrite Factory'
            for n in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              git rebase --abort || true
              sleep $((n*3))
            done
          fi
      - name: Verify live canonical parent
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import jarvis_canonical_parent as c
          name,path=c.resolve()
          assert name=='jrw6d', name
          text=path.read_text()
          for token in ('local pc=pcall','/LOGS/m0','/LOGS/m1','local function memOpt','local function watch','V[179]*.0045','92+4*dc','bb_line(151,rg4,0)'):
              assert token in text, token
          print({'canonicalParent':name,'source':str(path)})
          PY
      - name: Launch first JRW6D-derived rewrite generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/jarvis-complete-rewrite-factory.yml/dispatches" -f ref=main
          echo 'Dispatched Rewrite Factory from JRW6D defended parent.'
