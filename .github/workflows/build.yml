name: MT12 Master Factory
on:
  workflow_dispatch:
    inputs:
      mission:
        description: Programming mission for the AI factory
        required: false
        default: Invent the brightest safe next generation while preserving every proven behavior
      model:
        description: GitHub Models model ID
        required: false
        default: openai/gpt-4.1
  push:
    branches: [main]
    paths:
      - 'a15ya.lua'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
  actions: read
  models: read
concurrency:
  group: mt12-master-factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FACTORY_MISSION: ${{ inputs.mission || 'Invent the brightest safe next generation while preserving every proven behavior' }}
      FACTORY_MODEL: ${{ inputs.model || 'openai/gpt-4.1' }}
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deterministic MT12 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          luac5.3 -v
          lua5.3 -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authoritative root seed exists
        run: test -f a15ya.lua
      - name: Invent, compile, normalize, simulate and audit
        run: node scripts/master-factory.mjs
      - name: Package all evidence
        if: always()
        run: |
          test -d dist || mkdir -p dist
          cd dist
          zip -9 -r mt12-master-factory-release.zip . -x mt12-master-factory-release.zip
      - name: Publish factory output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt12-master-factory-release
          path: dist/
          if-no-files-found: error
          retention-days: 90
