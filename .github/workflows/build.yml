name: MT12 Master Factory
on:
  workflow_dispatch:
    inputs:
      mission:
        description: Programming mission for the AI factory
        required: false
        default: Invent the brightest safe next generation while preserving every proven behavior
      model:
        description: GitHub Models model ID
        required: false
        default: openai/gpt-4.1
  push:
    branches: [main]
    paths:
      - 'a15ya.lua'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'
      - 'tests/replays/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'a15ya.lua'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'
      - 'tests/replays/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
  actions: read
  models: read
concurrency:
  group: mt12-master-factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FACTORY_MISSION: ${{ inputs.mission || 'Invent the brightest safe next generation while preserving every proven behavior' }}
      FACTORY_MODEL: ${{ inputs.model || 'openai/gpt-4.1' }}
      MAX_BYTES: '87000'
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install deterministic MT12 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          luac5.3 -v
          lua5.3 -v
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify factory source and toolchain
        run: |
          test -f a15ya.lua
          node --check scripts/master-factory.mjs
          node --check scripts/evaluate-fitness.mjs
          node --check scripts/verify-release.mjs
          node --check toolchain/normalize_luac53_mt12.js
          bash -n toolchain/compile_mt12.sh
          chmod +x toolchain/compile_mt12.sh
          luac5.3 -p scripts/mt12-harness.lua
          luac5.3 -p scripts/fitness-harness.lua
      - name: Invent, compile, normalize, simulate and audit
        run: node scripts/master-factory.mjs
      - name: Independently reproduce and verify release
        run: node scripts/verify-release.mjs
      - name: Rebuild verified winner with shared compiler
        run: |
          NAME="$(node -e "const m=require('./dist/verified-release/VERIFIED-MANIFEST.json');process.stdout.write(m.name)")"
          test -n "$NAME"
          test -f "dist/verified-release/$NAME.lua"
          test -f "dist/verified-release/$NAME.luac"
          toolchain/compile_mt12.sh "dist/verified-release/$NAME.lua" "dist/verified-release/$NAME-rebuilt.luac"
          cmp "dist/verified-release/$NAME.luac" "dist/verified-release/$NAME-rebuilt.luac"
          cmp "dist/verified-release/$NAME.luac" dist/verified-release/DEPLOY.luac
          test "$(od -An -tx1 -j12 -N5 dist/verified-release/DEPLOY.luac | tr -d ' \n')" = 0404040404
          sha256sum "dist/verified-release/$NAME.lua" "dist/verified-release/$NAME.luac" dist/verified-release/DEPLOY.luac > dist/verified-release/SHA256SUMS.txt
          rm -f "dist/verified-release/$NAME-rebuilt.luac"
      - name: Package simulation-verified test release
        run: |
          cd dist/verified-release
          zip -9 -r ../mt12-verified-release.zip .
      - name: Publish simulation-verified test release
        uses: actions/upload-artifact@v5
        with:
          name: mt12-verified-release
          path: dist/mt12-verified-release.zip
          if-no-files-found: error
          retention-days: 90
      - name: Package diagnostics
        if: always()
        run: |
          test -d dist || mkdir -p dist
          cd dist
          zip -9 -r mt12-factory-diagnostics.zip . -x mt12-factory-diagnostics.zip -x mt12-verified-release.zip
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mt12-factory-diagnostics
          path: dist/mt12-factory-diagnostics.zip
          if-no-files-found: error
          retention-days: 90
