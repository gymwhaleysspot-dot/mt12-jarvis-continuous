name: MT12 Master Programming Factory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'factory/**'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'factory/**'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'

permissions:
  contents: read

concurrency:
  group: mt12-master-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          command -v luac5.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run master factory
        run: node scripts/master-factory.mjs
      - name: Package all verified outputs and diagnostics
        run: |
          cd dist
          zip -9 -r mt12-master-factory.zip . -x mt12-master-factory.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mt12-master-factory
          path: dist/
          if-no-files-found: error
          retention-days: 90
