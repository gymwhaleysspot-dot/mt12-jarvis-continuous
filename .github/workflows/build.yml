name: MT12 YA Forge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'candidate/**'
      - 'baseline/**'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'candidate/**'
      - 'baseline/**'
      - 'scripts/**'
      - 'toolchain/**'
      - 'spec/**'

permissions:
  contents: read

concurrency:
  group: mt12-ya-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3
          command -v luac5.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build normalized MT12 bytecode
        run: node scripts/build.mjs
      - name: Audit retained contract
        run: node scripts/audit.mjs
      - name: Package release
        run: |
          cp candidate/a15yb.lua dist/a15yb.lua
          cp spec/factory.json dist/factory.json
          cd dist
          zip -9 a15yb-release.zip a15yb.lua a15yb.luac build.json audit.json SHA256SUMS factory.json
      - uses: actions/upload-artifact@v4
        with:
          name: a15yb-mt12-release
          path: dist/
          if-no-files-found: error
          retention-days: 90
