name: Jarvis Persistent Mission Engine

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Jarvis Mandatory Controller Intelligence Gate
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: jarvis-persistent-mission
  cancel-in-progress: true

jobs:
  advance:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Advance durable intelligence mission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/jarvis_persistent_mission.py
          python3 tools/jarvis_persistent_mission.py
      - name: Persist mission state
        run: |
          set -Eeuo pipefail
          git config user.name 'Jarvis Persistent Mission Engine'
          git config user.email 'actions@users.noreply.github.com'
          git add public/jarvis-data/persistent-mission.json public/jarvis-data/active-mission.json
          git commit -m 'Advance persistent Jarvis intelligence mission [skip ci]' || exit 0
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*4))
          done
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: jarvis-persistent-mission-${{ github.run_id }}
          path: |
            public/jarvis-data/persistent-mission.json
            public/jarvis-data/active-mission.json
          retention-days: 90
