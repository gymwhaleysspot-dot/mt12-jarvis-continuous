name: Wire Factory HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'factory-tool-ui.js'
      - 'factory-admin.js'
      - 'scratch-builder-ui.js'
      - 'autonomous-one-button-ui.js'
      - 'scripts/install-factory-admin.mjs'
      - '.github/workflows/wire-factory-html.yml'

permissions:
  contents: write

concurrency:
  group: wire-factory-html
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/install-factory-admin.mjs
      - name: Commit generated HTML wiring
        run: |
          git config user.name 'mt12-factory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add factory.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire factory controls into HTML [skip factory]'
          git push
