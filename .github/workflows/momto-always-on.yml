name: MomTo Always-On Search Worker

# The push trigger bootstraps
# v11 deployment: run immediately after MomTo research-code changes. the first persistent snapshot immediately after workflow changes; the worker then continues on its 5-minute schedule.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/momto-always-on.yml'
      - 'momto/**'
      - 'momto-live.html'
      - 'momto/web/**'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momto-always-on
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOMTO_PRIVATE_API_URL: ${{ secrets.MOMTO_PRIVATE_API_URL }}
      MOMTO_API_TOKEN: ${{ secrets.MOMTO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install MomTo runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./momto pytest
      - name: Verify official-source availability
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json, urllib.request
          from urllib.error import HTTPError
          from datetime import datetime, timezone
          sources = [
              "https://codes.ohio.gov/ohio-revised-code/section-3107.38",
              "https://codes.ohio.gov/ohio-revised-code/section-3107.66",
              "https://codes.ohio.gov/ohio-revised-code/section-3705.12",
          ]
          checks=[]
          for url in sources:
              row={"url":url,"checked_at":datetime.now(timezone.utc).isoformat(),"ok":False,"status":None}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"MomTo/1.0 public-source-check"})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      row["status"]=r.status; row["ok"]=200 <= r.status < 400
              except HTTPError as e:
                  row["status"]=e.code
                  row["error"]="HTTPError"
                  row["ok"]=False
              except Exception as e:
                  row["error"]=type(e).__name__
              checks.append(row)
          open("artifacts/source-checks.json","w").write(json.dumps(checks,indent=2)+"\n")
          PY
      - name: Run persistent private backend research cycle
        if: ${{ env.MOMTO_PRIVATE_API_URL != '' && env.MOMTO_API_TOKEN != '' }}
        env:
          MOMTO_PRIVATE_API_URL: ${{ secrets.MOMTO_PRIVATE_API_URL }}
          MOMTO_API_TOKEN: ${{ secrets.MOMTO_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          base="${MOMTO_PRIVATE_API_URL%/}"
          auth=(-H "Authorization: Bearer ${MOMTO_API_TOKEN}")
          curl --fail-with-body --silent --show-error "${auth[@]}" "${base}/api/momto/private/status" > artifacts/private-status.json
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" "${base}/api/momto/private/research/enqueue" > artifacts/private-job-enqueue.json
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" "${base}/api/momto/private/research/run" > artifacts/private-research-run.json
          curl --fail-with-body --silent --show-error "${auth[@]}" "${base}/api/momto/private/research/status" > artifacts/private-research-status.json

      - name: Run MomTo persistent live/search cycle
        env:
          PYTHONPATH: .
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from momto.web.live_api import momto_live
          from momto.genealogy import SOURCE_CATALOG, public_research_catalog
          from momto.ancestry import public_summary as ancestry_public_summary
          from momto.parent_search import verify_research_chain

          state_path = Path("momto-live.json")
          previous = {}
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  previous = {}

          snapshot = momto_live()
          # Run the real research agent each cycle. If an OpenAI key is configured,
          # it reasons over private local evidence and selects the next searches.
          # Only its public-safe research plan/results are published.
          from momto.research_agent import run as research_agent_run
          snapshot["research_ai"] = research_agent_run(12)
          # Verify the private ancestry -> graph -> two-lane research chain on every cycle.
          from momto.service import init_case
          snapshot["private_research_chain"] = verify_research_chain(init_case().id)
          dna_signals = snapshot.get("dna_signals") or {"providers":[],"match_count":0,"signal_count":0,"strong_signal_count":0,"clusters":0}
          ancestry_signals = snapshot.get("ancestry") or ancestry_public_summary()
          now = datetime.now(timezone.utc)
          source_checks = json.loads(Path("artifacts/source-checks.json").read_text(encoding="utf-8"))

          # Perform actual public-source research each cycle instead of only
          # reporting endpoint availability. Findings are limited to public,
          # official Ohio adoption resources and contain no case/PII data.
          from html.parser import HTMLParser
          import re
          import urllib.error

          research_sources = [(s["title"], s["url"], s["lane"]) for s in SOURCE_CATALOG]

          class _Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
                  self.skip=0
              def handle_starttag(self, tag, attrs):
                  if tag in {"script","style","noscript"}: self.skip += 1
              def handle_endtag(self, tag):
                  if tag in {"script","style","noscript"} and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      s=re.sub(r"\\s+"," ",data).strip()
                      if s: self.parts.append(s)

          findings=[]
          for title,url,lane in research_sources:
              row={"title":title,"url":url,"lane":lane,"checked_at":now.isoformat(),"ok":False}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"MomTo/1.0 public-research"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read(300000)
                      row["status"]=r.status
                      row["ok"]=True
                      if "text/html" in (r.headers.get("Content-Type") or ""):
                          p=_Text(); p.feed(raw.decode("utf-8","ignore"))
                          text=" ".join(p.parts)
                          # Keep only concise public-source research notes.
                          terms=("adoption","birth","marriage","death","probate","newspaper","obituary","church","cemetery","genealogy","records","court","family")
                          matches=[]
                          for sentence in re.split(r"(?<=[.!?])\\s+",text):
                              if any(t in sentence.lower() for t in terms) and 60 <= len(sentence) <= 420:
                                  matches.append(sentence)
                              if len(matches) >= 6: break
                          row["findings"]=matches
                      else:
                          row["findings"]=["Official source fetched successfully; content type is not HTML."]
              except Exception as e:
                  row["error"]=type(e).__name__
              findings.append(row)

          research_findings=[x for x in findings if x.get("ok") and x.get("findings")]
          genealogy_catalog = public_research_catalog()
          genealogy_summary = {
              "engine": genealogy_catalog["engine"],
              "method": genealogy_catalog["method"],
              "lanes": genealogy_catalog["lanes"],
              "sources_cataloged": len(genealogy_catalog["sources"]),
              "sources_checked": len(findings),
              "sources_successful": len(research_findings),
              "finding_count": sum(len(x.get("findings") or []) for x in research_findings),
              "public_only": True,
              "person_specific_queries": "local-only; generated from private case data and never published",
              "next_phase": "Fill private local identity facts, then execute lane-specific queries against the catalog and attach evidence locally.",
          }

          # Current, independently verified public-law facts. These are
          # deliberately kept separate from live endpoint fetch results so a
          # runner-side HTTP 404 cannot make the dashboard look knowledge-free.
          # Activate every roadmap lane with the strongest lawful public next step.
          # "ready" means the public research/preparation is complete; it does not
          # claim a private request was filed or that private evidence exists.
          roadmap_status = {
              "odh-file": "ready",
              "non-id": "ready",
              "contact-pref": "ready",
              "registry": "ready",
              "court": "ready",
              "dna": "ready-for-import",
              "public-records": "ready",
              "professional": "ready-for-human-review",
          }
          roadmap_notes = {
              "odh-file": "Public legal route verified; request package still requires the requester’s private identification, notarization, address, and fee.",
              "non-id": "Public legal route verified under ORC 3107.66; local agency/attorney/court identity still needs case records.",
              "contact-pref": "Current law identifies contact-preference and name-redaction forms; private file must be requested to determine whether one exists.",
              "registry": "Registry/mutual-consent lane activated for lawful research; no private registration or contact was performed.",
              "court": "Ohio Supreme Court adoption/probate forms and local-court path verified; county/case details remain private case inputs.",
              "dna": "DNA analysis engine is active; imported lawful match files are processed locally and aggregate signals are published without identities.",
              "public-records": "Public-record research lane activated; future searches must remain lawful and privacy-safe.",
              "professional": "Professional-review lane prepared for questions that require case-specific legal advice or records-access interpretation.",
          }
          if previous.get("ohio"):
              roadmap = list(previous["ohio"].get("roadmap") or [])
          else:
              roadmap = []
          roadmap_by_key = {x.get("key"): x for x in roadmap}
          for key, status in roadmap_status.items():
              row = roadmap_by_key.setdefault(key, {"key": key})
              row["status"] = status
              row["note"] = roadmap_notes[key]
          snapshot["ohio"] = {
              "state": "Ohio",
              "roadmap": list(roadmap_by_key.values()),
              "official_sources": [
                  "https://codes.ohio.gov/ohio-revised-code/section-3107.38",
                  "https://codes.ohio.gov/ohio-revised-code/section-3107.66",
                  "https://www.supremecourt.ohio.gov/forms/all-forms/probate/5",
              ],
          }

          verified_public_facts = [
              {
                  "source": "Ohio Revised Code §3107.38",
                  "url": "https://codes.ohio.gov/ohio-revised-code/section-3107.38",
                  "fact": "Effective September 30, 2025, an adopted person age 18 or older may request the contents of the adoption file from the Ohio Department of Health; the request requires an address, notarized signature, two identification items, and the required fee.",
                  "verified_at": "2026-09-19",
              },
              {
                  "source": "Ohio Revised Code §3107.66",
                  "url": "https://codes.ohio.gov/ohio-revised-code/section-3107.66",
                  "fact": "An adopted person age 18 or older may request nonidentifying information about birth parents or birth siblings from the agency, attorney, or probate court that holds or finalized the adoption records.",
                  "verified_at": "2026-09-19",
              },
              {
                  "source": "Ohio Revised Code §3107.47",
                  "url": "https://codes.ohio.gov/ohio-revised-code/section-3107.47",
                  "fact": "Ohio law separately addresses release of adoption-file contents for adopted persons age 21 or older and adoptive parents of adoptees age 18 through 20, subject to the statute's release/denial rules.",
                  "verified_at": "2026-09-19",
              },
              {
                  "source": "Ohio Supreme Court probate forms",
                  "url": "https://www.supremecourt.ohio.gov/forms/all-forms/probate/5",
                  "fact": "The current Ohio Supreme Court probate forms index includes adoption forms 18.0 through 18.9 and adult-adoption forms 19.0 through 19.4.",
                  "verified_at": "2026-09-19",
              },
          ]
          prior_state = previous.get("persistence", {})
          cycle_count = int(prior_state.get("cycle_count", 0)) + 1
          first_started_at = prior_state.get("first_started_at") or now.isoformat()
          prior_answers = previous.get("answers", [])
          prior_search_ai = previous.get("search_ai") or snapshot.get("search_ai", {})
          prior_activity = previous.get("activity") or snapshot.get("activity", [])
          prior_counts = previous.get("counts") or snapshot.get("counts", {})
          prior_advanced = previous.get("advanced") or snapshot.get("advanced", {})
          answers = prior_search_ai.get("plan", []) or snapshot.get("search_ai", {}).get("plan", [])
          verified = sum(1 for x in source_checks if x.get("ok"))
          snapshot["answers"] = [
              {"type": "next_action", "priority": x.get("priority", "normal"), "answer": x.get("action", "")}
              for x in answers
          ][:6]
          snapshot["answers"].insert(0, {"type":"verified_source_check","priority":"high" if verified < len(source_checks) else "normal","answer":f"Verified {verified}/{len(source_checks)} official Ohio source endpoints during this worker cycle."})
          snapshot["answers"] = snapshot["answers"][:8]
          snapshot["activity"] = prior_activity
          if previous.get("case"): snapshot["case"] = previous["case"]
          if previous.get("objectives"): snapshot["objectives"] = previous["objectives"]
          snapshot["dna"] = dna_signals.get("providers", [])
          snapshot["dna_match_signals"] = {k:dna_signals.get(k,0) for k in ("match_count","signal_count","strong_signal_count","clusters")}
          snapshot["ancestry"] = ancestry_signals
          snapshot["counts"] = prior_counts
          snapshot["advanced"] = prior_advanced
          snapshot["search_ai"] = prior_search_ai
          snapshot["genealogy"] = genealogy_summary
          snapshot["research"] = {
              "official_sources": source_checks,
              "verified": verified,
              "total": len(source_checks),
              "findings": research_findings[:12],
              "verified_public_facts": verified_public_facts,
              "sources_researched": len(findings),
              "research_lanes": sorted({x.get("lane") for x in findings if x.get("lane")}),
              "note": "Actual public-source research is performed each cycle. No adoption-record contents, private matches, addresses, phone numbers, email addresses, or correspondence are collected or published.",
          }
          activity = list(snapshot.get("activity") or [])
          activity.insert(0, {
              "type": "research_cycle",
              "at": now.isoformat(),
              "summary": f"Researched {len(findings)} official Ohio adoption sources; {len(research_findings)} returned substantive public findings.",
              "public_safe": True,
          })
          snapshot["activity"] = activity[:25]
          snapshot["dashboard_version"] = "momto-live-v10"
          snapshot["snapshot_schema"] = "momto-public-v10"
          snapshot["persistence"] = {
              "status": "persistent",
              "first_started_at": first_started_at,
              "last_cycle_at": now.isoformat(),
              "cycle_count": cycle_count,
              "previous_answer_count": len(prior_answers),
              "state_source": "public-safe aggregate snapshot",
              "private_case_data_persisted": bool(snapshot.get("private_research_chain", {}).get("people", 0)),
              "private_worker_scope": "same-runtime-private-db" if snapshot.get("private_research_chain", {}).get("people", 0) else "no-private-tree-loaded",
          }
          snapshot["heartbeat"] = {
              "status": "running",
              "at": now.isoformat(),
              "worker": "momto-always-on",
              "interval_seconds": 300,
              "privacy_safe": True,
          }
          state_path.write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          assert snapshot["case"]["status"] == "active"
          assert snapshot["enhancements"]["total"] == 5000
          assert snapshot["enhancements"]["public_safe"] is True
          assert snapshot["heartbeat"]["status"] == "running"
          assert "private_research_chain" in snapshot
          assert "candidate_rule" in snapshot["private_research_chain"]
          assert "birth_name" not in snapshot
          PY
      - name: Project private backend state into public-safe snapshot
        if: ${{ env.MOMTO_PRIVATE_API_URL != '' && env.MOMTO_API_TOKEN != '' }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          snap=Path("momto-live.json")
          status=Path("artifacts/private-status.json")
          if snap.exists() and status.exists():
              public=json.loads(snap.read_text())
              private=json.loads(status.read_text())
              chain=private.get("research_chain") or {}
              public["private_research_chain"]=chain
              public.setdefault("persistence",{})["private_worker_scope"]="persistent-private-backend"
              public["persistence"]["private_case_data_persisted"]=bool(chain.get("people"))
              snap.write_text(json.dumps(public,indent=2,sort_keys=True)+"\
")
          PY
      - name: Publish fresh public-safe snapshot
        run: |
          set -Eeuo pipefail
          git config user.name "MomTo Always-On Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add momto-live.json
          if git diff --cached --quiet; then
            echo "No public snapshot changes."
            exit 0
          fi
          git commit -m "chore(momto): refresh live search heartbeat"
          # Other repository automation can update main while this cycle is
          # running. Merge those changes before publishing; keep this cycle's
          # generated public snapshot if that file conflicts.
          if ! git push origin HEAD:main; then
            git pull --no-rebase origin main || {
              git checkout --ours momto-live.json
              git add momto-live.json
              git commit -m "chore(momto): resolve concurrent snapshot publish"
            }
            git push origin HEAD:main
          fi
