name: MomTo Always-On Search Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momto-always-on
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install MomTo runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy fastapi typer
      - name: Run MomTo live/search cycle
        env:
          PYTHONPATH: .
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from momto.web.live_api import momto_live

          snapshot = momto_live()
          snapshot["heartbeat"] = {
              "status": "running",
              "at": datetime.now(timezone.utc).isoformat(),
              "worker": "momto-always-on",
              "interval_seconds": 300,
              "privacy_safe": True,
          }
          Path("momto-live.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          assert snapshot["case"]["status"] == "active"
          assert snapshot["enhancements"]["total"] == 5000
          assert snapshot["enhancements"]["public_safe"] is True
          assert snapshot["heartbeat"]["status"] == "running"
          assert "birth_name" not in snapshot
          PY
      - name: Publish fresh public-safe snapshot
        run: |
          set -Eeuo pipefail
          git config user.name "MomTo Always-On Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add momto-live.json
          if git diff --cached --quiet; then
            echo "No public snapshot changes."
            exit 0
          fi
          git commit -m "chore(momto): refresh live search heartbeat"
          git push origin HEAD:main
