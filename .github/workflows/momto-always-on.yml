name: MomTo Always-On Search Worker

# The push trigger bootstraps the first persistent snapshot immediately after workflow changes; the worker then continues on its 5-minute schedule.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/momto-always-on.yml'
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momto-always-on
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install MomTo runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy fastapi typer
      - name: Verify official-source availability
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json, urllib.request
          from urllib.error import HTTPError
          from datetime import datetime, timezone
          sources = [
              "https://codes.ohio.gov/ohio-revised-code/section-3107.38",
              "https://codes.ohio.gov/ohio-revised-code/section-3107.66",
              "https://codes.ohio.gov/ohio-revised-code/section-3705.12",
          ]
          checks=[]
          for url in sources:
              row={"url":url,"checked_at":datetime.now(timezone.utc).isoformat(),"ok":False,"status":None}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"MomTo/1.0 public-source-check"})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      row["status"]=r.status; row["ok"]=200 <= r.status < 400
              except HTTPError as e:
                  row["status"]=e.code
                  row["error"]="HTTPError"
                  row["ok"]=False
              except Exception as e:
                  row["error"]=type(e).__name__
              checks.append(row)
          open("artifacts/source-checks.json","w").write(json.dumps(checks,indent=2)+"\n")
          PY
      - name: Run MomTo persistent live/search cycle
        env:
          PYTHONPATH: .
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from momto.web.live_api import momto_live

          state_path = Path("momto-live.json")
          previous = {}
          if state_path.exists():
              try:
                  previous = json.loads(state_path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  previous = {}

          snapshot = momto_live()
          now = datetime.now(timezone.utc)
          source_checks = json.loads(Path("artifacts/source-checks.json").read_text(encoding="utf-8"))
          prior_state = previous.get("persistence", {})
          cycle_count = int(prior_state.get("cycle_count", 0)) + 1
          first_started_at = prior_state.get("first_started_at") or now.isoformat()
          prior_answers = previous.get("answers", [])
          prior_search_ai = previous.get("search_ai") or snapshot.get("search_ai", {})
          prior_activity = previous.get("activity") or snapshot.get("activity", [])
          prior_counts = previous.get("counts") or snapshot.get("counts", {})
          prior_advanced = previous.get("advanced") or snapshot.get("advanced", {})
          answers = prior_search_ai.get("plan", []) or snapshot.get("search_ai", {}).get("plan", [])
          verified = sum(1 for x in source_checks if x.get("ok"))
          snapshot["answers"] = [
              {"type": "next_action", "priority": x.get("priority", "normal"), "answer": x.get("action", "")}
              for x in answers
          ][:6]
          snapshot["answers"].insert(0, {"type":"verified_source_check","priority":"high" if verified < len(source_checks) else "normal","answer":f"Verified {verified}/{len(source_checks)} official Ohio source endpoints during this worker cycle."})
          snapshot["answers"] = snapshot["answers"][:8]
          snapshot["activity"] = prior_activity
          if previous.get("case"): snapshot["case"] = previous["case"]
          if previous.get("objectives"): snapshot["objectives"] = previous["objectives"]
          if previous.get("ohio"): snapshot["ohio"] = previous["ohio"]
          if previous.get("dna"): snapshot["dna"] = previous["dna"]
          snapshot["counts"] = prior_counts
          snapshot["advanced"] = prior_advanced
          snapshot["search_ai"] = prior_search_ai
          snapshot["research"] = {"official_sources": source_checks, "verified": verified, "total": len(source_checks), "note": "Public endpoint availability only; no adoption-record contents are collected or published."}
          snapshot["dashboard_version"] = "momto-live-v7"
          snapshot["snapshot_schema"] = "momto-public-v7"
          snapshot["persistence"] = {
              "status": "persistent",
              "first_started_at": first_started_at,
              "last_cycle_at": now.isoformat(),
              "cycle_count": cycle_count,
              "previous_answer_count": len(prior_answers),
              "state_source": "public-safe aggregate snapshot",
              "private_case_data_persisted": False,
          }
          snapshot["heartbeat"] = {
              "status": "running",
              "at": now.isoformat(),
              "worker": "momto-always-on",
              "interval_seconds": 300,
              "privacy_safe": True,
          }
          state_path.write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          assert snapshot["case"]["status"] == "active"
          assert snapshot["enhancements"]["total"] == 5000
          assert snapshot["enhancements"]["public_safe"] is True
          assert snapshot["heartbeat"]["status"] == "running"
          assert "birth_name" not in snapshot
          PY
      - name: Publish fresh public-safe snapshot
        run: |
          set -Eeuo pipefail
          git config user.name "MomTo Always-On Worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add momto-live.json
          if git diff --cached --quiet; then
            echo "No public snapshot changes."
            exit 0
          fi
          git commit -m "chore(momto): refresh live search heartbeat"
          git push origin HEAD:main
