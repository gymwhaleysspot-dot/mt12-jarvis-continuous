name: Aegis Chief Engineer CI
on:
  pull_request:
    paths:
      - index.html
      - assets/jarvis-os.*
      - chief.html
      - chief-engineer/**
      - public/chief-data/**
      - scripts/prepare-pages.mjs
      - .github/workflows/chief-engineer*.yml
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate Aegis engine and Jarvis integration
        run: |
          set -euo pipefail
          node --check chief-engineer/engine.mjs
          node --check chief-engineer/app.js
          node -e "const m=JSON.parse(require('fs').readFileSync('chief-engineer/memory.json'));if(m.identity?.name!=='Aegis')throw Error('Aegis memory identity missing')"
          grep -q 'RECOMMEND_AND_DISPATCH_ONLY' chief-engineer/engine.mjs
          grep -q 'autoPromotion:false' chief-engineer/engine.mjs
          node chief-engineer/engine.mjs > /tmp/aegis-output.json
          node scripts/prepare-pages.mjs
          grep -q 'index.html#intelligence' chief.html
          grep -q 'Jarvis Engineering Intelligence' index.html
          grep -q 'Chief Engineer' index.html
