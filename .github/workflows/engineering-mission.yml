name: A17Y Full Engineering Mission
on:
  workflow_dispatch:
    inputs:
      question:
        description: Engineering question
        required: true
        default: Find and improve the highest-value evidence-supported weakness
      hypothesis:
        description: Testable hypothesis
        required: true
        default: A bounded controller change can improve the target without regressions
      logs:
        description: Optional space-separated replay paths; blank uses all tests/replays CSVs
        required: false
        default: ''
      tournament:
        description: Run five strategy candidates through the LUAC AI pipeline
        required: true
        type: boolean
        default: true
      fuzz_cases:
        description: Bounded fuzz plan case count
        required: true
        default: '10000'
  push:
    branches: [main]
    paths:
      - tests/replays/**
      - evidence/labels/**
      - evidence/bench/**
      - evidence/road/**
      - engineering-missions/schema.json
      - engineering-missions/run.mjs
      - engineering-missions/tournament.mjs
      - engineering-missions/stress.mjs
      - engineering-missions/memory-lab.mjs
      - engineering-missions/finalize.mjs
      - .github/workflows/engineering-mission.yml
permissions:
  contents: write
  actions: write
  models: read
concurrency:
  group: a17y-engineering-mission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install deterministic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh
      - name: Validate mission engine and protected tools
        run: |
          set -euo pipefail
          node --check engineering-missions/run.mjs
          node --check engineering-missions/tournament.mjs
          node --check engineering-missions/stress.mjs
          node --check engineering-missions/memory-lab.mjs
          node --check engineering-missions/finalize.mjs
          node --check director/run.mjs
          node --check workbench/run.mjs
          node --check workbench/rcos.mjs
          lua5.3 -e "assert(loadfile('scripts/mt12-harness.lua'))"
          lua5.3 -e "assert(loadfile('scripts/mt12-csv-replay.lua'))"
      - name: Build replay input list
        run: |
          find tests/replays -type f -iname '*.csv' -print 2>/dev/null > /tmp/logs.txt || true
          echo "Replay files: $(wc -l </tmp/logs.txt)"
      - name: Create permanent mission, fresh baseline and event windows
        id: mission
        env:
          Q: ${{ github.event_name == 'workflow_dispatch' && inputs.question || 'Automatically investigate new evidence' }}
          H: ${{ github.event_name == 'workflow_dispatch' && inputs.hypothesis || 'New evidence may reveal a safe measurable improvement' }}
          L: ${{ github.event_name == 'workflow_dispatch' && inputs.logs || '' }}
          F: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_cases || '10000' }}
        run: |
          set -euo pipefail
          ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          node engineering-missions/run.mjs "id=$ID" "question=$Q" "hypothesis=$H" "logs=$L" "fuzz=$F"
      - name: Build five-strategy candidate tournament
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tournament == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISSION_ID: ${{ steps.mission.outputs.id }}
          MISSION_QUESTION: ${{ github.event_name == 'workflow_dispatch' && inputs.question || 'Automatically investigate new evidence' }}
        run: |
          set -euo pipefail
          mkdir -p "dist-mission/$MISSION_ID/tournament"
          LOGS="$(tr '\n' ' ' </tmp/logs.txt)"
          for PROFILE in conservative performance learning memory-efficient alternative-algorithm; do
            export DIRECTOR_MISSION="$MISSION_QUESTION. Generate a $PROFILE candidate. Preserve every protected behavior. Return NO CHANGE RECOMMENDED when evidence does not justify modification."
            export DIRECTOR_OUT="dist-mission/$MISSION_ID/tournament/$PROFILE/director"
            export DIRECTOR_LOGS="$LOGS"
            mkdir -p "$DIRECTOR_OUT"
            node director/run.mjs || true
            C="$DIRECTOR_OUT/WINNER.lua"
            if [ ! -f "$C" ]; then C=a17y.lua; fi
            WORKBENCH_OUT="dist-mission/$MISSION_ID/tournament/$PROFILE/workbench" WORKBENCH_LOG_FILE=/tmp/logs.txt node workbench/run.mjs a17y.lua "$C" "$DIRECTOR_MISSION" || true
          done
      - name: Deterministic tournament arbitration and adversarial review
        env:
          MISSION_ID: ${{ steps.mission.outputs.id }}
        run: node engineering-missions/tournament.mjs "dist-mission/$MISSION_ID"
      - name: Counterfactual and fuzz execution
        env:
          MISSION_ID: ${{ steps.mission.outputs.id }}
        run: node engineering-missions/stress.mjs "dist-mission/$MISSION_ID" a17y.lua
      - name: Memory compatibility laboratory
        env:
          MISSION_ID: ${{ steps.mission.outputs.id }}
        run: node engineering-missions/memory-lab.mjs "dist-mission/$MISSION_ID" a17y.lua
      - name: Build release package, rollback recommendation and audit export
        env:
          MISSION_ID: ${{ steps.mission.outputs.id }}
        run: |
          node engineering-missions/finalize.mjs "dist-mission/$MISSION_ID"
          cd "dist-mission/$MISSION_ID"
          zip -9 -r "../../a17y-engineering-mission-$MISSION_ID.zip" .
      - uses: actions/upload-artifact@v6
        with:
          name: a17y-engineering-mission-${{ steps.mission.outputs.id }}
          path: a17y-engineering-mission-${{ steps.mission.outputs.id }}.zip
          if-no-files-found: error
          retention-days: 180
      - name: Publish mission record and notifications
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          MISSION_ID: ${{ steps.mission.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p engineering-missions/history public/mission-data
          cp -a "dist-mission/$MISSION_ID" "engineering-missions/history/$MISSION_ID"
          cp "dist-mission/$MISSION_ID/MISSION.json" public/mission-data/current.json
          cp "dist-mission/$MISSION_ID/NOTIFICATIONS.json" public/mission-data/notifications.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add engineering-missions/history public/mission-data
          git commit -m "Record engineering mission $MISSION_ID" || exit 0
          git push
