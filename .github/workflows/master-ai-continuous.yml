name: MT12 LUAC Factory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/master-ai-continuous.yml'
      - 'scripts/**'
      - 'toolchain/**'
      - 'factory-admin.js'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  models: read

concurrency:
  group: mt12-luac-factory
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MT12_LIMIT: '88944'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FACTORY_MODEL: openai/gpt-4.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install LUAC vault controls
        run: node scripts/install-factory-admin.mjs
      - name: Install and verify Lua 5.3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lua5.3 && break
            echo "Lua 5.3 install attempt $attempt failed; retrying..."
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend || true
            sudo dpkg --configure -a || true
            sleep $((attempt * 3))
          done
          command -v lua5.3
          command -v luac5.3
          lua5.3 -v
          luac5.3 -v
      - name: Prepare MT12 normalizer
        run: cp toolchain/normalize_luac53_mt12.js toolchain/normalize_luac53_mt12.cjs
      - name: Build one genuinely new complete AI controller
        run: node scripts/master-ai.mjs
      - name: Compile normalize validate rank and publish substantive builds
        shell: bash
        run: |
          set +e
          mkdir -p generations/factory generations/accepted reports
          : > reports/factory-results.tsv
          node -e "const p=require('./reports/pending-factory.json');for(const x of p.batch)console.log(x.file)" | while read CANDIDATE; do
            BASE=$(basename "$CANDIDATE" .lua)
            RAW="generations/candidates/${BASE}_raw.luac"
            FINAL="generations/candidates/${BASE}.luac"
            REPORT="reports/${BASE}-gate.txt"
            PASS=1
            {
              echo "engine=substantive-ai-architecture-luac-factory"
              echo "candidate=$CANDIDATE"
              node scripts/all-function-gate.mjs "$CANDIDATE" || PASS=0
              node scripts/simulator.mjs "$CANDIDATE" || true
              node scripts/static-gate.mjs "$CANDIDATE" || PASS=0
              luac5.3 -p "$CANDIDATE" || PASS=0
              if [ "$PASS" = 1 ]; then luac5.3 -s -o "$RAW" "$CANDIDATE" || PASS=0; fi
              if [ "$PASS" = 1 ]; then node toolchain/normalize_luac53_mt12.cjs "$RAW" "$FINAL" || PASS=0; fi
              if [ "$PASS" = 1 ]; then
                BYTES=$(wc -c < "$FINAL" | tr -d ' ')
                echo "normalized_bytes=$BYTES"
                echo "margin=$((MT12_LIMIT-BYTES))"
                [ "$BYTES" -le "$MT12_LIMIT" ] || PASS=0
              fi
              echo "passed=$PASS"
            } > "$REPORT" 2>&1
            node scripts/write-generation-changelog.mjs "$BASE" || PASS=0
            cat "$REPORT"
            SCORE=$(node -e "const r=require('./reports/${BASE}-sim.json');console.log(r.score||0)" 2>/dev/null || echo 0)
            FAMILY=$(node -e "const r=require('./reports/${BASE}-sim.json');console.log(r.family||'factory')" 2>/dev/null || echo factory)
            printf '%s\t%s\t%s\t%s\n' "$PASS" "$SCORE" "$FAMILY" "$BASE" >> reports/factory-results.tsv
            if [ "$PASS" = 1 ]; then
              mkdir -p "generations/factory/$FAMILY"
              cp "$CANDIDATE" "generations/factory/$FAMILY/${BASE}.lua"
              cp "$FINAL" "generations/factory/$FAMILY/${BASE}.luac"
              cp "reports/${BASE}-CHANGELOG.md" "generations/factory/$FAMILY/${BASE}-CHANGELOG.md"
              cp "reports/${BASE}-changelog.json" "generations/factory/$FAMILY/${BASE}-changelog.json"
            fi
          done
      - name: Promote best and update downloadable catalog
        shell: bash
        run: |
          BEST=$(awk -F '\t' '$1==1{print $2"\t"$3"\t"$4}' reports/factory-results.tsv | sort -nr | head -1)
          if [ -z "$BEST" ]; then
            node scripts/write-rejection-summary.mjs || true
            printf '{"status":"batch-rejected","updated":"%s","diagnostics":"reports/rejection-summary.json"}\n' "$(date -u +%FT%TZ)" > reports/status.json
            node scripts/rebuild-factory-catalog.mjs || true
            exit 0
          fi
          SCORE=$(echo "$BEST" | cut -f1)
          FAMILY=$(echo "$BEST" | cut -f2)
          BASE=$(echo "$BEST" | cut -f3)
          cp "generations/factory/$FAMILY/${BASE}.lua" "generations/accepted/${BASE}.lua"
          cp "generations/factory/$FAMILY/${BASE}.luac" "generations/accepted/${BASE}.luac"
          cp "generations/factory/$FAMILY/${BASE}-CHANGELOG.md" "generations/accepted/${BASE}-CHANGELOG.md"
          cp "generations/factory/$FAMILY/${BASE}-changelog.json" "generations/accepted/${BASE}-changelog.json"
          printf '{"status":"accepted","mode":"substantive-ai-factory","family":"%s","generation":"%s","score":%s,"updated":"%s","lua":"generations/accepted/%s.lua","luac":"generations/accepted/%s.luac","changelog":"generations/accepted/%s-CHANGELOG.md"}\n' "$FAMILY" "$BASE" "$SCORE" "$(date -u +%FT%TZ)" "$BASE" "$BASE" "$BASE" > reports/status.json
          node scripts/rebuild-factory-catalog.mjs
      - name: Commit factory output
        shell: bash
        run: |
          git config user.name 'mt12-luac-factory'
          git config user.email 'mt12-luac-factory@users.noreply.github.com'
          git add generations reports factory.html factory-admin.js
          git diff --cached --quiet && exit 0
          git commit -m "Substantive AI LUAC factory batch $(date -u +%Y-%m-%dT%H:%MZ) [skip factory]"
          git pull --rebase
          git push
      - name: Upload substantive downloadable factory build
        uses: actions/upload-artifact@v4
        with:
          name: mt12-substantive-ai-lua-luac
          path: |
            generations/factory/
            generations/accepted/
            reports/factory-catalog.json
            reports/status.json
            reports/rejection-summary.json
            reports/*-CHANGELOG.md
            reports/*-changelog.json
            reports/*-gate.txt
            reports/*-sim.json
          retention-days: 30