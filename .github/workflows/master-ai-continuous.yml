name: MT12 Hand-Built AI Continuous

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: mt12-hand-ai
  cancel-in-progress: false

jobs:
  engineer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MT12_LIMIT: '88944'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Generate structural candidate
        run: node scripts/master-ai.mjs
      - name: Simulate, compile, normalize and gate
        id: gate
        shell: bash
        run: |
          set +e
          CANDIDATE=$(find generations/candidates -maxdepth 1 -name '*.lua' | sort | tail -1)
          BASE=$(basename "$CANDIDATE" .lua)
          RAW="generations/candidates/${BASE}_raw.luac"
          FINAL="generations/candidates/${BASE}.luac"
          REPORT="reports/${BASE}-gate.txt"
          PASS=1
          {
            echo "engine=hand-built-structural"
            echo "candidate=$CANDIDATE"
            echo "started=$(date -u +%FT%TZ)"
            node scripts/simulator.mjs "$CANDIDATE" || PASS=0
            node scripts/static-gate.mjs "$CANDIDATE" || PASS=0
            luac5.3 -p "$CANDIDATE" || PASS=0
            if [ "$PASS" = 1 ]; then luac5.3 -s -o "$RAW" "$CANDIDATE" || PASS=0; fi
            if [ "$PASS" = 1 ]; then node toolchain/normalize_luac53_mt12.js "$RAW" "$FINAL" || PASS=0; fi
            if [ "$PASS" = 1 ]; then
              BYTES=$(wc -c < "$FINAL" | tr -d ' ')
              echo "normalized_bytes=$BYTES"
              echo "margin=$((MT12_LIMIT-BYTES))"
              [ "$BYTES" -le "$MT12_LIMIT" ] || PASS=0
            fi
            echo "passed=$PASS"
            echo "finished=$(date -u +%FT%TZ)"
          } > "$REPORT" 2>&1
          cat "$REPORT"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"
      - name: Promote accepted generation and learning state
        if: steps.gate.outputs.pass == '1'
        shell: bash
        run: |
          BASE='${{ steps.gate.outputs.base }}'
          cp "generations/candidates/${BASE}.lua" "generations/accepted/${BASE}.lua"
          cp "generations/candidates/${BASE}.luac" "generations/accepted/${BASE}.luac"
          cp reports/pending-state.json reports/hand-ai-state.json
          cp "reports/${BASE}-gate.txt" reports/latest-accepted.txt
          SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/pending-state.json')).last.score)")
          printf '{"generation":"%s","engine":"hand-built-structural","status":"accepted","score":%s,"updated":"%s","luac":"generations/accepted/%s.luac"}\n' "$BASE" "$SCORE" "$(date -u +%FT%TZ)" "$BASE" > reports/status.json
      - name: Record rejected architecture
        if: steps.gate.outputs.pass != '1'
        shell: bash
        run: |
          BASE='${{ steps.gate.outputs.base }}'
          printf '{"generation":"%s","engine":"hand-built-structural","status":"rejected","updated":"%s","report":"reports/%s-gate.txt"}\n' "$BASE" "$(date -u +%FT%TZ)" "$BASE" > reports/status.json
      - name: Commit engineering evidence
        shell: bash
        run: |
          git config user.name 'mt12-hand-ai'
          git config user.email 'mt12-hand-ai@users.noreply.github.com'
          git add generations reports
          git diff --cached --quiet && exit 0
          STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/status.json')).status)")
          git commit -m "Hand AI architecture cycle: ${STATUS} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Upload cycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: mt12-hand-ai-cycle
          path: |
            generations/candidates/
            generations/accepted/
            reports/
          retention-days: 30
