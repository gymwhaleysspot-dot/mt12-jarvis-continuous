name: MT12 Autonomous AI LUAC Factory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-ai-continuous.yml'
      - 'scripts/**'
      - 'toolchain/**'
      - 'factory-admin.js'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  models: read

concurrency:
  group: mt12-luac-factory
  cancel-in-progress: false

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MT12_LIMIT: '88944'
      MT12_HARD_MARGIN: '48'
      MT12_RESERVE_TARGET: '256'
      MIN_CHAMPION_GAIN: '0.15'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
      FACTORY_MODELS: openai/gpt-4.1,openai/gpt-4o-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install LUAC vault controls
        run: node scripts/install-factory-admin.mjs
      - name: Mark factory started
        run: |
          mkdir -p reports
          node -e "require('fs').writeFileSync('reports/status.json',JSON.stringify({status:'building',mode:'cognitive-governed-metacognitive-factory',stage:'bootstrap',updated:new Date().toISOString()},null,2)+'\n')"
      - name: Install and verify Lua 5.3
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lua5.3 && break
            sudo dpkg --configure -a || true
            sleep $((attempt * 3))
          done
          command -v lua5.3
          command -v luac5.3
      - name: Prepare MT12 normalizer
        run: cp toolchain/normalize_luac53_mt12.js toolchain/normalize_luac53_mt12.cjs
      - name: Build engineering mission and world model
        run: node scripts/autonomous-engineering-system.mjs preflight
      - name: Form hypotheses goals uncertainty and tool plan
        run: node scripts/reasoning-orchestrator.mjs preflight
      - name: Activate twenty-part cognitive governance
        run: node scripts/cognitive-governance.mjs preflight
      - name: Build mission-driven AI controller
        id: architecture
        continue-on-error: true
        run: |
          node -e "require('fs').writeFileSync('reports/status.json',JSON.stringify({status:'building',mode:'cognitive-governed-metacognitive-factory',stage:'deliberated hypothesis-driven architecture',updated:new Date().toISOString()},null,2)+'\n')"
          node scripts/master-ai.mjs
      - name: Classify architecture outcome
        id: outcome
        if: always()
        shell: bash
        env:
          ARCH_OUTCOME: ${{ steps.architecture.outcome }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let p={status:'unknown',error:''};
          try{p=JSON.parse(fs.readFileSync('reports/multi-agent-progress.json','utf8'))}catch{}
          const text=String(p.error||p.lastModelError||'').toLowerCase();
          const external=/github_models_retirement_brownout|temporarily unavailable|rate.?limit|quota|http 410|http 429|http 5\d\d|timeout|econnreset|service unavailable/.test(text);
          const architecture=process.env.ARCH_OUTCOME||'unknown';
          let kind='success';
          if(architecture==='failure')kind=external?'deferred':'failed';
          const status=kind==='deferred'?{status:'deferred',mode:'cognitive-governed-metacognitive-factory',stage:'external model service unavailable',deferred:true,reason:text.slice(0,800),updated:new Date().toISOString(),diagnostics:'reports/multi-agent-progress.json'}:kind==='failed'?{status:'builder-failed',mode:'cognitive-governed-metacognitive-factory',stage:'architecture',error:text.slice(0,800),updated:new Date().toISOString(),diagnostics:'reports/multi-agent-progress.json'}:{status:'architecture-complete',mode:'cognitive-governed-metacognitive-factory',stage:'validation',updated:new Date().toISOString()};
          fs.mkdirSync('reports',{recursive:true});
          fs.writeFileSync('reports/status.json',JSON.stringify(status,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`kind=${kind}\n`);
          NODE
      - name: Compile normalize and deeply validate candidates
        if: steps.outcome.outputs.kind == 'success'
        shell: bash
        run: |
          set +e
          mkdir -p generations/factory generations/accepted generations/quarantined reports
          : > reports/factory-results.tsv
          node -e "const p=require('./reports/pending-factory.json');for(const x of p.batch)console.log(x.file)" | while read CANDIDATE; do
            BASE=$(basename "$CANDIDATE" .lua)
            RAW="generations/candidates/${BASE}_raw.luac"
            FINAL="generations/candidates/${BASE}.luac"
            REPORT="reports/${BASE}-gate.txt"
            PASS=1; BUILD=1; BYTES=0; MARGIN=0
            {
              echo "engine=cognitive-governed-metacognitive-mt12-ai-luac-factory"
              echo "candidate=$CANDIDATE"
              node scripts/all-function-gate.mjs "$CANDIDATE" || PASS=0
              node scripts/simulator.mjs "$CANDIDATE" || PASS=0
              node scripts/static-gate.mjs "$CANDIDATE" || PASS=0
              node scripts/replay-real-logs.mjs "$CANDIDATE" || true
              node scripts/ablation-test.mjs "$CANDIDATE" || true
              node scripts/semantic-diff.mjs "$CANDIDATE" || PASS=0
              node scripts/reasoning-orchestrator.mjs gate || PASS=0
              node scripts/cognitive-governance.mjs gate "$CANDIDATE" || PASS=0
              luac5.3 -p "$CANDIDATE" || BUILD=0
              [ "$BUILD" = 1 ] && luac5.3 -s -o "$RAW" "$CANDIDATE" || BUILD=0
              [ "$BUILD" = 1 ] && node toolchain/normalize_luac53_mt12.cjs "$RAW" "$FINAL" || BUILD=0
              if [ "$BUILD" = 1 ]; then
                BYTES=$(wc -c < "$FINAL" | tr -d ' ')
                MARGIN=$((MT12_LIMIT-BYTES))
                echo "normalized_bytes=$BYTES"
                echo "margin=$MARGIN"
                [ "$BYTES" -le "$MT12_LIMIT" ] || PASS=0
                [ "$MARGIN" -ge "$MT12_HARD_MARGIN" ] || PASS=0
              else PASS=0; fi
              echo "buildable=$BUILD"
              echo "passed=$PASS"
            } > "$REPORT" 2>&1
            node scripts/write-generation-changelog.mjs "$BASE" || PASS=0
            cat "$REPORT"
            SCORE=$(node -e "const r=require('./reports/${BASE}-sim.json');console.log(r.score||0)" 2>/dev/null || echo 0)
            FAMILY=$(node -e "const r=require('./reports/${BASE}-sim.json');console.log(r.family||'factory')" 2>/dev/null || echo factory)
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$PASS" "$SCORE" "$FAMILY" "$BASE" "$BYTES" "$MARGIN" >> reports/factory-results.tsv
            if [ "$PASS" = 1 ]; then
              mkdir -p "generations/factory/$FAMILY"
              cp "$CANDIDATE" "generations/factory/$FAMILY/${BASE}.lua"
              cp "$FINAL" "generations/factory/$FAMILY/${BASE}.luac"
              cp "reports/${BASE}-CHANGELOG.md" "generations/factory/$FAMILY/${BASE}-CHANGELOG.md"
              cp "reports/${BASE}-changelog.json" "generations/factory/$FAMILY/${BASE}-changelog.json"
            elif [ "$BUILD" = 1 ]; then
              mkdir -p "generations/quarantined/$FAMILY"
              cp "$CANDIDATE" "generations/quarantined/$FAMILY/${BASE}.lua"
              cp "$FINAL" "generations/quarantined/$FAMILY/${BASE}.luac"
            fi
          done
      - name: Run engineering council belief update and reflection
        if: steps.outcome.outputs.kind == 'success'
        run: |
          node scripts/autonomous-engineering-system.mjs postflight
          node scripts/reasoning-orchestrator.mjs postflight
          node scripts/cognitive-governance.mjs postflight
      - name: Promote only a true new champion
        if: steps.outcome.outputs.kind == 'success'
        shell: bash
        run: |
          set +e
          BEST=$(node scripts/select-champion.mjs); SELECT_RC=$?
          if [ "$SELECT_RC" -ne 0 ] || [ -z "$BEST" ]; then
            node scripts/write-rejection-summary.mjs || true
            node scripts/quarantine-generation.mjs || true
            node scripts/category-champions.mjs || true
            node scripts/reasoning-orchestrator.mjs postcycle || true
            node scripts/cognitive-governance.mjs postcycle || true
            CHAMPION=$(node -e "const d=require('./reports/champion-decision.json');console.log(d.champion?.base||'none')" 2>/dev/null || echo none)
            node - "$CHAMPION" <<'NODE'
          const fs=require('fs'),champion=process.argv[2];fs.writeFileSync('reports/status.json',JSON.stringify({status:'champion-held',mode:'cognitive-governed-metacognitive-factory',champion,updated:new Date().toISOString(),decision:'reports/champion-decision.json',brief:'reports/engineering-brief.json',cognitive:'reports/cognitive-cycle-summary.json',reflection:'reports/post-cycle-reflection.json'},null,2)+'\n');
          NODE
            node scripts/rebuild-factory-catalog.mjs || true
            exit 0
          fi
          SCORE=$(echo "$BEST" | cut -f1); FAMILY=$(echo "$BEST" | cut -f2); BASE=$(echo "$BEST" | cut -f3); MARGIN=$(echo "$BEST" | cut -f4)
          cp "generations/factory/$FAMILY/${BASE}.lua" "generations/accepted/${BASE}.lua"
          cp "generations/factory/$FAMILY/${BASE}.luac" "generations/accepted/${BASE}.luac"
          cp "generations/factory/$FAMILY/${BASE}-CHANGELOG.md" "generations/accepted/${BASE}-CHANGELOG.md"
          cp "reports/${BASE}-changelog.json" "generations/accepted/${BASE}-changelog.json"
          node scripts/category-champions.mjs || true
          node scripts/autonomous-engineering-system.mjs postflight || true
          node scripts/reasoning-orchestrator.mjs postcycle || true
          node scripts/cognitive-governance.mjs postcycle || true
          node - "$FAMILY" "$BASE" "$SCORE" "$MARGIN" <<'NODE'
          const fs=require('fs');const [family,generation,score,margin]=process.argv.slice(2);fs.writeFileSync('reports/status.json',JSON.stringify({status:'accepted',mode:'cognitive-governed-metacognitive-factory',family,generation,score:Number(score),margin:Number(margin),updated:new Date().toISOString(),lua:`generations/accepted/${generation}.lua`,luac:`generations/accepted/${generation}.luac`,decision:'reports/champion-decision.json',cognitive:'reports/cognitive-cycle-summary.json',promotionExplanation:'reports/promotion-explanation.json',reflection:'reports/post-cycle-reflection.json'},null,2)+'\n');
          NODE
          node scripts/rebuild-factory-catalog.mjs
      - name: Commit factory output and engineering knowledge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mt12-autonomous-ai-factory'
          git config user.email 'mt12-luac-factory@users.noreply.github.com'
          git add generations reports factory.html factory-admin.js 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Cognitive-governed MT12 AI engineering cycle $(date -u +%Y-%m-%dT%H:%MZ) [skip factory]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          exit 1
      - name: Upload complete engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt12-cognitive-governed-ai-engineering-factory
          path: |
            generations/factory/
            generations/accepted/
            generations/quarantined/
            reports/
          retention-days: 30
      - name: Fail only for an internal architecture defect
        if: steps.outcome.outputs.kind == 'failed'
        run: exit 1
