name: Build MT12 LUAC
on:
  push:
    paths:
      - 'builds/queue/*.lua'
      - 'toolchain/**'
      - '.github/workflows/build-luac.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Build queued controllers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/output builds/reports
          shopt -s nullglob
          files=(builds/queue/*.lua)
          if (( ${#files[@]} == 0 )); then echo 'No queued Lua sources.'; exit 0; fi
          for src in "${files[@]}"; do
            name=$(basename "$src" .lua)
            out="builds/output/$name.luac"
            report="builds/reports/$name.txt"
            {
              echo "MT12 Jarvis build"
              echo "source=$src"
              echo "utc=$(date -u +%FT%TZ)"
              bash toolchain/build_mt12.sh "$src" "$out" 88944
              echo "sha256=$(sha256sum "$out" | awk '{print $1}')"
              echo "header=$(xxd -p -l 17 "$out")"
            } | tee "$report"
          done
      - name: Commit outputs
        run: |
          if git diff --quiet -- builds/output builds/reports; then exit 0; fi
          git config user.name 'mt12-jarvis-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add builds/output builds/reports
          git commit -m 'Build queued MT12 LUAC artifacts'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: mt12-luac-builds
          path: |
            builds/output/*.luac
            builds/reports/*.txt
