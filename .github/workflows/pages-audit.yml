name: Pages Wiring Audit
on:
  pull_request:
    paths:
      - '*.html'
      - assets/jarvis-os.*
      - classic-token.js
      - scripts/prepare-pages.mjs
      - .github/workflows/*.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate unified shell and compatibility routes
        run: |
          set -euo pipefail
          node --check assets/jarvis-os.js
          node --check classic-token.js
          node --check scripts/prepare-pages.mjs
          node scripts/prepare-pages.mjs
          grep -q 'Jarvis Engineering Intelligence' index.html
          for route in command evidence intelligence factory controllers system; do grep -q "data-route=\"$route\"" index.html; done
          grep -q 'index.html#intelligence' research.html
          grep -q 'index.html#factory' builder.html
          grep -q 'index.html#controllers' builds.html
          grep -q 'index.html#system' device.html
