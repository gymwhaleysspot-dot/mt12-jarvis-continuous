name: Jarvis Complete Wiring Audit
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-*.html
      - assets/mjx7303/**
      - jarvis/**
      - classic-token.js
      - tools/**
      - scripts/**
      - factory/**
      - public/**
      - .github/workflows/**
  pull_request:
    paths:
      - index.html
      - racing-mjx7303-*.html
      - assets/mjx7303/**
      - jarvis/**
      - classic-token.js
      - tools/**
      - scripts/**
      - factory/**
      - .github/workflows/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-complete-wiring-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate source syntax and workflow topology
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          python3 -m compileall -q tools
          python3 tools/audit_workflow_wiring.py
          python3 -m json.tool jarvis/capabilities.json >/dev/null
          node scripts/prepare-pages.mjs
      - name: Validate MICHAEL V41 licensed personal-twin contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');const check=(f,t,l=t)=>{if(!fs.existsSync(f))throw Error('Missing file '+f);const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Missing ${l} in ${f}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');check('index.html','workspaceBody');check('jarvis/app.js','latestGeneration');check('jarvis/state.js','factory/canonical-controller.json');
          check('racing-mjx7303-michael-v39.html','MICHAEL PERSONAL TWIN V41');check('racing-mjx7303-michael-v39.html','LICENSED C3 WRC DIGITAL TWIN');check('racing-mjx7303-michael-v39.html','michael49');
          check('jarvis/racing-tab.js','MICHAEL // V41 COMPLETE TWIN');check('jarvis/racing-tab.js','Simulator — MICHAEL V41');check('jarvis/racing-tab.js','racing-mjx7303-michael-v39.html');
          check('jarvis/jarvis-xr-engine-v29.js',"getContext('webgl2'");check('jarvis/jarvis-xr-engine-v29.js','Dggx');check('jarvis/jarvis-xr-engine-v29.js','aces');check('jarvis/jarvis-xr-engine-v29.js','loadGLB');check('jarvis/jarvis-xr-engine-v29.js','shadowFbo');
          check('jarvis/jarvis-ai-graphics-v38.js','MULTILOBE_CLEARCOAT_ENVIRONMENT');check('jarvis/michael-graphics-v39.js','MICHAEL_V41');check('jarvis/michael-graphics-v39.js','COMPLETE_LICENSED_RALLY_TWIN');check('jarvis/michael-graphics-v39.js','printerToMichael');check('jarvis/michael-graphics-v39.js','addCompletedTwin');check('jarvis/michael-graphics-v39.js','wheelbase:3.75');check('jarvis/michael-graphics-v39.js','wheels:4');check('jarvis/michael-graphics-v39.js',"url.startsWith('blob:')");check('jarvis/michael-graphics-v39.js','[.72,.012,.026]');check('jarvis/michael-graphics-v39.js','2.25');
          check('jarvis/jarvis-dynamics-v30.js','fixed=1/120');check('jarvis/jarvis-dynamics-v30.js','impactDamage');check('jarvis/jarvis-dynamics-v30.js','_healthySpawn');
          check('jarvis/mjx7303-racing-michael-v39.js','./michael-graphics-v39.js');check('jarvis/mjx7303-racing-michael-v39.js','./jarvis-dynamics-v30.js');check('jarvis/mjx7303-racing-michael-v39.js','michael-v40-payload-00.js');check('jarvis/mjx7303-racing-michael-v39.js','michael-v40-payload-06.js');check('jarvis/mjx7303-racing-michael-v39.js','createObjectURL');check('jarvis/mjx7303-racing-michael-v39.js','MICHAEL V41');check('jarvis/mjx7303-racing-michael-v39.js','__MICHAEL_READY');
          for(const p of ['00','01','02','03','04','05','06'])check('jarvis/michael-v40-payload-'+p+'.js',\"export default '\");const manifest=JSON.parse(fs.readFileSync('tools/michael-v40-private/MANIFEST.json','utf8'));if(manifest.id!=='MICHAEL_V40_PERSONAL_C3_WRC'||manifest.processing.retainedTriangles!==160000)throw Error('Wrong Michael V40 manifest');const parts=fs.readdirSync('tools/michael-v40-private').filter(n=>n.startsWith('body.glb.b64.')).sort();if(parts.length!==7)throw Error('Michael V40 payload must have seven parts');const b=Buffer.from(parts.map(n=>fs.readFileSync('tools/michael-v40-private/'+n,'utf8')).join(''),'base64');if(b.length!==3154380||b.subarray(0,4).toString('ascii')!=='glTF')throw Error('Michael V40 payload invalid');const jl=b.readUInt32LE(12),g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');if(!names.some(n=>n.includes('MICHAEL_LICENSED_C3_WRC_BODY_V40')))throw Error('Michael licensed authority node missing');
          const runtime=fs.readFileSync('jarvis/mjx7303-racing-michael-v39.js','utf8')+fs.readFileSync('jarvis/michael-graphics-v39.js','utf8')+fs.readFileSync('jarvis/jarvis-ai-graphics-v38.js','utf8')+fs.readFileSync('jarvis/jarvis-xr-engine-v29.js','utf8');for(const banned of ['playcanvas@','three.module','babylon.js','BABYLON'])if(runtime.includes(banned))throw Error('External renderer leaked into MICHAEL: '+banned);
          console.log({racing:'MICHAEL_V41',asset:'Licensed C3 WRC personal twin',triangles:160000,renderer:'MICHAEL multi-lobe clearcoat',supersampling:'135-225%',externalRenderer:false});
          NODE
      - name: Validate planner schema contract
        run: |
          python3 tools/jarvis_intelligence_planner.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('public/jarvis-data/experiment-plan.json').read_text());e=p['nextExperiment']
          assert p['schema']=='JARVIS-EXPERIMENT-PLAN-4';assert len(e['portfolio'])==5;assert e['synthesis']['area']=='synthesis-all-five';assert e['acceptanceCriteria']['mustPreserveCanonicalFloor'] is True
          print({'planner':p['schema'],'experiment':e['id']})
          PY
      - name: Validate UI contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),c=require('./jarvis/capabilities.json'),state=fs.readFileSync('jarvis/state.js','utf8');if(c.schema<7)throw Error('Jarvis UI contract must be v7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];const ids=new Set(c.workspaces.map(w=>w.id));for(const id of required)if(!ids.has(id))throw Error('Required workspace missing '+id);
          if(c.orchestration.policy!=='ONE_SCHEDULER_ONE_PRODUCER')throw Error('Wrong producer topology');if(c.orchestration.controllerProducer!=='jarvis-complete-rewrite-factory.yml')throw Error('Wrong controller producer');if(c.controllerLineage.canonicalAuthority!=='factory/canonical-controller.json')throw Error('Wrong canonical authority source');if(!state.includes("api.workflowRuns('jarvis-complete-rewrite-factory.yml'"))throw Error('Missing dynamic rewrite-run loader');console.log({schema:c.schema,workspaces:c.workspaces.length});
          NODE
      - name: Validate canonical defended release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('factory/canonical-controller.json').read_text());r=a['release'];base=Path('public/builds/releases')/r;src=base/f'{r}.lua';luac=base/f'{r}.luac';manifest=base/'MANIFEST.json';assert src.exists() and luac.exists() and manifest.exists();m=json.loads(manifest.read_text());assert m['release']==r;assert m['normalizedBytes']<=87000;assert luac.stat().st_size==m['normalizedBytes'];print({'release':r,'bytes':m['normalizedBytes']})
          PY
      - name: Validate firmware helper wiring
        run: |
          set -euo pipefail
          test -f .github/workflows/firmware-build-flash.yml
          grep -q 'mt12-flasher' .github/workflows/firmware-build-flash.yml
          test -f .github/workflows/mt12-sync.yml
          grep -q 'mt12-sync' .github/workflows/mt12-sync.yml
