name: Jarvis Complete Wiring Audit

on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing.html
      - racing-v2.html
      - racing-mjx7303-v6.html
      - jarvis/**
      - classic-token.js
      - tools/**
      - scripts/**
      - public/builds/**
      - public/jarvis-data/**
      - public/evidence-data/**
      - factory/**
      - .github/workflows/**
  pull_request:
    paths:
      - index.html
      - racing.html
      - racing-v2.html
      - racing-mjx7303-v6.html
      - jarvis/**
      - classic-token.js
      - tools/**
      - scripts/**
      - factory/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jarvis-complete-wiring-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate workstation HTML JavaScript Python JSON and compatibility routes
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          python3 -m compileall -q tools
          python3 tools/audit_workflow_wiring.py
          python3 -m json.tool jarvis/capabilities.json >/dev/null
          node scripts/prepare-pages.mjs
          grep -q 'Jarvis MT12 Engineering Workstation' index.html
          grep -q 'workspaceBody' index.html
          grep -q 'iphone-sync-boot.js' index.html
          grep -q 'schedulePill' index.html
          grep -q 'jarvis/countdown.js' index.html
          grep -q 'jarvis/winner-downloads.js' index.html
          grep -q 'latestGeneration' jarvis/app.js
          grep -q 'DOWNLOAD LUAC' jarvis/app.js
          grep -q 'sourceLua' jarvis/winner-downloads.js
          grep -q "lua.textContent='LUA'" jarvis/winner-downloads.js
          grep -q 'CADENCE_MINUTES=15' jarvis/countdown.js
          grep -q 'rewrite-<run-id>-<attempt>' jarvis/capabilities.json
          grep -q 'workflowRuns' jarvis/api.js
          grep -q 'discoverGenerations' jarvis/state.js
          grep -q "factory/canonical-controller.json" jarvis/state.js
          grep -q 'public/builds/releases/${name}/' jarvis/state.js
          grep -q 'webkitdirectory' jarvis/iphone-sync.js
          grep -q 'MJX 7303 MT12 Simulator V7' racing-mjx7303-v6.html
          grep -q 'body\[data-mode="garage"\] .controls{display:none}' racing-mjx7303-v6.html
          grep -q 'mjx7303-physics-v4.js' racing-mjx7303-v6.html
          grep -q 'mjx7303-game-v6.js' racing-mjx7303-v6.html
          grep -q 'racing-mjx7303-v6.html' jarvis/racing-tab.js
          grep -q 'THREE' jarvis/mjx7303-render-v6.js
          for f in chief.html builds.html mission.html completion.html device.html control.html research.html discovery.html v3.html updates.html builder.html web/index.html; do grep -q 'Opening Jarvis' "$f"; done

      - name: Validate UI contract and workflow topology
        run: |
          node - <<'NODE'
          const fs=require('fs');const c=require('./jarvis/capabilities.json');const state=fs.readFileSync('jarvis/state.js','utf8');
          if(c.schema<7)throw Error('Jarvis UI contract must be v7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];
          const workspaceIds=new Set(c.workspaces.map(w=>w.id));
          for(const id of required)if(!workspaceIds.has(id))throw Error('Required workspace missing '+id);
          if(c.workspaces.length<required.length)throw Error('Jarvis workspace contract incomplete');
          if(c.orchestration.policy!=='ONE_SCHEDULER_ONE_PRODUCER')throw Error('Wrong producer topology');
          if(c.orchestration.controllerProducer!=='jarvis-complete-rewrite-factory.yml')throw Error('Wrong controller producer');
          if(c.controllerLineage.canonicalAuthority!=='factory/canonical-controller.json')throw Error('Wrong canonical authority source');
          if(c.controllerLineage.canonicalManifestPattern!=='public/builds/releases/<release>/MANIFEST.json')throw Error('Wrong canonical manifest pattern');
          const ids=new Set,paths=new Set;
          for(const m of c.missions){
            if(ids.has(m.id))throw Error('Duplicate mission id '+m.id);ids.add(m.id);
            if(!workspaceIds.has(m.workspace))throw Error('Unknown workspace '+m.workspace);
            const p='.github/workflows/'+m.workflow;if(!fs.existsSync(p))throw Error('Missing workflow '+p);paths.add(p);
            const y=fs.readFileSync(p,'utf8');if(!/workflow_dispatch\s*:/.test(y))throw Error('Not dispatchable '+p);
          }
          for(const d of c.dataSources)if(!state.includes(`'${d.path}'`))throw Error('State loader missing '+d.path);
          if(!state.includes("api.workflowRuns('jarvis-complete-rewrite-factory.yml'"))throw Error('Missing dynamic rewrite-run loader');
          for(const p of ['racing-mjx7303-v6.html','jarvis/mjx7303-physics-v4.js','jarvis/mjx7303-render-v6.js','jarvis/mjx7303-game-v6.js'])if(!fs.existsSync(p))throw Error('Racing simulator asset missing '+p);
          console.log({schema:c.schema,workspaces:c.workspaces.length,missions:ids.size,workflows:paths.size,dataSources:c.dataSources.length,canonicalAuthority:c.controllerLineage.canonicalAuthority});
          NODE

      - name: Validate canonical defended release from authority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          authority=json.loads(Path('factory/canonical-controller.json').read_text())
          release=authority['release']
          base=Path('public/builds/releases')/release
          src=base/f'{release}.lua'
          luac=base/f'{release}.luac'
          manifest=base/'MANIFEST.json'
          assert src.exists(),src
          assert luac.exists(),luac
          assert manifest.exists(),manifest
          m=json.loads(manifest.read_text())
          assert m['release']==release,(m.get('release'),release)
          assert m['normalizedBytes']<=87000,m['normalizedBytes']
          assert luac.stat().st_size==m['normalizedBytes'],(luac.stat().st_size,m['normalizedBytes'])
          s=src.read_text()
          for token in ('local pc=pcall','/LOGS/m0','/LOGS/m1','local function memOpt','local function watch','V[179]*.0045','92+4*dc','bb_line(151,rg4,0)'):
              assert token in s, token
          print({'release':release,'bytes':m['normalizedBytes'],'authority':m['authority']})
          PY

      - name: Validate active experimental evolution parent
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('factory/evolution-controller.json')
          assert p.exists(),'Missing evolution-controller.json'
          e=json.loads(p.read_text())
          canonical=json.loads(Path('factory/canonical-controller.json').read_text())
          assert e['canonicalFloor']==canonical['release'],(e.get('canonicalFloor'),canonical['release'])
          assert e['candidate'] in {'jrw1','jrw2','jrw3','jrw4','jrw5','jrw6'},e.get('candidate')
          assert e['normalizedBytes']<=87000,e['normalizedBytes']
          src=Path(e['sourcePath']);luac=Path(e['deployPath'])
          assert src.exists(),src
          assert luac.exists(),luac
          assert luac.stat().st_size==e['normalizedBytes'],(luac.stat().st_size,e['normalizedBytes'])
          print({'release':e['release'],'candidate':e['candidate'],'generationRun':e['generationRun'],'bytes':e['normalizedBytes'],'authority':e['authority'],'canonicalFloor':e['canonicalFloor']})
          PY

      - name: Validate persisted rewrite generation model
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          roots=[]
          for p in Path('public/builds').iterdir():
              m=re.fullmatch(r'rewrite-(\d+)-(\d+)',p.name)
              if m and (p/'TOURNAMENT.json').exists(): roots.append((int(m.group(1)),int(m.group(2)),p))
          assert roots,'No persisted rewrite generations found'
          _,_,p=max(roots)
          t=json.loads((p/'TOURNAMENT.json').read_text())
          assert t.get('parent'),t
          assert t.get('winner'),t
          compiled=[c for c in t['candidates'] if c.get('status')=='COMPILED']
          assert compiled
          assert len({c['sourceSha256'] for c in compiled})==len(compiled)
          assert len({c['luacSha256'] for c in compiled})==len(compiled)
          for c in compiled:
              cid=c['candidate']; base=p/cid
              assert (base/f'{cid}.lua').exists()
              assert (base/f'{cid}.luac').exists()
              assert (base/'MANIFEST.json').exists()
              assert c['normalizedBytes']<=87000
          print({'generation':p.name,'parent':t['parent'],'winner':t['winner'],'compiled':len(compiled)})
          PY

      - name: Validate public-read request budget and UI generation identity
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('jarvis/state.js','utf8');const a=fs.readFileSync('jarvis/app.js','utf8');const w=fs.readFileSync('jarvis/winner-downloads.js','utf8');const c=fs.readFileSync('jarvis/countdown.js','utf8');
          const fixed=(s.match(/'[^']+\.json'/g)||[]).length;
          if(!s.includes('.slice(0,20)'))throw Error('Generation history is not API-budget bounded');
          if(!s.includes("buildName:`${String(c.candidate||'').toUpperCase()}-${g.runNumber}`"))throw Error('Run-qualified buildName is not constructed in state');
          if(!a.includes('esc(c.buildName)'))throw Error('Run-qualified buildName is not rendered by UI');
          if(!a.includes('runtimeIdentity?.token'))throw Error('Runtime identity missing from UI');
          if(!s.includes("api.optionalFile(base+'TOURNAMENT.json')"))throw Error('Tournament data loader missing');
          if(!w.includes("lua.textContent='LUA'"))throw Error('Winner LUA source download missing');
          if(!c.includes('CADENCE_MINUTES=15'))throw Error('15-minute countdown contract missing');
          console.log({fixedJsonReferences:fixed,generationHistory:20,publicBudget:'bounded',winnerIdentity:'candidate-run',tournamentData:'loaded',winnerDownloads:'lua+luac',countdownMinutes:15});
          NODE

      - name: Validate repository JSON syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          roots=[Path('jarvis'),Path('factory'),Path('research'),Path('public')]
          skip=('public/builds/','research/history/','engineering-missions/history/')
          bad=[];checked=0
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.json'):
                  s=p.as_posix()
                  if any(s.startswith(x) for x in skip): continue
                  try: json.loads(p.read_text());checked+=1
                  except Exception as e: bad.append(f'{s}: {e}')
          if bad: raise SystemExit('JSON errors:\n'+'\n'.join(bad))
          print({'jsonFilesChecked':checked})
          PY

      - name: Validate firmware and MT12 helper wiring
        run: |
          set -euo pipefail
          test -f .github/workflows/firmware-build-flash.yml
          grep -q 'mt12-flasher' .github/workflows/firmware-build-flash.yml
          grep -q 'a17y-mt12-backup' .github/workflows/firmware-build-flash.yml
          grep -q 'a17y-mt12-flash' .github/workflows/firmware-build-flash.yml
          test -f .github/workflows/mt12-sync.yml
          grep -q 'mt12-sync' .github/workflows/mt12-sync.yml
          grep -q 'a17y-mt12-detect' .github/workflows/mt12-sync.yml
          grep -q 'a17y-mt12-sync-logs' .github/workflows/mt12-sync.yml
