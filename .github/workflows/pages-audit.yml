name: Pages Wiring Audit
on:
  pull_request:
    paths:
      - '*.html'
      - site-nav.js
      - scripts/prepare-pages.mjs
      - .github/workflows/*.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate all pages, links, workflows and Home routes
        run: |
          set -euo pipefail
          node --check site-nav.js
          node --check scripts/prepare-pages.mjs
          node scripts/prepare-pages.mjs
          for f in index.html mission.html device.html control.html research.html discovery.html v3.html updates.html builder.html; do
            grep -q 'site-nav.js' "$f"
          done
