name: Michael current source audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit current source and generated runtime
        run: |
          set -Eeuo pipefail
          npm --prefix engine ci
          npm --prefix engine run build:typescript
          npm --prefix engine run build:assembly
          node --check jarvis/michael-graphics-v39.js
          node --check jarvis/michael-graphics-v40-base.js
          node --check jarvis/michael-graphics-v40.js
          node --check jarvis/mjx7303-racing-michael-v39.js
          node --check tools/michael_internal_vision.mjs
          node --check tools/nickelle_visual_ai.mjs
          grep -q 'MICHAEL_V57' engine/polyglot.json
          grep -q 'MICHAEL_V57' public/michael-v57-release.json
          grep -q 'MICHAEL PERSONAL TWIN V60' racing-mjx7303-michael-v39.html
          grep -q 'michael-graphics-v40.js' jarvis/mjx7303-racing-michael-v39.js
          grep -q 'MICHAEL GRAPHICS V60' jarvis/michael-graphics-v40.js
          grep -q 'licensed livery preservation' jarvis/michael-graphics-v40-base.js
          node - <<'NODE'
          const fs=require('fs');
          const truth=JSON.parse(fs.readFileSync('michael/visual/owner-truth.json','utf8'));
          const refs=JSON.parse(fs.readFileSync('michael/visual/owner-reference-observations.json','utf8'));
          if(truth.authorityOrder?.[0]!=='owner_photos')throw Error('owner photos are not primary');
          if(refs.authority!=='owner_photos'||(refs.repositoryFiles||[]).length<7)throw Error('owner reference set incomplete');
          NODE
