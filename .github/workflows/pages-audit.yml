name: Jarvis Complete Wiring Audit

on:
  push:
    branches: [main]
    paths:
      - index.html
      - jarvis/**
      - classic-token.js
      - tools/**
      - scripts/**
      - public/builds/**
      - public/jarvis-data/**
      - public/evidence-data/**
      - .github/workflows/**
  pull_request:
    paths:
      - index.html
      - jarvis/**
      - classic-token.js
      - tools/**
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jarvis-complete-wiring-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate core JavaScript Python JSON Pages and workflow topology
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs; do
            [ -f "$f" ] && node --check "$f"
          done
          python3 -m compileall -q tools
          python3 tools/audit_workflow_wiring.py
          python3 -m json.tool jarvis/capabilities.json >/dev/null
          python3 -m json.tool public/evidence-data/sync.json >/dev/null
          node scripts/prepare-pages.mjs
          grep -q 'Jarvis MT12 Engineering Intelligence' index.html
          grep -q 'iphone-sync-boot.js' index.html
          grep -q 'webkitdirectory' jarvis/iphone-sync.js
          grep -q 'iPhone 17 Safari Files picker' jarvis/iphone-sync.js
          grep -q 'putBytes' jarvis/api.js
          grep -q 'LUAC Downloads' jarvis/app.js
          grep -q 'BACKUP & FLASH' jarvis/app.js
          grep -q 'active-mission.json' jarvis/state.js
          grep -q 'evidence-data/sync.json' jarvis/state.js
          grep -q 'recommended.json' jarvis/state.js
          for f in chief.html builds.html mission.html completion.html device.html control.html research.html discovery.html v3.html updates.html builder.html web/index.html; do
            grep -q 'Opening Jarvis' "$f"
          done

      - name: Validate repository JSON syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          roots=[Path('jarvis'),Path('factory'),Path('research'),Path('public')]
          skip=('public/builds/', 'research/history/', 'engineering-missions/history/')
          bad=[]; checked=0
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.json'):
                  s=p.as_posix()
                  if any(s.startswith(x) for x in skip): continue
                  try:
                      json.loads(p.read_text())
                      checked+=1
                  except Exception as e:
                      bad.append(f'{s}: {e}')
          if bad:
              raise SystemExit('JSON errors:\n'+'\n'.join(bad))
          print({'jsonFilesChecked':checked})
          PY

      - name: Validate every UI mission points to a dispatchable workflow file
        run: |
          node - <<'NODE'
          const fs=require('fs');const c=require('./jarvis/capabilities.json');
          if(c.workspaces.length!==10)throw Error('Expected ten workspaces');
          const ids=new Set,paths=new Set;
          for(const m of c.missions){
            if(ids.has(m.id))throw Error('Duplicate mission id '+m.id);ids.add(m.id);
            if(!c.workspaces.some(w=>w.id===m.workspace))throw Error('Unknown workspace '+m.workspace);
            const p='.github/workflows/'+m.workflow;
            if(!fs.existsSync(p))throw Error('Missing workflow '+p);paths.add(p);
            const y=fs.readFileSync(p,'utf8');
            if(!/workflow_dispatch\s*:/.test(y))throw Error('Not dispatchable '+p);
          }
          const sources=new Set(c.dataSources.map(x=>x.path));
          const state=fs.readFileSync('jarvis/state.js','utf8');
          for(const p of sources)if(!state.includes(`'${p}'`))throw Error('Data source not loaded by state.js: '+p);
          console.log({missions:ids.size,workflows:paths.size,dataSources:sources.size});
          NODE

      - name: Exercise evolution persistence and publication contract twice
        run: |
          set -euo pipefail
          python3 tools/jarvis_evolution_gate.py > /tmp/gate1.json
          cp public/builds/index.json /tmp/index1.json
          python3 tools/jarvis_evolution_gate.py > /tmp/gate2.json
          node - <<'NODE'
          const fs=require('fs'),a=require('/tmp/index1.json'),b=require('./public/builds/index.json');
          if(a.uniqueBuilds!==b.uniqueBuilds)throw Error(`Unique builds vanished across rerun: ${a.uniqueBuilds} -> ${b.uniqueBuilds}`);
          if(a.builds.length!==b.builds.length)throw Error('Build list is not persistent');
          const names=new Set,hashes=new Set;
          for(const x of b.builds){
            if(!/^[a-z][a-z0-9]{0,5}$/.test(x.name))throw Error('Bad deploy identity '+x.name);
            if(names.has(x.name)||hashes.has(x.luacSha256))throw Error('Duplicate accepted controller');
            names.add(x.name);hashes.add(x.luacSha256);
            const base=x.base;
            if(!fs.existsSync(base+x.deploy)||!fs.existsSync(base+x.bundle)||!fs.existsSync(base+x.audit))throw Error('Broken download wiring '+x.name);
          }
          if(b.recommended&&!b.builds.some(x=>x.name===b.recommended&&x.promotionEligible))throw Error('Invalid recommendation');
          console.log({unique:b.uniqueBuilds,rejected:b.duplicatesRejected,recommended:b.recommended});
          NODE

      - name: Validate firmware sync and optional-helper wiring
        run: |
          set -euo pipefail
          test -f .github/workflows/firmware-build-flash.yml
          grep -q 'mt12-flasher' .github/workflows/firmware-build-flash.yml
          grep -q 'a17y-mt12-backup' .github/workflows/firmware-build-flash.yml
          grep -q 'a17y-mt12-flash' .github/workflows/firmware-build-flash.yml
          grep -q 'public/device-data/releases.json' jarvis/state.js
          test -f .github/workflows/mt12-sync.yml
          grep -q 'mt12-sync' .github/workflows/mt12-sync.yml
          grep -q 'a17y-mt12-detect' .github/workflows/mt12-sync.yml
          grep -q 'a17y-mt12-sync-logs' .github/workflows/mt12-sync.yml
          grep -q 'historical-log-reingest.yml' jarvis/iphone-sync.js
          grep -q 'jarvis-knowledge-graph.yml' jarvis/iphone-sync.js
