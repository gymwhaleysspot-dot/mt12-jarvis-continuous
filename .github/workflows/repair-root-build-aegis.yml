name: Jarvis Aegis Evolution Stage

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Jarvis Complete Rewrite LUAC Factory"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: jarvis-aegis-evolution
  cancel-in-progress: true

env:
  MAX_BYTES: '87000'
  MAX_GROWTH_BYTES: '600'

jobs:
  evolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize current Jarvis winner
        run: git pull --rebase origin main

      - name: Install deterministic MT12 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh

      - name: Validate active tournament evolution parent
        run: |
          set -Eeuo pipefail
          python3 tools/jarvis_evolution_parent.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('factory/evolution-controller.json').read_text())
          assert p['normalizedBytes'] <= 87000, p['normalizedBytes']
          assert p['promotionPolicy'].startswith('TOURNAMENT_WINNER_AUTO'), p['promotionPolicy']
          print({'release':p['release'],'candidate':p['candidate'],'generationRun':p['generationRun'],'bytes':p['normalizedBytes'],'canonicalFloor':p['canonicalFloor']})
          PY

      - name: Generate Aegis child from live winner
        run: |
          set -Eeuo pipefail
          python3 tools/aegis_evolution_stage.py
          lua5.3 -e "assert(loadfile('aegis-next.lua'))"

      - name: Compile normalize and enforce evolution gates
        run: |
          set -Eeuo pipefail
          toolchain/compile_mt12.sh aegis-next.lua aegis-next.luac
          test -s aegis-next.luac
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          h=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          p=json.loads(Path('factory/evolution-controller.json').read_text())
          m=json.loads(Path('aegis-next.json').read_text())
          parent=Path(p['deployPath'])
          child=Path('aegis-next.luac')
          src=Path('aegis-next.lua')
          size=child.stat().st_size
          growth=size-parent.stat().st_size
          assert size <= int(os.environ['MAX_BYTES']),(size,'MT12 ceiling')
          assert growth <= int(os.environ['MAX_GROWTH_BYTES']),(growth,'Aegis growth budget')
          assert h(src) != p['sourceSha256'],'source is not novel'
          assert h(child) != p['luacSha256'],'bytecode is not novel'
          s=src.read_text()
          for token in ('AEGIS_EVOLVED_OBSERVABILITY','bb_line(142,','bb_line(143,','local pc=pcall','/LOGS/m0','/LOGS/m1','V[704]','setgv(3,m_min(V[35],ac))'):
              assert token in s,token
          m.update({'candidateSourceSha256':h(src),'candidateLuacSha256':h(child),'candidateNormalizedBytes':size,'growthBytes':growth,'headroomBytes':int(os.environ['MAX_BYTES'])-size,'hardGatesPassed':True})
          Path('aegis-next.json').write_text(json.dumps(m,indent=2)+'\n')
          print({'bytes':size,'growth':growth,'headroom':int(os.environ['MAX_BYTES'])-size})
          PY

      - name: Publish immutable Aegis evolution child
        run: |
          set -Eeuo pipefail
          ID="aegis-evolution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          B="public/builds/$ID"
          mkdir -p "$B"
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          rid=os.environ['GITHUB_RUN_ID'];att=os.environ['GITHUB_RUN_ATTEMPT']
          mid=f'aegis-evolution-{rid}-{att}'
          b=Path('public/builds')/mid
          p=json.loads(Path('factory/evolution-controller.json').read_text())
          meta=json.loads(Path('aegis-next.json').read_text())
          shutil.copy2('aegis-next.lua',b/'candidate.lua')
          shutil.copy2('aegis-next.luac',b/'candidate.luac')
          shutil.copy2(p['sourcePath'],b/'parent.lua')
          shutil.copy2(p['deployPath'],b/'parent.luac')
          h=lambda q:hashlib.sha256(Path(q).read_bytes()).hexdigest()
          status={
            'schema':5,'mission':mid,'profile':'aegis-evolution','authority':'UNVERIFIED_AEGIS_CHILD_OF_TOURNAMENT_WINNER',
            'createdAt':datetime.now(timezone.utc).isoformat(),'automaticPromotion':False,'hardGatesPassed':True,
            'benchRequired':True,'roadRequired':True,'parentRelease':p['release'],'parentCandidate':p['candidate'],
            'parentGenerationRun':p.get('generationRun'),'canonicalFloor':p['canonicalFloor'],
            'mutation':meta['mutation'],'normalizedBytes':meta['candidateNormalizedBytes'],'growthBytes':meta['growthBytes'],
            'headroomBytes':meta['headroomBytes'],'sourceSha256':meta['candidateSourceSha256'],'luacSha256':meta['candidateLuacSha256'],
            'gates':['live tournament winner parent','defended canonical floor','Lua 5.3 load','MT12 normalization','source novelty','bytecode novelty','growth <= 600 bytes','normalized <= 87000 bytes'],
            'observability':['group 142 truth source/anomaly/observability/mismatch','group 143 GPS/RPM/truth confidence context'],
            'promotion':'EVIDENCE_REQUIRED; NEVER_AUTO_CANONICAL'
          }
          (b/'STATUS.json').write_text(json.dumps(status,indent=2)+'\n')
          (b/'BUILD-AUDIT.txt').write_text(
            f"JARVIS AEGIS EVOLUTION STAGE\n\nParent: {p['release']} ({p['candidate']}) generation {p.get('generationRun')}\n"
            f"Parent bytes: {p['normalizedBytes']}\nCandidate bytes: {meta['candidateNormalizedBytes']}\nGrowth: {meta['growthBytes']}\nHeadroom: {meta['headroomBytes']}\n"
            "Aegis is now a child of the active tournament winner, not a frozen historical A17Y branch.\n"
            "Control lineage remains experimental until bench/road evidence approves it.\n")
          files=[q for q in b.iterdir() if q.is_file()]
          (b/'SHA256SUMS.txt').write_text(''.join(f'{h(q)}  {q.name}\n' for q in sorted(files)))
          latest={'schema':'JARVIS-AEGIS-LATEST-1','mission':mid,'base':f'public/builds/{mid}/','parentRelease':p['release'],'parentCandidate':p['candidate'],'generationRun':p.get('generationRun'),'normalizedBytes':meta['candidateNormalizedBytes'],'growthBytes':meta['growthBytes'],'headroomBytes':meta['headroomBytes'],'authority':status['authority'],'updatedAt':status['createdAt']}
          Path('public/builds/aegis-latest.json').write_text(json.dumps(latest,indent=2)+'\n')
          PY
          (cd "$B" && zip -9 -r mission-build.zip . -x mission-build.zip)

      - uses: actions/upload-artifact@v6
        with:
          name: jarvis-aegis-evolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            aegis-next.lua
            aegis-next.luac
            aegis-next.json
            public/builds/aegis-evolution-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 180

      - name: Commit gated Aegis child
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          ID="aegis-evolution-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git add "public/builds/$ID" public/builds/aegis-latest.json
          git commit -m "Publish Aegis evolution child from current tournament winner [skip ci]"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((n*4))
          done
          exit 1
