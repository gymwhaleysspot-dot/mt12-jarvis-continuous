name: Home Engineering OS CI
on:
  pull_request:
    paths:
      - index.html
      - assets/jarvis-os.*
      - classic-token.js
      - .github/workflows/home-os-ci.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/jarvis-os.*
      - classic-token.js
      - .github/workflows/home-os-ci.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate Jarvis application shell
        run: |
          set -euo pipefail
          node --check assets/jarvis-os.js
          node --check classic-token.js
          test -s assets/jarvis-os.css
          grep -q 'Content-Security-Policy' index.html
          grep -q 'Jarvis Engineering Intelligence' index.html
          grep -q 'START ENGINEERING MISSION' index.html
          grep -q 'START JARVIS RESEARCH' index.html
          grep -q 'RUN COMPLETE FACTORY' index.html
          grep -q 'Exact runtime imprint' index.html
          grep -q 'Authority ladder' index.html
          ! grep -q 'GitHub Models model' index.html
          ! grep -q 'site-nav.js' index.html
