name: A17Y LUAC AI Builder
run-name: LUAC AI ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      child:
        description: Existing repository Lua path; blank lets the Director generate from A17Y
        required: false
        default: ''
      mission:
        description: Evidence-bounded engineering mission
        required: true
        default: Build the strongest verified MT12 LUAC without regressions
      generate:
        description: Run AI diagnosis, candidate generation, repair and audit
        required: true
        type: boolean
        default: true
      logs:
        description: Space-separated selected replay paths; blank discovers all repository replay CSVs
        required: false
        default: ''
      model:
        description: Primary GitHub Models model ID
        required: false
        default: openai/gpt-4.1
      request_id:
        description: Unique UI request identifier for exact run correlation
        required: false
        default: manual

permissions:
  contents: read
  actions: read
  models: read

concurrency:
  group: a17y-luac-ai-${{ inputs.request_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      A17Y_REQUEST_ID: ${{ inputs.request_id || github.sha }}
      DIRECTOR_MODEL: ${{ inputs.model || 'openai/gpt-4.1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install deterministic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh
      - name: Verify pipeline source
        run: |
          set -euo pipefail
          test -f a17y.lua
          node --check director/run.mjs
          node --check workbench/run.mjs
          node --check workbench/rcos.mjs
          node --check scripts/reconcile-director-authority.mjs
          node --check toolchain/normalize_luac53_mt12.js
          lua5.3 -e "assert(loadfile('scripts/mt12-harness.lua'))"
          lua5.3 -e "assert(loadfile('scripts/mt12-csv-replay.lua'))"
          lua5.3 -e "assert(loadfile('scripts/mt12-bytecode-stress.lua'))"
          bash -n toolchain/compile_mt12.sh
      - name: Resolve selected replay evidence
        env:
          REQUESTED_LOGS: ${{ inputs.logs || '' }}
        run: |
          set -euo pipefail
          : > /tmp/logs.txt
          if [ -n "$REQUESTED_LOGS" ]; then
            for p in $REQUESTED_LOGS; do
              test -f "$p" || { echo "Selected replay does not exist: $p" >&2; exit 1; }
              case "$p" in tests/replays/*.csv) printf '%s\n' "$p" >> /tmp/logs.txt;; *) echo "Rejected replay path: $p" >&2; exit 1;; esac
            done
          else
            find tests/replays -type f -name '*.csv' -print 2>/dev/null | sort > /tmp/logs.txt || true
          fi
      - name: AI diagnosis, generation and repair
        if: ${{ inputs.generate == true && inputs.child == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIRECTOR_MISSION: ${{ inputs.mission }}
        run: |
          set -euo pipefail
          export DIRECTOR_LOGS="$(tr '\n' ' ' </tmp/logs.txt)"
          node director/run.mjs
      - name: Select immutable candidate
        id: candidate
        env:
          REQUESTED_CHILD: ${{ inputs.child || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_CHILD" ]; then C="$REQUESTED_CHILD";
          elif [ -f dist-director/WINNER.lua ]; then C=dist-director/WINNER.lua;
          else C=a17y.lua; fi
          test -f "$C"
          case "$C" in a17y.lua|candidates/*|dist-director/*) ;; *) echo "Candidate path outside approved roots: $C" >&2; exit 1;; esac
          echo "path=$C" >> "$GITHUB_OUTPUT"
      - name: Compile, normalize, execute bytecode, replay and score
        env:
          CHILD: ${{ steps.candidate.outputs.path }}
          MISSION: ${{ inputs.mission }}
          WORKBENCH_LOG_FILE: /tmp/logs.txt
        run: node workbench/run.mjs a17y.lua "$CHILD" "$MISSION"
      - name: Reconcile AI claims with deterministic authority
        run: node scripts/reconcile-director-authority.mjs dist-director
      - name: Package complete evidence
        run: |
          set -euo pipefail
          mkdir -p dist-package
          cp -a dist-workbench/. dist-package/
          if [ -d dist-director ]; then mkdir -p dist-package/director; cp -a dist-director/. dist-package/director/; fi
          cp /tmp/logs.txt dist-package/REPLAY-INPUTS.txt
          printf '%s\n' "$A17Y_REQUEST_ID" > dist-package/REQUEST-ID.txt
          printf '%s\n' "$DIRECTOR_MODEL" > dist-package/MODEL.txt
          cd dist-package
          zip -9 -r ../a17y-luac-ai-result.zip .
      - uses: actions/upload-artifact@v6
        with:
          name: a17y-luac-ai-${{ inputs.request_id || github.run_id }}
          path: a17y-luac-ai-result.zip
          if-no-files-found: error
          retention-days: 90
