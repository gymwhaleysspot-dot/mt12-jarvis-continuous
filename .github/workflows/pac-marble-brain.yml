name: Pac-Marble Brain Evolution
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/pac_marble_brain.py"
      - ".github/workflows/pac-marble-brain.yml"
      - "marble-pacman.html"
  schedule:
    - cron: "17,47 * * * *"
concurrency:
  group: pac-marble-evolution
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/pac_marble_brain.py
      - name: Rebase latest main before saving brain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Save brain
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Evolve Pac-Marble persistent AI brain"
          file_pattern: brain.json
