name: Pac-Marble Brain Evolution
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/pac_marble_brain.py"
      - "tools/pac_marble_maze.py"
      - ".github/workflows/pac-marble-brain.yml"
      - ".github/workflows/pac-marble-maze.yml"
      - "marble-pacman.html"
  schedule:
    - cron: "17,47 * * * *"
concurrency:
  group: pac-marble-evolution
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase latest main before training
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Evolve maze brain first
        run: python3 tools/pac_marble_maze.py
      - name: Evolve player brain
        run: python3 tools/pac_marble_brain.py
      - name: Validate both persistent brains
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          brain=json.loads(Path("brain.json").read_text())
          assert brain.get("version")==3
          assert isinstance(brain.get("q"),dict)
          assert isinstance(brain.get("states"),int)
          maze=json.loads(Path("maze-brain.json").read_text())
          assert maze.get("version")==3
          levels=maze.get("levels",[])
          assert len(levels)==12
          assert all(len(z)==28 and all(len(r)==28 for r in z) for z in levels)
          assert all(all(c in "#." for r in z for c in r) for z in levels)
          # Every published level must be completable from the canonical start.
          from collections import deque
          for i,z in enumerate(levels,1):
              assert z[26][14]=="." and z[25][14]=="." and z[24][14]==".", f"level {i}: blocked player start"
              assert z[12][13]=="." and z[12][14]=="." and z[12][15]==".", f"level {i}: blocked ghost start"
              open_cells={(x,y) for y,row in enumerate(z) for x,ch in enumerate(row) if ch=="."}
              seen={(14,26)}
              q=deque([(14,26)])
              while q:
                  x,y=q.popleft()
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      p=(x+dx,y+dy)
                      if p in open_cells and p not in seen:
                          seen.add(p); q.append(p)
              assert seen==open_cells, f"level {i}: unreachable cells"
          print("player brain:", brain["states"], "states,", brain["episodes"], "episodes")
          print("maze brain:", len(levels), "validated levels, generation", maze.get("generation"))
          PY
      - name: Publish both brains with retry
        if: github.ref == 'refs/heads/main'
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # The training artifacts are working-tree changes. Rebase/reset cannot
            # operate with those changes present, so preserve them outside Git,
            # synchronize to the newest main, then restore and publish them.
            tmp_dir="$(mktemp -d)"
            cp brain.json "$tmp_dir/brain.json"
            cp maze-brain.json "$tmp_dir/maze-brain.json"
            git fetch origin main
            git reset --hard origin/main
            cp "$tmp_dir/brain.json" brain.json
            cp "$tmp_dir/maze-brain.json" maze-brain.json
            rm -rf "$tmp_dir"

            git add brain.json maze-brain.json
            if git diff --cached --quiet; then
              echo "brains already published"
              exit 0
            fi
            git commit -m "Evolve Pac-Marble player and maze brains"
            if git push origin HEAD:main; then
              echo "published both brains on attempt $attempt"
              exit 0
            fi

            # Another writer won the race. Keep the generated artifacts, discard
            # the failed local commit, and retry from the new main.
            git reset --soft HEAD~1
            git reset -- brain.json maze-brain.json
            echo "publish raced another main update; retrying"
            sleep 3
          done
          echo "failed to publish brain artifacts after retries"
          exit 1
