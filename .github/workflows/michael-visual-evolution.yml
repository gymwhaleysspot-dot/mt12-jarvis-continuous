name: Nickelle Continuous Visual Evolution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/michael-visual-evolution.yml'
      - 'tools/michael_visual_evolution.py'
      - 'tools/michael_visual_capture.mjs'
      - 'tools/michael_visual_judge.mjs'
      - 'tools/michael_internal_vision.mjs'
      - 'tools/nickelle_visual_ai.mjs'
      - 'tools/nickelle_neural_vision.mjs'
      - 'michael/visual/owner-truth.json'
      - 'michael/visual/reference-metrics.json'
      - 'nickelle/identity.json'
      - 'nickelle/neural-model.json'
  schedule:
    - cron: '42 * * * *'
    - cron: '17 */6 * * *'

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: nickelle-continuous-visual-evolution
  cancel-in-progress: false

jobs:
  refresh-visual-research:
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Nickelle visual research
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          gh workflow run research.yml --repo "$REPO" --ref main -f mission_type=digital-twin -f topic='Nickelle visual research: exact MJX Hyper Go 7303 Citroen C3 WRC body and 2017 Citroen C3 WRC construction. Preserve evidence and measurable proportions for deterministic and neural visual learning.'

  evolve:
    if: github.event_name != 'schedule' || github.event.schedule != '17 */6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MICHAEL_VISUAL_MODEL: openai/gpt-4.1
      MICHAEL_URL: http://127.0.0.1:4173/racing-mjx7303-michael-v39.html
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate Nickelle visual stack
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/michael_visual_evolution.py
          node --check tools/michael_visual_capture.mjs
          node --check tools/michael_visual_judge.mjs
          node --check tools/michael_internal_vision.mjs
          node --check tools/nickelle_visual_ai.mjs
          node --check tools/nickelle_neural_vision.mjs
          node --check jarvis/mjx7303-racing-michael-v39.js
          python3 - <<'PY'
          import json
          for p in ['michael/visual/owner-truth.json','michael/visual/reference-metrics.json','michael/visual/genome.json','michael/visual/state.json','nickelle/identity.json','nickelle/memory.json','nickelle/neural-model.json']: json.load(open(p))
          print('Nickelle deterministic + neural visual stack valid')
          PY
      - name: Install headless visual runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local Michael renderer
        run: |
          python3 -m http.server 4173 >/tmp/michael-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS "$MICHAEL_URL" >/dev/null && exit 0; sleep 1; done
          cat /tmp/michael-http.log; exit 1
      - name: Capture champion canonical views
        run: node tools/michael_visual_capture.mjs /tmp/michael-baseline
      - name: Nickelle diagnoses champion and proposes candidate
        run: node tools/nickelle_visual_ai.mjs propose /tmp/michael-baseline /tmp/michael-proposal.json
      - name: Optional external vision advisory for Nickelle
        continue-on-error: true
        run: node tools/michael_visual_judge.mjs propose /tmp/michael-baseline /tmp/michael-external-advisory.json
      - name: Apply Nickelle bounded visual candidate
        run: |
          cp michael/visual/genome.json /tmp/michael-genome-before.json
          cp michael/visual/state.json /tmp/michael-state-before.json
          python3 tools/michael_visual_evolution.py apply /tmp/michael-proposal.json
          node --check jarvis/mjx7303-racing-michael-v39.js
          grep -F "lat=clamp((p?.x||0)*1.55" jarvis/mjx7303-racing-michael-v39.js
          grep -F 'function chaseRoad' jarvis/mjx7303-racing-michael-v39.js
          changed="$(git diff --name-only | sort)"; echo "$changed"
          bad="$(echo "$changed" | grep -Ev '^(jarvis/mjx7303-racing-michael-v39.js|michael/visual/genome.json)$' || true)"
          test -z "$bad" || { echo "Forbidden candidate files changed: $bad" >&2; exit 1; }
      - name: Capture candidate canonical views
        run: node tools/michael_visual_capture.mjs /tmp/michael-candidate
      - name: Nickelle fuses internal and neural vision
        run: node tools/nickelle_visual_ai.mjs compare /tmp/michael-baseline /tmp/michael-candidate /tmp/michael-proposal.json /tmp/michael-verdict.json
      - name: Run protected promotion gates
        id: gate
        run: |
          python3 tools/michael_visual_evolution.py finalize /tmp/michael-proposal.json /tmp/michael-verdict.json /tmp/michael-baseline/metrics.json /tmp/michael-candidate/metrics.json /tmp/michael-decision.json
          promote="$(jq -r '.promote' /tmp/michael-decision.json)"; echo "promote=$promote" >> "$GITHUB_OUTPUT"; cat /tmp/michael-decision.json
      - name: Nickelle learns memory and neural weights
        run: |
          node tools/nickelle_visual_ai.mjs learn /tmp/michael-proposal.json /tmp/michael-verdict.json /tmp/michael-decision.json nickelle/memory.json
          node tools/nickelle_neural_vision.mjs train /tmp/michael-baseline /tmp/michael-candidate /tmp/michael-verdict.json /tmp/michael-decision.json nickelle/neural-model.json
          node -e "const m=require('./nickelle/neural-model.json'); console.log(m.training)"
      - name: Prepare Nickelle-approved Michael build
        if: steps.gate.outputs.promote == 'true'
        run: |
          python3 tools/michael_visual_evolution.py bump-version
          node --check jarvis/mjx7303-racing-michael-v39.js
          grep -F "lat=clamp((p?.x||0)*1.55" jarvis/mjx7303-racing-michael-v39.js
          grep -F 'function chaseRoad' jarvis/mjx7303-racing-michael-v39.js
      - name: Nickelle promotes only if main is still evaluated parent
        if: steps.gate.outputs.promote == 'true'
        env: {START_SHA: '${{ github.sha }}'}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$START_SHA" || { echo 'main advanced; Nickelle promotion deferred'; exit 0; }
          git config user.name 'Nickelle Visual AI'; git config user.email 'actions@users.noreply.github.com'
          git add jarvis/mjx7303-racing-michael-v39.js racing-mjx7303-michael-v39.html michael/visual/genome.json michael/visual/state.json nickelle/memory.json nickelle/neural-model.json
          git commit -m "Nickelle neural-visual evolution generation $(jq -r '.generation' michael/visual/genome.json) [skip ci]"
          git push origin HEAD:main
      - name: Reject non-improving candidate cleanly
        if: steps.gate.outputs.promote != 'true'
        run: |
          echo 'Nickelle rejected candidate; Michael champion retained.'
          git restore jarvis/mjx7303-racing-michael-v39.js michael/visual/genome.json michael/visual/state.json
      - name: Persist Nickelle learning from rejected candidate
        if: steps.gate.outputs.promote != 'true'
        env: {START_SHA: '${{ github.sha }}'}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$START_SHA" ]; then echo 'main advanced; learning preserved in artifact only'; exit 0; fi
          git config user.name 'Nickelle Visual AI'; git config user.email 'actions@users.noreply.github.com'
          git add nickelle/memory.json nickelle/neural-model.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Nickelle learns visual and neural weights from rejected candidate [skip ci]'
          git push origin HEAD:main
      - name: Preserve Nickelle visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nickelle-visual-evolution-${{ github.run_number }}
          path: |
            /tmp/michael-baseline
            /tmp/michael-candidate
            /tmp/michael-proposal.json
            /tmp/michael-verdict.json
            /tmp/michael-decision.json
            /tmp/michael-external-advisory.json
            /tmp/nickelle-neural-predict.json
            /tmp/nickelle-neural-verdict.json
            /tmp/michael-http.log
            nickelle/memory.json
            nickelle/neural-model.json
          if-no-files-found: warn
          retention-days: 30
