name: Nickelle Continuous Visual Evolution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/michael-visual-evolution.yml'
      - 'tools/michael_visual_evolution.py'
      - 'tools/michael_visual_capture.mjs'
      - 'tools/michael_turntable_capture.mjs'
      - 'tools/nickelle_visual_convergence.mjs'
      - 'tools/michael_visual_judge.mjs'
      - 'tools/michael_internal_vision.mjs'
      - 'tools/nickelle_visual_ai.mjs'
      - 'tools/nickelle_neural_vision.mjs'
      - 'tools/nickelle_graphics_lab.mjs'
      - 'tools/nickelle_temporal_vision.mjs'
      - 'jarvis/michael-graphics-v40.js'
      - 'michael/visual/**'
      - 'nickelle/**'
  schedule:
    - cron: '42 * * * *'
    - cron: '17 */6 * * *'

permissions:
  contents: write
  models: read
  actions: write

concurrency:
  group: nickelle-continuous-visual-evolution
  cancel-in-progress: false

jobs:
  refresh-visual-research:
    if: github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Dispatch Nickelle visual research
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          topic="$(jq -r '.queue | map(select(.status=="open")) | sort_by(-.priority) | .[0].request // "Research the exact MJX Hyper Go 7303 Citroen C3 WRC body and 2017 Citroen C3 WRC visual construction. Preserve measurable proportions for Nickelle."' nickelle/research-queue.json 2>/dev/null || true)"
          gh workflow run research.yml --repo "$REPO" --ref main -f mission_type=digital-twin -f topic="Nickelle active visual research: $topic"

  evolve:
    if: github.event_name != 'schedule' || github.event.schedule != '17 */6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MICHAEL_VISUAL_MODEL: openai/gpt-4.1
      MICHAEL_URL: http://127.0.0.1:4173/racing-mjx7303-michael-v39.html
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate all twenty Nickelle graphics systems plus V47 convergence
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/michael_visual_evolution.py
          for f in tools/michael_visual_capture.mjs tools/michael_turntable_capture.mjs tools/nickelle_visual_convergence.mjs tools/michael_visual_judge.mjs tools/michael_internal_vision.mjs tools/nickelle_visual_ai.mjs tools/nickelle_neural_vision.mjs tools/nickelle_graphics_lab.mjs tools/nickelle_temporal_vision.mjs jarvis/michael-graphics-v40.js jarvis/mjx7303-racing-michael-v39.js; do node --check "$f"; done
          python3 - <<'PY'
          import json
          files=['michael/visual/owner-truth.json','michael/visual/reference-metrics.json','michael/visual/genome.json','michael/visual/state.json','michael/visual/scene-graph.json','michael/visual/convergence-policy.json','michael/visual/convergence-state.json','nickelle/visual-negatives.json','nickelle/identity.json','nickelle/memory.json','nickelle/neural-model.json','nickelle/embedding-prototype.json','nickelle/capabilities.json','nickelle/lab.json','nickelle/visual-regression.json','nickelle/research-queue.json','nickelle/critic-weights.json']
          for p in files: json.load(open(p))
          caps=json.load(open('nickelle/capabilities.json'))['capabilities']
          assert len(caps)==20 and all(x.get('enabled') for x in caps.values())
          print('Nickelle twenty-part graphics stack + V47 convergence valid')
          PY
      - name: Enable native Nickelle Graphics V40 authority
        id: native
        env: {START_SHA: '${{ github.sha }}'}
        run: |
          set -Eeuo pipefail
          cp jarvis/mjx7303-racing-michael-v39.js /tmp/pre-native-runtime.js
          python3 tools/michael_visual_evolution.py enable-v40
          if cmp -s jarvis/mjx7303-racing-michael-v39.js /tmp/pre-native-runtime.js; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          node --check jarvis/mjx7303-racing-michael-v39.js
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$START_SHA" ]; then
            git config user.name 'Nickelle Visual AI'; git config user.email 'actions@users.noreply.github.com'
            git add jarvis/mjx7303-racing-michael-v39.js racing-mjx7303-michael-v39.html
            git commit -m 'Enable Nickelle native Graphics V40 authority [skip ci]'
            git push origin HEAD:main
          else
            echo 'main advanced; V40 bootstrap will retry next cycle'
          fi
      - name: Install headless visual runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start local Michael renderer
        run: |
          python3 -m http.server 4173 >/tmp/michael-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS "$MICHAEL_URL" >/dev/null && exit 0; sleep 1; done
          cat /tmp/michael-http.log; exit 1
      - name: Capture and analyze champion
        run: |
          MICHAEL_CAPTURE_SIZE=900 node tools/michael_visual_capture.mjs /tmp/michael-baseline
          node tools/nickelle_graphics_lab.mjs analyze /tmp/michael-baseline /tmp/nickelle-baseline-analysis.json
          cp jarvis/mjx7303-racing-michael-v39.js /tmp/nickelle-champion-runtime.js
          cp michael/visual/genome.json /tmp/nickelle-champion-genome.json
          cp michael/visual/state.json /tmp/nickelle-champion-state.json
      - name: Nickelle proposes seed and builds counterfactual population
        run: |
          node tools/nickelle_visual_ai.mjs propose /tmp/michael-baseline /tmp/michael-seed-proposal.json
          rm -rf /tmp/nickelle-lab /tmp/nickelle-tournament
          node tools/nickelle_graphics_lab.mjs generate /tmp/michael-baseline /tmp/michael-seed-proposal.json /tmp/nickelle-lab
          mkdir -p /tmp/nickelle-tournament
      - name: Optional external vision advisory
        continue-on-error: true
        run: node tools/michael_visual_judge.mjs propose /tmp/michael-baseline /tmp/michael-external-advisory.json
      - name: Run Nickelle low-resolution visual tournament
        run: |
          set -Eeuo pipefail
          i=0
          for proposal in /tmp/nickelle-lab/candidate-*.json; do
            i=$((i+1)); tag="$(printf '%02d' "$i")"
            cp /tmp/nickelle-champion-runtime.js jarvis/mjx7303-racing-michael-v39.js
            cp /tmp/nickelle-champion-genome.json michael/visual/genome.json
            cp /tmp/nickelle-champion-state.json michael/visual/state.json
            python3 tools/michael_visual_evolution.py apply "$proposal"
            node --check jarvis/mjx7303-racing-michael-v39.js
            grep -F "lat=clamp((p?.x||0)*1.55" jarvis/mjx7303-racing-michael-v39.js
            grep -F 'function chaseRoad' jarvis/mjx7303-racing-michael-v39.js
            MICHAEL_CAPTURE_SIZE=480 node tools/michael_visual_capture.mjs "/tmp/nickelle-tournament/candidate-$tag"
            node tools/nickelle_visual_ai.mjs compare /tmp/michael-baseline "/tmp/nickelle-tournament/candidate-$tag" "$proposal" "/tmp/nickelle-tournament/candidate-$tag.verdict.json"
            node tools/nickelle_graphics_lab.mjs record "$proposal" "/tmp/nickelle-tournament/candidate-$tag.verdict.json" "/tmp/nickelle-tournament/candidate-$tag/metrics.json" "/tmp/nickelle-tournament/candidate-$tag.record.json"
          done
          cp /tmp/nickelle-champion-runtime.js jarvis/mjx7303-racing-michael-v39.js
          cp /tmp/nickelle-champion-genome.json michael/visual/genome.json
          cp /tmp/nickelle-champion-state.json michael/visual/state.json
      - name: Select elite challenger
        run: node tools/nickelle_graphics_lab.mjs select /tmp/nickelle-tournament /tmp/michael-proposal.json /tmp/nickelle-tournament-report.json
      - name: Apply elite challenger with protected invariants
        run: |
          python3 tools/michael_visual_evolution.py apply /tmp/michael-proposal.json
          node --check jarvis/mjx7303-racing-michael-v39.js
          grep -F "lat=clamp((p?.x||0)*1.55" jarvis/mjx7303-racing-michael-v39.js
          grep -F 'function chaseRoad' jarvis/mjx7303-racing-michael-v39.js
          grep -F 'michael-graphics-v40.js' jarvis/mjx7303-racing-michael-v39.js
          changed="$(git diff --name-only | sort)"; echo "$changed"
          bad="$(echo "$changed" | grep -Ev '^(jarvis/mjx7303-racing-michael-v39.js|racing-mjx7303-michael-v39.html|michael/visual/genome.json)$' || true)"
          test -z "$bad" || { echo "Forbidden candidate files changed: $bad" >&2; exit 1; }
      - name: Full-resolution challenger vision
        run: |
          MICHAEL_CAPTURE_SIZE=900 node tools/michael_visual_capture.mjs /tmp/michael-candidate
          node tools/nickelle_visual_ai.mjs compare /tmp/michael-baseline /tmp/michael-candidate /tmp/michael-proposal.json /tmp/michael-verdict.json
          node tools/nickelle_graphics_lab.mjs analyze /tmp/michael-candidate /tmp/nickelle-candidate-analysis.json
          node tools/nickelle_neural_vision.mjs embed /tmp/michael-candidate /tmp/nickelle-candidate-embedding.json
      - name: V47 24-angle turntable and cross-resolution identity proof
        run: |
          rm -rf /tmp/michael-turntable
          MICHAEL_TURNTABLE_SIZE=420 MICHAEL_TURNTABLE_FRAMES=24 node tools/michael_turntable_capture.mjs /tmp/michael-turntable
      - name: Temporal vision and mobile graphics intelligence
        run: node tools/nickelle_temporal_vision.mjs /tmp/nickelle-temporal.json
      - name: Run protected promotion gates
        id: gate
        env:
          NICKELLE_TEMPORAL_JSON: /tmp/nickelle-temporal.json
          NICKELLE_ANALYSIS_JSON: /tmp/nickelle-candidate-analysis.json
        run: |
          python3 tools/michael_visual_evolution.py finalize /tmp/michael-proposal.json /tmp/michael-verdict.json /tmp/michael-baseline/metrics.json /tmp/michael-candidate/metrics.json /tmp/michael-decision.json
          node tools/nickelle_visual_convergence.mjs gate /tmp/michael-baseline /tmp/michael-candidate /tmp/michael-verdict.json /tmp/michael-decision.json /tmp/michael-turntable /tmp/michael-convergence.json
          promote="$(jq -r '.promote' /tmp/michael-decision.json)"; echo "promote=$promote" >> "$GITHUB_OUTPUT"; cat /tmp/michael-decision.json
      - name: Nickelle learns memory neural embeddings critic regressions and convergence
        run: |
          node tools/nickelle_visual_ai.mjs learn /tmp/michael-proposal.json /tmp/michael-verdict.json /tmp/michael-decision.json nickelle/memory.json
          node tools/nickelle_neural_vision.mjs train /tmp/michael-baseline /tmp/michael-candidate /tmp/michael-verdict.json /tmp/michael-decision.json nickelle/neural-model.json
          node tools/nickelle_graphics_lab.mjs learn /tmp/michael-proposal.json /tmp/michael-verdict.json /tmp/michael-decision.json /tmp/nickelle-candidate-analysis.json /tmp/nickelle-temporal.json /tmp/michael-candidate/metrics.json
          node tools/nickelle_visual_convergence.mjs learn /tmp/michael-proposal.json /tmp/michael-verdict.json /tmp/michael-decision.json /tmp/michael-convergence.json
      - name: Active uncertainty-driven research request
        continue-on-error: true
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          priority="$(jq -r '.queue | map(select(.status=="open")) | sort_by(-.priority) | .[0].priority // 0' nickelle/research-queue.json)"
          request="$(jq -r '.queue | map(select(.status=="open")) | sort_by(-.priority) | .[0].request // empty' nickelle/research-queue.json)"
          awk "BEGIN{exit !($priority >= 0.55)}" || exit 0
          test -n "$request" || exit 0
          gh workflow run research.yml --repo "$REPO" --ref main -f mission_type=digital-twin -f topic="Nickelle uncertainty-driven visual research: $request"
      - name: Prepare Nickelle-approved Michael build
        if: steps.gate.outputs.promote == 'true'
        run: |
          python3 tools/michael_visual_evolution.py bump-version
          node --check jarvis/mjx7303-racing-michael-v39.js
          grep -F "lat=clamp((p?.x||0)*1.55" jarvis/mjx7303-racing-michael-v39.js
          grep -F 'function chaseRoad' jarvis/mjx7303-racing-michael-v39.js
      - name: Nickelle promotes only if main is still evaluated parent
        if: steps.gate.outputs.promote == 'true'
        env: {START_SHA: '${{ github.sha }}'}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$START_SHA" || { echo 'main advanced; Nickelle promotion safely deferred'; exit 0; }
          git config user.name 'Nickelle Visual AI'; git config user.email 'actions@users.noreply.github.com'
          git add jarvis/mjx7303-racing-michael-v39.js racing-mjx7303-michael-v39.html michael/visual/genome.json michael/visual/state.json michael/visual/convergence-state.json nickelle/visual-negatives.json nickelle/memory.json nickelle/neural-model.json nickelle/embedding-prototype.json nickelle/visual-regression.json nickelle/critic-weights.json nickelle/research-queue.json
          git commit -m "Nickelle laboratory evolves Michael generation $(jq -r '.generation' michael/visual/genome.json) [skip ci]"
          git push origin HEAD:main
      - name: Reject non-improving challenger cleanly
        if: steps.gate.outputs.promote != 'true'
        run: |
          echo 'Nickelle laboratory rejected challenger; Michael champion retained.'
          cp /tmp/nickelle-champion-runtime.js jarvis/mjx7303-racing-michael-v39.js
          cp /tmp/nickelle-champion-genome.json michael/visual/genome.json
          cp /tmp/nickelle-champion-state.json michael/visual/state.json
      - name: Persist learning from rejected laboratory generation
        if: steps.gate.outputs.promote != 'true'
        env: {START_SHA: '${{ github.sha }}'}
        run: |
          set -Eeuo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$START_SHA" ]; then echo 'main advanced; learning preserved in artifact only'; exit 0; fi
          git config user.name 'Nickelle Visual AI'; git config user.email 'actions@users.noreply.github.com'
          git add michael/visual/convergence-state.json nickelle/visual-negatives.json nickelle/memory.json nickelle/neural-model.json nickelle/embedding-prototype.json nickelle/visual-regression.json nickelle/critic-weights.json nickelle/research-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Nickelle learns from visual laboratory generation [skip ci]'
          git push origin HEAD:main
      - name: Preserve complete Nickelle laboratory evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nickelle-visual-laboratory-${{ github.run_number }}
          path: |
            /tmp/michael-baseline
            /tmp/michael-candidate
            /tmp/michael-turntable
            /tmp/michael-seed-proposal.json
            /tmp/michael-proposal.json
            /tmp/michael-verdict.json
            /tmp/michael-decision.json
            /tmp/michael-convergence.json
            /tmp/michael-external-advisory.json
            /tmp/nickelle-baseline-analysis.json
            /tmp/nickelle-candidate-analysis.json
            /tmp/nickelle-candidate-embedding.json
            /tmp/nickelle-temporal.json
            /tmp/nickelle-lab
            /tmp/nickelle-tournament
            /tmp/nickelle-tournament-report.json
            /tmp/michael-http.log
            michael/visual/convergence-state.json
            nickelle/visual-negatives.json
            nickelle/memory.json
            nickelle/neural-model.json
            nickelle/embedding-prototype.json
            nickelle/visual-regression.json
            nickelle/critic-weights.json
            nickelle/research-queue.json
          if-no-files-found: warn
          retention-days: 30