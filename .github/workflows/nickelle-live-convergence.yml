name: Nickelle Direct Owner-Photo Convergence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nickelle-live-convergence.yml'
      - 'tools/nickelle_owner_truth.py'
      - 'tools/nickelle_closed_loop.py'
      - 'tools/michael_visual_capture.mjs'
      - 'scripts/build-michael-polyglot.sh'
      - 'engine/typescript/michael-polyglot.ts'
      - 'jarvis/michael-graphics-v40.js'
      - 'jarvis/michael-graphics-v40-base.js'
      - 'michael/visual/genome.json'
      - 'michael/visual/owner-truth.json'
      - 'michael/visual/owner-reference-observations.json'
      - 'IMG_4328.jpeg'
      - 'IMG_4329.jpeg'
      - 'IMG_4330.jpeg'
      - 'IMG_4331.jpeg'
      - 'IMG_4332.jpeg'
      - 'IMG_4333.jpeg'
      - 'IMG_4334.jpeg'
      - 'IMG_4335.jpeg'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: nickelle-owner-photo-v3
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MICHAEL_URL: http://127.0.0.1:4173/racing-mjx7303-michael-v39.html
      MAX_ROUNDS: 6
      STEP_FRACTION: 0.14
      CAPTURE_TIMEOUT_SECONDS: 60
      JUDGE_TIMEOUT_SECONDS: 20
      MAX_CAPTURE_FAILURES: 6
      MICHAEL_NAV_TIMEOUT_MS: 15000
      MICHAEL_READY_TIMEOUT_MS: 18000
      MICHAEL_SCREENSHOT_TIMEOUT_MS: 12000
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate source authority
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tools/nickelle_owner_truth.py tools/nickelle_closed_loop.py tools/michael_visual_evolution.py
          node --check tools/michael_visual_capture.mjs
          node --check jarvis/michael-graphics-v40.js
          node --check jarvis/michael-graphics-v40-base.js
          node --check jarvis/mjx7303-racing-michael-v39.js
          ! grep -F 'addBodyAuthority();' jarvis/mjx7303-racing-michael-v39.js
          test "$(jq -r '.authorityOrder[0]' michael/visual/owner-truth.json)" = owner_photos
          test "$(jq -r '.engine' engine/polyglot.json)" = MICHAEL_V57
          test "$(jq -r '.languages | length' engine/polyglot.json)" = 12
          for n in 4328 4329 4330 4331 4332 4333 4334 4335; do test -s "IMG_${n}.jpeg"; done
      - name: Rebuild complete Michael polyglot runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y emscripten lua5.4
          bash scripts/build-michael-polyglot.sh
          for f in michael-core.js michael-core.wasm michael-rust.wasm michael-assembly.wasm michael-zig.wasm michael-polyglot.js polyglot-manifest.json; do
            test -s "jarvis/generated/$f" || { echo "missing generated runtime $f"; exit 1; }
          done
      - name: Persist rebuilt polyglot runtime
        run: |
          set -Eeuo pipefail
          git config user.name 'Michael Polyglot Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add jarvis/generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild complete Michael polyglot runtime [skip ci]'
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Install pixel and headless vision runtime
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0 numpy==2.3.2
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Start live Michael renderer
        run: |
          python3 -m http.server 4173 >/tmp/michael-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS "$MICHAEL_URL" >/dev/null && break; sleep 1; done
          curl -fsS "$MICHAEL_URL" >/dev/null || { cat /tmp/michael-http.log; exit 1; }
          for f in michael-core.js michael-core.wasm michael-rust.wasm michael-assembly.wasm michael-zig.wasm michael-polyglot.js; do
            curl -fsS "http://127.0.0.1:4173/jarvis/generated/$f" >/dev/null || { echo "HTTP missing jarvis/generated/$f"; exit 1; }
          done
      - name: FRONT capture smoke test
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/michael-smoke
          MICHAEL_CAPTURE_VIEWS=front MICHAEL_CAPTURE_SIZE=520 node tools/michael_visual_capture.mjs /tmp/michael-smoke
          test -s /tmp/michael-smoke/front.png
          python3 - <<'PY'
          from PIL import Image
          p='/tmp/michael-smoke/front.png'
          im=Image.open(p).convert('RGB')
          lo,hi=im.getextrema()[0][0],im.getextrema()[0][1]
          assert im.width>100 and im.height>100 and hi-lo>8,(im.size,lo,hi)
          print('FRONT SMOKE PASS',im.size,lo,hi)
          PY
      - name: Run fail-fast owner-JPEG closed loop
        id: loop
        run: |
          set -Eeuo pipefail
          python3 -u tools/nickelle_closed_loop.py | tee /tmp/nickelle-owner-loop.log
          cat /tmp/nickelle-owner-loop-result.json
          echo "accepted=$(jq -r '.accepted' /tmp/nickelle-owner-loop-result.json)" >> "$GITHUB_OUTPUT"
          echo "start=$(jq -r '.start' /tmp/nickelle-owner-loop-result.json)" >> "$GITHUB_OUTPUT"
          echo "final=$(jq -r '.final' /tmp/nickelle-owner-loop-result.json)" >> "$GITHUB_OUTPUT"
      - name: Force a genuinely new Safari module graph
        if: steps.loop.outputs.accepted != '0'
        run: python3 tools/michael_visual_evolution.py bump-version
      - name: Verify measured champion and invariants
        run: |
          set -Eeuo pipefail
          node --check jarvis/mjx7303-racing-michael-v39.js
          node --check jarvis/michael-graphics-v40.js
          ! grep -F 'addBodyAuthority();' jarvis/mjx7303-racing-michael-v39.js
          test "$(jq -r '.runtimeBodyOverlay' michael/visual/live-status.json)" = false
          test "$(jq -r '.authority' michael/visual/live-status.json)" = DIRECT_OWNER_JPEG_PIXELS
          python3 - <<'PY'
          import json
          s=json.load(open('michael/visual/live-status.json'))
          assert s['score'] >= s['startingScore'] - 1e-6, s
          assert s.get('testedCandidates',0) > 0, s
          print('OWNER JPEG SCORE',s['startingScore'],'->',s['score'],'tested',s['testedCandidates'],'captureFailures',s.get('captureFailures',0))
          PY
      - name: Persist only the measured champion
        env: {START_SHA: '${{ github.sha }}'}
        run: |
          set -Eeuo pipefail
          git config user.name 'Nickelle Owner Truth'
          git config user.email 'actions@users.noreply.github.com'
          visual=(michael/visual/genome.json michael/visual/live-status.json jarvis/mjx7303-racing-michael-v39.js racing-mjx7303-michael-v39.html)
          mkdir -p /tmp/nickelle-promote/michael/visual /tmp/nickelle-promote/jarvis
          cp michael/visual/genome.json /tmp/nickelle-promote/michael/visual/genome.json
          cp michael/visual/live-status.json /tmp/nickelle-promote/michael/visual/live-status.json
          cp jarvis/mjx7303-racing-michael-v39.js /tmp/nickelle-promote/jarvis/mjx7303-racing-michael-v39.js
          cp racing-mjx7303-michael-v39.html /tmp/nickelle-promote/racing-mjx7303-michael-v39.html
          git fetch origin main
          if ! git diff --quiet "$START_SHA"..origin/main -- "${visual[@]}"; then
            echo 'visual authority files changed on main during this run; measured champion preserved as artifact for reevaluation'
            exit 0
          fi
          git reset --hard origin/main
          cp /tmp/nickelle-promote/michael/visual/genome.json michael/visual/genome.json
          cp /tmp/nickelle-promote/michael/visual/live-status.json michael/visual/live-status.json
          cp /tmp/nickelle-promote/jarvis/mjx7303-racing-michael-v39.js jarvis/mjx7303-racing-michael-v39.js
          cp /tmp/nickelle-promote/racing-mjx7303-michael-v39.html racing-mjx7303-michael-v39.html
          git add "${visual[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Nickelle direct owner-photo convergence ${{ github.run_number }} [skip ci]"
          git push origin HEAD:main
      - name: Preserve renders scores and every candidate
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nickelle-owner-photo-loop-${{ github.run_number }}
          path: |
            /tmp/michael-smoke
            /tmp/nickelle-owner-loop
            /tmp/nickelle-owner-loop.log
            /tmp/nickelle-owner-loop-result.json
            michael/visual/live-status.json
          retention-days: 30
