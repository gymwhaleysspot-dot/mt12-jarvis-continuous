name: Nickelle Advanced Graphics Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '11,31,51 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/nickelle_advanced_graphics_intelligence.mjs'
      - 'tools/nickelle_autonomous_repair.mjs'
      - 'michael/visual/advanced-autonomy.json'
      - 'michael/visual/autonomy.json'
      - 'michael/reconstruction/topology-dsl.json'
      - 'michael/visual/owner-reference-observations.json'
      - 'michael/visual/scene-graph.json'
      - '.github/workflows/nickelle-advanced-graphics.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: nickelle-advanced-graphics-intelligence
  cancel-in-progress: false

jobs:
  advanced-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate advanced graphics intelligence
        run: |
          set -Eeuo pipefail
          node --check tools/nickelle_autonomous_repair.mjs
          node --check tools/nickelle_advanced_graphics_intelligence.mjs
          node -e "for(const p of ['michael/visual/advanced-autonomy.json','michael/visual/autonomy.json','michael/reconstruction/topology-dsl.json','michael/visual/scene-graph.json']) JSON.parse(require('fs').readFileSync(p))"
      - name: Install visual analysis runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0 jpeg-js@0.4.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Michael renderer
        run: |
          python3 -m http.server 4173 >/tmp/michael-advanced-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/racing-mjx7303-michael-v39.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/michael-advanced-http.log; exit 1
      - name: Capture canonical Michael views
        env:
          MICHAEL_URL: http://127.0.0.1:4173/racing-mjx7303-michael-v39.html
          MICHAEL_CAPTURE_SIZE: 720
        run: node tools/michael_visual_capture.mjs /tmp/michael-advanced-baseline
      - name: Rebuild current whole-car autonomous state
        run: node tools/nickelle_autonomous_repair.mjs run /tmp/michael-advanced-baseline michael/reconstruction/autonomous-state.json
      - name: Run all twenty advanced graphics upgrades
        run: node tools/nickelle_advanced_graphics_intelligence.mjs run /tmp/michael-advanced-baseline michael/reconstruction/advanced-state.json
      - name: Verify advanced stack 20 of 20
        run: |
          node - <<'NODE'
          const x=require('./michael/reconstruction/advanced-state.json');
          const keys=Object.keys(x.upgrades||{}), live=keys.filter(k=>x.upgrades[k]);
          if(keys.length!==20||live.length!==20) throw Error(`advanced upgrades ${live.length}/${keys.length}`);
          if(!x.benchmark?.name||!Number.isFinite(x.benchmark.score)) throw Error('graphics benchmark missing');
          if(!x.realityGap||!Number.isFinite(x.realityGap.gap)) throw Error('reality-gap score missing');
          if(!Array.isArray(x.uncertainty)||!x.uncertainty.length) throw Error('uncertainty model missing');
          if(!x.implicitSurface?.latent?.length) throw Error('implicit surface representation missing');
          console.log(`Nickelle advanced graphics: 20/20 live; benchmark=${x.benchmark.score}; realityGap=${x.realityGap.gap}; mode=${x.resourceGovernor.mode}`);
          NODE
      - name: Persist advanced intelligence with concurrent-agent rebase
        run: |
          set -Eeuo pipefail
          git config user.name 'Nickelle Advanced Graphics AI'
          git config user.email 'actions@users.noreply.github.com'
          cp michael/reconstruction/advanced-state.json /tmp/nickelle-advanced-state.json
          cp michael/reconstruction/autonomous-state.json /tmp/nickelle-autonomous-state.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p michael/reconstruction
            cp /tmp/nickelle-advanced-state.json michael/reconstruction/advanced-state.json
            cp /tmp/nickelle-autonomous-state.json michael/reconstruction/autonomous-state.json
            git add michael/reconstruction/advanced-state.json michael/reconstruction/autonomous-state.json
            if git diff --cached --quiet; then echo 'advanced state already persisted'; break; fi
            git commit -m 'Nickelle updates advanced graphics intelligence [skip ci]'
            if git push origin HEAD:main; then echo 'advanced state persisted'; break; fi
            echo "main advanced during persistence attempt $attempt; rebasing generated state"
            sleep $((attempt*2))
          done
          git fetch origin main
          git show origin/main:michael/reconstruction/advanced-state.json >/dev/null || { echo 'advanced-state.json did not persist' >&2; exit 1; }
      - name: Route heavy topology and mesh-surgery work
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          mode="$(jq -r '.resourceGovernor.mode' /tmp/nickelle-advanced-state.json)"
          surgery="$(jq '.meshSurgery | length' /tmp/nickelle-advanced-state.json)"
          if [ "$mode" = 'heavy_topology' ] || [ "$surgery" -gt 0 ]; then
            active="$(gh api "/repos/$REPO/actions/workflows/michael-full-reconstruction.yml/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending")]|length')"
            [ "$active" -gt 0 ] || gh workflow run michael-full-reconstruction.yml --repo "$REPO" --ref main
          fi
      - name: Route unresolved benchmark debt back to visual evolution
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          pass="$(jq -r '.benchmark.pass' /tmp/nickelle-advanced-state.json)"
          if [ "$pass" != 'true' ]; then
            active="$(gh api "/repos/$REPO/actions/workflows/michael-visual-evolution.yml/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending")]|length')"
            [ "$active" -gt 0 ] || gh workflow run michael-visual-evolution.yml --repo "$REPO" --ref main
          fi
      - name: Preserve advanced graphics evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nickelle-advanced-graphics-${{ github.run_number }}
          path: |
            /tmp/nickelle-autonomous-state.json
            /tmp/nickelle-advanced-state.json
            /tmp/michael-advanced-baseline
          if-no-files-found: warn
          retention-days: 60
