name: Nickelle Advanced Graphics Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '11,31,51 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/nickelle_advanced_graphics_intelligence.mjs'
      - 'tools/nickelle_autonomous_repair.mjs'
      - 'tools/nickelle_measured_optimizer.mjs'
      - 'tools/nickelle_quality_repair.mjs'
      - 'michael/visual/advanced-autonomy.json'
      - 'michael/visual/autonomy.json'
      - 'michael/reconstruction/topology-dsl.json'
      - 'michael/visual/owner-reference-observations.json'
      - 'michael/visual/scene-graph.json'
      - '.github/workflows/nickelle-advanced-graphics.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: nickelle-advanced-graphics-intelligence
  cancel-in-progress: false

jobs:
  advanced-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Restore isolated Nickelle memory if available
        run: |
          git fetch origin ai-state:refs/remotes/origin/ai-state || true
          mkdir -p michael/reconstruction
          git show origin/ai-state:michael/reconstruction/advanced-state.json >michael/reconstruction/advanced-state.json 2>/dev/null || true
          git show origin/ai-state:michael/reconstruction/autonomous-state.json >michael/reconstruction/autonomous-state.json 2>/dev/null || true
      - name: Validate advanced graphics intelligence
        run: |
          set -Eeuo pipefail
          node --check tools/nickelle_autonomous_repair.mjs
          node --check tools/nickelle_advanced_graphics_intelligence.mjs
          node --check tools/nickelle_measured_optimizer.mjs
          node --check tools/nickelle_quality_repair.mjs
          python3 -m py_compile tools/michael_visual_evolution.py
          node -e "for(const p of ['michael/visual/advanced-autonomy.json','michael/visual/autonomy.json','michael/reconstruction/topology-dsl.json','michael/visual/scene-graph.json','michael/visual/owner-reference-observations.json']) JSON.parse(require('fs').readFileSync(p))"
      - name: Install visual analysis runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0 jpeg-js@0.4.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Michael renderer
        run: |
          python3 -m http.server 4173 >/tmp/michael-advanced-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/racing-mjx7303-michael-v39.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/michael-advanced-http.log; exit 1
      - name: Capture canonical Michael views
        env: {MICHAEL_URL: 'http://127.0.0.1:4173/racing-mjx7303-michael-v39.html', MICHAEL_CAPTURE_SIZE: '720'}
        run: node tools/michael_visual_capture.mjs /tmp/michael-advanced-baseline
      - name: Rebuild current whole-car autonomous state
        run: node tools/nickelle_autonomous_repair.mjs run /tmp/michael-advanced-baseline michael/reconstruction/autonomous-state.json
      - name: Measure owner-truth single and pairwise parameter gradients
        env: {MICHAEL_URL: 'http://127.0.0.1:4173/racing-mjx7303-michael-v39.html', MICHAEL_CAPTURE_SIZE: '480'}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/nickelle-gradient; mkdir -p /tmp/nickelle-gradient
          cp -r /tmp/michael-advanced-baseline /tmp/nickelle-gradient/baseline
          cp jarvis/mjx7303-racing-michael-v39.js /tmp/gradient-runtime.js
          cp michael/visual/genome.json /tmp/gradient-genome.json
          cp michael/visual/state.json /tmp/gradient-state.json
          node tools/nickelle_measured_optimizer.mjs generate /tmp/nickelle-probes.json
          jq -c '.probes[]' /tmp/nickelle-probes.json | while read -r row; do
            id="$(jq -r '.id' <<<"$row")"
            cp /tmp/gradient-runtime.js jarvis/mjx7303-racing-michael-v39.js
            cp /tmp/gradient-genome.json michael/visual/genome.json
            cp /tmp/gradient-state.json michael/visual/state.json
            jq '.proposal' <<<"$row" > /tmp/probe.json
            python3 tools/michael_visual_evolution.py apply /tmp/probe.json >/tmp/probe-apply.log
            node tools/michael_visual_capture.mjs "/tmp/nickelle-gradient/$id"
          done
          cp /tmp/gradient-runtime.js jarvis/mjx7303-racing-michael-v39.js
          cp /tmp/gradient-genome.json michael/visual/genome.json
          cp /tmp/gradient-state.json michael/visual/state.json
          node tools/nickelle_measured_optimizer.mjs evaluate /tmp/nickelle-probes.json /tmp/nickelle-gradient /tmp/nickelle-measured-optimizer.json
      - name: Run all twenty advanced graphics upgrades
        run: node tools/nickelle_advanced_graphics_intelligence.mjs run /tmp/michael-advanced-baseline michael/reconstruction/advanced-state.json
      - name: Repair evidence routing critics topology and locks
        run: node tools/nickelle_quality_repair.mjs
      - name: Verify 20 plus repaired weaknesses and interactions
        run: |
          node - <<'NODE'
          const x=require('./michael/reconstruction/advanced-state.json'),a=require('./michael/reconstruction/autonomous-state.json');
          const keys=Object.keys(x.upgrades||{}),live=keys.filter(k=>x.upgrades[k]);
          if(keys.length!==20||live.length!==20) throw Error(`advanced upgrades ${live.length}/${keys.length}`);
          const q=x.qualityRepair||{}; if(!q.allEightWeaknessesAddressed||!q.actualRenderFiniteDifference||!q.pairwiseInteractionGradients) throw Error('measured interaction repair not live');
          if(x.optimizer?.method!=='actual_render_finite_difference_owner_truth_with_pairwise_interactions') throw Error('pairwise measured optimizer not authoritative');
          if(!Array.isArray(x.optimizer?.interactions)||!x.optimizer.interactions.length) throw Error('pairwise interactions missing');
          if(!x.critics?.semanticOwnerTruth?.requiredForPromotion) throw Error('semantic owner critic missing');
          const bad=(x.informationGain||[]).filter(z=>z.component==='sideSilhouette'&&z.region!=='side_body'); if(bad.length) throw Error('region routing regression');
          const mapped=(x.uncertainty||[]).filter(z=>z.ownerReferences>0).length; if(mapped<10) throw Error(`owner alias coverage too low: ${mapped}`);
          if(!Array.isArray(a.topologyQueue)) throw Error('topology queue missing');
          console.log(`Nickelle repaired stack live: 20/20; mapped=${mapped}; gradients=${x.optimizer.allGradients.length}; interactions=${x.optimizer.interactions.length}; semantic=${x.critics.semanticOwnerTruth.score}`);
          NODE
      - name: Persist repaired intelligence to isolated ai-state branch
        run: |
          set -Eeuo pipefail
          cp michael/reconstruction/advanced-state.json /tmp/nickelle-advanced-state.json
          cp michael/reconstruction/autonomous-state.json /tmp/nickelle-autonomous-state.json
          git config user.name 'Nickelle Advanced Graphics AI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin ai-state:refs/remotes/origin/ai-state
          state_tree="$(mktemp -d /tmp/nickelle-advanced-ai-state.XXXXXX)/tree"
          git worktree add --detach "$state_tree" origin/ai-state
          (
            cd "$state_tree"
            persisted=0
            for attempt in 1 2 3 4; do
              git fetch origin ai-state:refs/remotes/origin/ai-state
              git reset --hard origin/ai-state
              mkdir -p michael/reconstruction
              cp /tmp/nickelle-advanced-state.json michael/reconstruction/advanced-state.json
              cp /tmp/nickelle-autonomous-state.json michael/reconstruction/autonomous-state.json
              git add michael/reconstruction/advanced-state.json michael/reconstruction/autonomous-state.json
              if git diff --cached --quiet; then
                echo 'Nickelle repaired intelligence already persisted on ai-state'
                persisted=1
                break
              fi
              git commit -m 'Nickelle updates isolated advanced graphics intelligence [skip ci]'
              if git push origin HEAD:ai-state; then
                echo "Nickelle ai-state persistence succeeded on attempt $attempt"
                persisted=1
                break
              fi
              echo "ai-state advanced during persistence attempt $attempt; rebasing generated state"
              sleep $((attempt*2))
            done
            [ "$persisted" -eq 1 ] || { echo 'Nickelle ai-state persistence exhausted retries' >&2; exit 1; }
          )
          git fetch origin ai-state:refs/remotes/origin/ai-state
          git show origin/ai-state:michael/reconstruction/advanced-state.json >/tmp/verify-nickelle-advanced-state.json
          git show origin/ai-state:michael/reconstruction/autonomous-state.json >/tmp/verify-nickelle-autonomous-state.json
          grep -q 'actual_render_finite_difference_owner_truth_with_pairwise_interactions' /tmp/verify-nickelle-advanced-state.json
          grep -q 'topologyQueue' /tmp/verify-nickelle-autonomous-state.json
          echo 'Nickelle isolated advanced/autonomous state verified on remote ai-state'
      - name: Route repaired heavy topology work
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          q="$(jq '.topologyQueue|length' /tmp/nickelle-autonomous-state.json)"; mode="$(jq -r '.resourceGovernor.mode' /tmp/nickelle-advanced-state.json)"
          if [ "$q" -gt 0 ] || [ "$mode" = heavy_topology ]; then active="$(gh api "/repos/$REPO/actions/workflows/michael-full-reconstruction.yml/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending")]|length')"; [ "$active" -gt 0 ] || gh workflow run michael-full-reconstruction.yml --repo "$REPO" --ref main; fi
      - name: Route unresolved benchmark debt
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          pass="$(jq -r '.benchmark.pass' /tmp/nickelle-advanced-state.json)"
          [ "$pass" != true ] || exit 0
          wf='michael-visual-evolution.yml'
          encoded="$(gh api "/repos/$REPO/contents/.github/workflows/$wf?ref=main" --jq .content 2>/dev/null || true)"
          if [ -z "$encoded" ]; then echo "Visual evolution workflow missing on main; benchmark debt retained without dispatch"; exit 0; fi
          source="$(printf '%s' "$encoded" | base64 -d 2>/dev/null || true)"
          if ! grep -q 'workflow_dispatch' <<<"$source"; then echo "Visual evolution workflow is not dispatchable; benchmark debt retained without dispatch"; exit 0; fi
          active="$(gh api "/repos/$REPO/actions/workflows/$wf/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending")]|length')"
          [ "$active" -gt 0 ] || gh workflow run "$wf" --repo "$REPO" --ref main
      - name: Preserve measured advanced evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nickelle-advanced-graphics-${{ github.run_number }}
          path: |
            /tmp/nickelle-autonomous-state.json
            /tmp/nickelle-advanced-state.json
            /tmp/nickelle-measured-optimizer.json
            /tmp/nickelle-gradient
            /tmp/michael-advanced-baseline
          if-no-files-found: warn
          retention-days: 60
