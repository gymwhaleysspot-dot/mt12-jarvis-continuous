name: Michael V64 Complete Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/michael-v64-toolchain.yml'
      - 'scripts/build-michael-polyglot.sh'
      - 'engine/**'
      - 'jarvis/mjx7303-racing-michael-v39.js'
      - 'jarvis/michael-v64-payload-*.js'
      - 'jarvis/michael-graphics-v39.js'
      - 'jarvis/racing-tab.js'
      - 'racing-mjx7303-michael-v39.html'

permissions:
  contents: read

concurrency:
  group: michael-v64-complete-toolchain
  cancel-in-progress: false

jobs:
  build-all-compilers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision every native compiler required by Michael
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build \
            emscripten lua5.4 golang-go dotnet-sdk-8.0 \
            curl jq xz-utils ca-certificates glslang-tools
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          zig_archive=/tmp/michael-zig-0.16.0.tar.xz
          zig_root=/tmp/michael-zig-0.16.0
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$zig_archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/michael-zig-0.16.0.tar.xz' | sha256sum -c -
          rm -rf "$zig_root" && mkdir -p "$zig_root"
          tar -xf "$zig_archive" -C "$zig_root" --strip-components=1

      - name: Verify complete compiler inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          required=(em++ clang++ rustc cargo node npm go dotnet lua5.4 python3 curl glslangValidator)
          for tool in "${required[@]}"; do command -v "$tool" >/dev/null || { echo "MISSING COMPILER/TOOL: $tool"; exit 1; }; done
          test -x /tmp/michael-zig-0.16.0/zig
          printf '%-18s %s\n' emscripten "$(em++ --version | head -1)"
          printf '%-18s %s\n' clang "$(clang++ --version | head -1)"
          printf '%-18s %s\n' rust "$(rustc --version)"
          printf '%-18s %s\n' cargo "$(cargo --version)"
          printf '%-18s %s\n' node "$(node --version)"
          printf '%-18s %s\n' npm "$(npm --version)"
          printf '%-18s %s\n' go "$(go version)"
          printf '%-18s %s\n' dotnet "$(dotnet --version)"
          printf '%-18s %s\n' lua "$(lua5.4 -v 2>&1)"
          printf '%-18s %s\n' python "$(python3 --version)"
          printf '%-18s %s\n' zig "$(/tmp/michael-zig-0.16.0/zig version)"
          printf '%-18s %s\n' glslang "$(glslangValidator --version | head -1)"

      - name: Compile complete Michael polyglot runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/build-michael-polyglot.sh

      - name: Verify generated WASM and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in michael-core.js michael-core.wasm michael-rust.wasm michael-assembly.wasm michael-zig.wasm michael-polyglot.js polyglot-manifest.json compiler-provenance.json; do test -s "jarvis/generated/$f" || { echo "missing generated runtime $f"; exit 1; }; done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const f of ['michael-core.wasm','michael-rust.wasm','michael-assembly.wasm','michael-zig.wasm']) new WebAssembly.Module(fs.readFileSync('jarvis/generated/'+f));
          const m=JSON.parse(fs.readFileSync('jarvis/generated/polyglot-manifest.json','utf8'));
          if(m.engine!=='MICHAEL_V57'||m.languages?.length!==12) throw Error(`wrong manifest ${m.engine} languages=${m.languages?.length}`);
          const p=JSON.parse(fs.readFileSync('jarvis/generated/compiler-provenance.json','utf8'));
          for(const k of ['emscripten','rustc','cargo','node','npm','go','dotnet','lua','zig','python']) if(!p.compilers?.[k]) throw Error('missing provenance '+k);
          console.log('MICHAEL COMPLETE TOOLCHAIN PASS',m.languages.join(', '));
          NODE

      - name: Verify shader compiler and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          glslangValidator --version >/dev/null
          grep -F '#version 300 es' engine/shaders/michael-v48.glsl >/dev/null
          grep -F '@vertex' engine/shaders/michael-v48.wgsl >/dev/null
          grep -F '@fragment' engine/shaders/michael-v48.wgsl >/dev/null
          echo 'SHADER TOOLCHAIN PASS'

      - name: V64 Safari-exact payload integrity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {gunzipSync} from 'node:zlib';
          const mods=[];
          for(let i=0;i<4;i++) mods.push((await import(`./jarvis/michael-v64-payload-0${i}.js`)).default);
          const parts=mods.map((s,i)=>{
            if(typeof s!=='string'||!s.length) throw Error(`payload ${i} empty`);
            if(s.length%4!==0) throw Error(`payload ${i} length ${s.length} not divisible by 4`);
            if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s)) throw Error(`payload ${i} contains non-base64 characters`);
            let raw;
            try{raw=atob(s)}catch(e){throw Error(`payload ${i} atob failed: ${e.message}`)}
            const b=Buffer.allocUnsafe(raw.length);
            for(let n=0;n<raw.length;n++) b[n]=raw.charCodeAt(n);
            return b;
          });
          const gz=Buffer.concat(parts);
          if(gz[0]!==0x1f||gz[1]!==0x8b) throw Error('V64 payload is not gzip');
          const glb=gunzipSync(gz);
          if(glb.length!==95528) throw Error(`V64 GLB wrong size ${glb.length}`);
          if(glb.subarray(0,4).toString('ascii')!=='glTF') throw Error('V64 GLB magic missing');
          console.log(`V64 SAFARI PAYLOAD PASS chunks=${mods.length} gzip=${gz.length} glb=${glb.length}`);
          NODE
          node --check jarvis/mjx7303-racing-michael-v39.js
          node --check jarvis/michael-graphics-v39.js
