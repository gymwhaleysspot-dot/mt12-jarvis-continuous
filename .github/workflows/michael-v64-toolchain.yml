name: Michael V64 Stage-1 Shell Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/michael-v64-toolchain.yml'
      - 'tools/build_michael_v64.py'
      - 'jarvis/mjx7303-racing-michael-v39.js'

permissions:
  contents: write
concurrency:
  group: michael-v64-stage1-shell
  cancel-in-progress: false

jobs:
  build-stage1-shell:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build canonical bare shell
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p assets
          MICHAEL_V64_OUT="$PWD/assets/michael-v64-clean.glb" python tools/build_michael_v64.py | tee /tmp/v64-stage1.json
      - name: Validate raw GLB axis signature and landmarks
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,struct,hashlib
          import trimesh,numpy as np
          p=Path('assets/michael-v64-clean.glb');b=p.read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2 and struct.unpack_from('<I',b,8)[0]==len(b)
          s=trimesh.load(p,force='scene');d=np.asarray(s.bounds)[1]-np.asarray(s.bounds)[0]
          assert d[2]>d[0]>d[1],d.tolist()
          names=set(s.geometry.keys())
          for n in ['body_main','front_splitter','rear_lower','roof_reference','tire_-1_-1.58','tire_1_1.58']:assert n in names,n
          m={'asset':'MICHAEL_V64_STAGE1_BARE_SHELL','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'geometryCount':len(s.geometry),'dims':d.tolist(),'axis':'X_WIDTH_Y_UP_Z_LENGTH','stage':1,'detailPromotionAllowed':False,'transport':'DIRECT_GLB'}
          Path('assets/michael-v64-clean.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
      - name: Publish stage-1 shell
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/michael-v64-clean.glb assets/michael-v64-clean.json
          if git diff --cached --quiet; then echo 'stage-1 shell already current'; exit 0; fi
          git commit -m 'Publish Michael V64 stage-1 proven shell [skip ci]'
          git push origin HEAD:main
