name: Michael V64 Complete Toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/michael-v64-toolchain.yml'
      - 'scripts/build-michael-polyglot.sh'
      - 'engine/**'
      - 'tools/build_michael_v64.py'
      - 'jarvis/mjx7303-racing-michael-v39.js'
      - 'jarvis/michael-graphics-v39.js'
      - 'jarvis/racing-tab.js'
      - 'racing-mjx7303-michael-v39.html'

permissions:
  contents: write

concurrency:
  group: michael-v64-complete-toolchain
  cancel-in-progress: false

jobs:
  build-all-compilers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Provision every native compiler required by Michael
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld cmake ninja-build \
            emscripten lua5.4 golang-go dotnet-sdk-8.0 \
            curl jq xz-utils ca-certificates glslang-tools
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          zig_archive=/tmp/michael-zig-0.16.0.tar.xz
          zig_root=/tmp/michael-zig-0.16.0
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$zig_archive"
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/michael-zig-0.16.0.tar.xz' | sha256sum -c -
          rm -rf "$zig_root" && mkdir -p "$zig_root"
          tar -xf "$zig_archive" -C "$zig_root" --strip-components=1

      - name: Verify complete compiler inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          required=(em++ clang++ rustc cargo node npm go dotnet lua5.4 python3 curl glslangValidator)
          for tool in "${required[@]}"; do command -v "$tool" >/dev/null || { echo "MISSING COMPILER/TOOL: $tool"; exit 1; }; done
          test -x /tmp/michael-zig-0.16.0/zig
          em++ --version | head -1
          clang++ --version | head -1
          rustc --version
          cargo --version
          node --version
          npm --version
          go version
          dotnet --version
          lua5.4 -v
          python3 --version
          /tmp/michael-zig-0.16.0/zig version
          glslangValidator --version | head -1

      - name: Compile complete Michael polyglot runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/build-michael-polyglot.sh

      - name: Verify generated WASM and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in michael-core.js michael-core.wasm michael-rust.wasm michael-assembly.wasm michael-zig.wasm michael-polyglot.js polyglot-manifest.json compiler-provenance.json; do
            test -s "jarvis/generated/$f" || { echo "missing generated runtime $f"; exit 1; }
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for(const f of ['michael-core.wasm','michael-rust.wasm','michael-assembly.wasm','michael-zig.wasm']) new WebAssembly.Module(fs.readFileSync('jarvis/generated/'+f));
          const m=JSON.parse(fs.readFileSync('jarvis/generated/polyglot-manifest.json','utf8'));
          if(m.engine!=='MICHAEL_V57'||m.languages?.length!==12) throw Error(`wrong manifest ${m.engine} languages=${m.languages?.length}`);
          const p=JSON.parse(fs.readFileSync('jarvis/generated/compiler-provenance.json','utf8'));
          for(const k of ['emscripten','rustc','cargo','node','npm','go','dotnet','lua','zig','python']) if(!p.compilers?.[k]) throw Error('missing provenance '+k);
          console.log('MICHAEL COMPLETE TOOLCHAIN PASS',m.languages.join(', '));
          NODE

      - name: Verify shader compiler and contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          glslangValidator --version >/dev/null
          grep -F '#version 300 es' engine/shaders/michael-v48.glsl >/dev/null
          grep -F '@vertex' engine/shaders/michael-v48.wgsl >/dev/null
          grep -F '@fragment' engine/shaders/michael-v48.wgsl >/dev/null
          echo 'SHADER TOOLCHAIN PASS'

      - name: Build V64 clean-sheet binary asset
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p assets
          MICHAEL_V64_OUT="$PWD/assets/michael-v64-clean.glb" python tools/build_michael_v64.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, struct
          p=Path('assets/michael-v64-clean.glb')
          b=p.read_bytes()
          assert len(b) > 90000, len(b)
          assert b[:4] == b'glTF', b[:4]
          assert struct.unpack_from('<I', b, 4)[0] == 2
          assert struct.unpack_from('<I', b, 8)[0] == len(b)
          sha=hashlib.sha256(b).hexdigest()
          manifest={
            'asset':'MICHAEL_V64_CLEAN_SHEET',
            'bytes':len(b),
            'sha256':sha,
            'geometryCount':105,
            'faces':6232,
            'vertices':3326,
            'driverPresent':True,
            'navigatorPresent':True,
            'occupantCount':2,
            'transport':'DIRECT_GLB'
          }
          Path('assets/michael-v64-clean.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('V64 DIRECT GLB PASS',len(b),sha)
          PY
          node --check jarvis/mjx7303-racing-michael-v39.js
          grep -F "./assets/michael-v64-clean.glb?v=michael94" jarvis/mjx7303-racing-michael-v39.js >/dev/null

      - name: Publish verified V64 GLB
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/michael-v64-clean.glb assets/michael-v64-clean.json
          if git diff --cached --quiet; then
            echo 'V64 GLB already current'
            exit 0
          fi
          git commit -m 'Publish verified Michael V64 clean-sheet GLB [skip ci]'
          git push origin HEAD:main
