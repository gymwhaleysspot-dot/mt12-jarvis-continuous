name: Build JR514D Rally Dashboard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-jrw6e.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
      - name: Build dashboard-only source from JRW4-514
        run: |
          mkdir -p out
          cp public/builds/rewrite-31153944827-1/jrw4/jrw4.lua out/jr514d.lua
          python3 - <<'PY'
          from pathlib import Path
          p=Path('out/jr514d.lua');s=p.read_text()
          s=s.replace('local idSpd,idRpm,idSats,idRxBt,idRqly','local idSpd,idRpm,idSats,idRxBt,idRqly,idBat',1)
          a=s.index('local function draw(m,r)');b=s.index('local function alive(',a)
          d='''local cache={0,0,0,0,0,0};local pg=1;local mxM,mxR,mnB,mxB=0,0,0,0\nlocal function draw(m,r)\n local T=lcd.drawText;local D=lcd.drawNumber;local Z=SMLSIZE;local n=m_floor;local q=r or 0;local bv=val(idBat,0);if bv<=0 then bv=cache[2]or 0 end;local src=(V[1]==GPS_OK and"GPS")or(V[1]==GPS_COAST and"COAST")or"RPM";local sf=(V[6]==1 and"TARM")or(V[6]==2 and"WET")or(V[6]==3 and"LOOSE")or"AUTO";local st=(V[38]>0 and"TC")or(V[39]>0 and"ABS")or(V[620]>1 and"AIR")or(V[624]>0 and"ESC")or(V[119]>.55 and"UNCERT")or"ATTACK";lcd.clear();lcd.drawFilledRectangle(0,0,128,9);T(2,1,"J514D",Z+INVERS);T(76,1,st,Z+INVERS);T(116,1,tostring(pg),Z+INVERS)\n if pg==1 then\n  T(2,11,"MPH",Z);D(2,17,n(m+.5),DBLSIZE);T(47,11,"RPM",Z);D(70,11,n(q/1000+.5),Z);T(105,11,"G",Z);D(116,11,vG,Z);bar(47,20,78,4,q/78000)\n  T(2,36,"BAT",Z);D(22,36,n(bv*10+.5),Z);T(49,36,"V",Z);T(63,36,"TCT",Z);D(86,36,n(V[35]+.5),Z);T(108,36,"%",Z)\n  bar(2,45,55,3,clamp((bv>9 and bv/16.8 or bv/8.4),0,1));bar(63,45,62,3,V[35]/100)\n  T(2,50,"TC",Z);D(18,50,n(V[36]+.5),Z);T(42,50,"AB",Z);D(57,50,n(V[37]+.5),Z);T(79,50,"GYR",Z);D(101,50,n(gv(1)+.5),Z)\n  lcd.drawFilledRectangle(0,57,128,7);T(2,57,sf,Z+INVERS);T(40,57,src,Z+INVERS);T(78,57,"AUTH",Z+INVERS);D(105,57,n(V[720]+.5),Z+INVERS)\n elseif pg==2 then\n  T(2,11,"TRUTH",Z);T(38,11,src,Z);T(76,11,"CONF",Z);D(105,11,n(V[114]*100+.5),Z);bar(2,20,123,4,V[114])\n  T(2,27,"AUTH",Z);D(30,27,n(V[720]+.5),Z);T(57,27,"UNC",Z);D(82,27,n(V[119]*100+.5),Z);T(105,27,"%",Z)\n  bar(2,35,54,3,V[720]/100);bar(63,35,62,3,V[119])\n  T(2,41,"SURF",Z);T(31,41,sf,Z);T(70,41,"AI",Z);D(87,41,n(V[182]+.5),Z);T(108,41,"%",Z)\n  T(2,49,"CAUSE",Z);D(39,49,n(V[223]+.5),Z);T(68,49,"MODE",Z);D(100,49,n(V[120]+.5),Z)\n  lcd.drawFilledRectangle(0,57,128,7);T(2,57,(V[650]==2 and"BURST")or(V[650]==1 and"WATCH")or"CALM",Z+INVERS);T(55,57,"RQ",Z+INVERS);D(73,57,cache[3]or 0,Z+INVERS);T(97,57,"SAT",Z+INVERS);D(117,57,cache[4]or 0,Z+INVERS)\n else\n  T(2,11,"MAX MPH",Z);D(55,11,n(mxM+.5),Z);T(2,20,"MAX RPM",Z);D(55,20,n(mxR/1000+.5),Z);T(89,20,"K",Z)\n  T(2,29,"MIN BAT",Z);D(55,29,n(mnB*10+.5),Z);T(83,29,"V",Z);T(95,29,"SAG",Z);D(116,29,n((mxB-bv)*10+.5),Z)\n  T(2,38,"TC#",Z);D(24,38,n(V[549]+.5),Z);T(50,38,"AB#",Z);D(74,38,n(V[552]+.5),Z);T(99,38,"EV",Z);D(114,38,n(V[289]+.5),Z)\n  T(2,47,"MEM",Z);T(28,47,(memLoaded>0 and"OK")or"NEW",Z);T(58,47,"BB",Z);T(77,47,(sessOn and"REC")or"IDLE",Z);T(106,47,"S",Z);D(117,47,sessNo,Z)\n  lcd.drawFilledRectangle(0,57,128,7);T(2,57,"SESSION",Z+INVERS);T(51,57,"BAT",Z+INVERS);D(73,57,n(bv*10+.5),Z+INVERS);T(102,57,"V",Z+INVERS)\n end\nend\n'''
          s=s[:a]+d+s[b:]
          s=s.replace('local cache={0,0,0,0,0,0}\nlocal function background()','local function background()',1)
          s=s.replace('setgv(0,0);setgv(1,0);setgv(3,100);setgv(4,0);setgv(7,1024);loadMem();collectgarbage("collect");','setgv(0,0);setgv(1,0);setgv(3,100);setgv(4,0);setgv(7,1024);idBat=fid("VFAS")or fid("EscV")or fid("A4");loadMem();collectgarbage("collect");',1)
          old='local mph=update(gps,e,st,sats,m_abs(th),th,b,rq);watch();cache[1]=mph;cache[2]=rx;cache[3]=rq;cache[4]=sats;cache[5]=b;cache[6]=e;'
          new=old+'local bv=val(idBat,0);if bv<=0 then bv=rx end;if mph>mxM then mxM=mph end;if e>mxR then mxR=e end;if bv>0 then if mnB==0 or bv<mnB then mnB=bv end;if bv>mxB then mxB=bv end end;'
          assert old in s;s=s.replace(old,new,1)
          s=s.replace('if not sessOn then voiceBlock=0;sndBlock=0;sessNo=sessNo+1;','if not sessOn then mxM=0;mxR=0;mnB=0;mxB=0;voiceBlock=0;sndBlock=0;sessNo=sessNo+1;',1)
          old='local function run(event)\nui_tick=(ui_tick+1)%3\nif ui_tick~=0 and (event==0 or event==nil)then return end\ndraw(cache[1],cache[6])\nend'
          new='local function run(event)\nif event==EVT_PAGE_BREAK or event==EVT_PLUS_FIRST or event==EVT_ROT_RIGHT then pg=pg%3+1 elseif event==EVT_MINUS_FIRST or event==EVT_ROT_LEFT then pg=(pg+1)%3+1 end\nui_tick=(ui_tick+1)%3\nif ui_tick~=0 and (event==0 or event==nil)then return end\ndraw(cache[1],cache[6])\nend'
          assert old in s;s=s.replace(old,new,1)
          p.write_text(s)
          assert s.index('local function bb_line(') < s.index('local function bootStep()')
          assert 'bb_line(143' in s and s.index('bb_line(143') > s.index('local function bb_line(')
          PY
          lua5.3 -e "assert(loadfile('out/jr514d.lua'))"
      - name: Compile and normalize MT12
        run: |
          chmod +x toolchain/compile_mt12.sh
          MAX_BYTES=87000 toolchain/compile_mt12.sh out/jr514d.lua out/jr514d.luac | tee out/COMPILE.txt
          test "$(wc -c < out/jr514d.luac)" -le 87000
          test "$(od -An -tx1 -j12 -N5 out/jr514d.luac | tr -d ' \n')" = '0404040404'
          sha256sum out/jr514d.lua out/jr514d.luac > out/SHA256SUMS.txt
          (cd out && zip -9 JR514D_MT12.zip jr514d.lua jr514d.luac COMPILE.txt SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: jr514d-mt12
          path: out/
          retention-days: 30
