name: Survivor Production 235 Full Rebuild Verification
on:
  push:
    branches: [main]
    paths:
      - 'survivor.html'
      - 'jarvis/**'
      - 'tools/build-survivor-production*.mjs'
      - 'tools/test-survivor-production*.mjs'
      - 'tools/survivor-runtime-smoke.mjs'
      - '.github/workflows/survivor-pages-231.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'survivor.html'
      - 'jarvis/**'
      - 'tools/build-survivor-production*.mjs'
      - 'tools/test-survivor-production*.mjs'
      - 'tools/survivor-runtime-smoke.mjs'
      - '.github/workflows/survivor-pages-231.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survivor-235-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble and verify canonical Survivor Production 235
        run: |
          set -Eeuo pipefail
          required=(survivor.html jarvis/core-survivor.js jarvis/core-survivor-235.js jarvis/production234-canonical-runtime-rewrite.inc.js jarvis/production235-full-survivor-rebuild.inc.js tools/build-survivor-production231.mjs tools/build-survivor-production234.mjs tools/build-survivor-production235.mjs tools/test-survivor-production235-contract.mjs tools/survivor-runtime-smoke.mjs)
          for f in "${required[@]}"; do test -f "$f" || { echo "Missing $f" >&2; exit 1; }; done
          for f in jarvis/production234-canonical-runtime-rewrite.inc.js jarvis/production235-full-survivor-rebuild.inc.js tools/build-survivor-production234.mjs tools/build-survivor-production235.mjs tools/test-survivor-production235-contract.mjs tools/survivor-runtime-smoke.mjs; do node --check "$f"; done
          cp jarvis/core-survivor-235.js /tmp/core-survivor-235.committed.js
          cp survivor.html /tmp/survivor-production235-source.html
          node <<'NODE'
          const fs=require('fs'),p='survivor.html';let h=fs.readFileSync(p,'utf8');
          const rx=/jarvis\/core-survivor(?:-(?:221|230|231|234|235))?\.js(?:\?v=[^"'<>\s]*)?/g,refs=h.match(rx)||[];
          if(refs.length!==1)throw Error(`Expected one canonical source loader before assembly, found ${refs.length}`);
          h=h.replace(rx,'jarvis/core-survivor.js?v=production235-assembly-bootstrap');fs.writeFileSync(p,h);
          NODE
          for n in 204 205 206 207 209 210 211 212 213 215 217 218 219 220 222 224 225 227 229 230 231 234 235; do node "tools/build-survivor-production${n}.mjs"; done
          cp /tmp/survivor-production235-source.html survivor.html
          node --check jarvis/core-survivor-235.js
          node tools/test-survivor-production235-contract.mjs
          cmp --silent /tmp/core-survivor-235.committed.js jarvis/core-survivor-235.js || { echo 'Committed Production 235 artifact differs from fresh assembly' >&2; sha256sum /tmp/core-survivor-235.committed.js jarvis/core-survivor-235.js; exit 1; }
          node <<'NODE'
          const fs=require('fs'),core=fs.readFileSync('jarvis/core-survivor-235.js','utf8');
          for(const n of [196,199,204,220,221,222,223,224,225,228,229,230,231,234,235])if(!core.includes(`PRODUCTION_${n}_READY`))throw Error(`missing PRODUCTION_${n}_READY`);
          for(const m of ['FRESH_CANONICAL_BOSS_FACTORY','NO_LEGACY_LIRA_BOSS_REUSE','ATOMIC_STAGE_OPPONENT_TARGET_ARENA','DUAL_EVENT_ROUTE_NORMALIZATION','SPAWN_EVENT_SUPPRESSION_AND_REEMIT','AUTHORITATIVE_FORM_TRUTH','AUTHORITATIVE_HIT_TRUTH','GLOBAL_RUNTIME_PROOF','REPLAY_67_ACCEPTANCE'])if(!core.includes(m))throw Error('missing Production 235 marker '+m);
          if((core.match(/const production235=/g)||[]).length!==1)throw Error('Production 235 must exist exactly once');
          if(!core.includes('__JARVIS_SURVIVOR_RUNTIME__'))throw Error('global runtime proof missing');
          NODE
      - name: Install Playwright browser engines
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute Survivor 235 in Chromium and WebKit
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/chromium node tools/survivor-runtime-smoke.mjs chromium
          SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/webkit node tools/survivor-runtime-smoke.mjs webkit
      - name: Upload Survivor browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-browser-${{ github.sha }}
          path: artifacts/
          retention-days: 30
