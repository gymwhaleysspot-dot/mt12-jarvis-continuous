name: Survivor Runtime 300 Scratch Rebuild Verification
on:
  push:
    branches: [main]
    paths: ['survivor.html','jarvis/survivor-tab.js','tools/test-survivor-production235-contract.mjs','tools/survivor-runtime-smoke.mjs','.github/workflows/survivor-pages-231.yml','.github/workflows/pages.yml']
  pull_request:
    paths: ['survivor.html','jarvis/survivor-tab.js','tools/test-survivor-production235-contract.mjs','tools/survivor-runtime-smoke.mjs','.github/workflows/survivor-pages-231.yml','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survivor-300-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify standalone runtime contract
        run: |
          set -Eeuo pipefail
          node --check tools/test-survivor-production235-contract.mjs
          node --check tools/survivor-runtime-smoke.mjs
          node tools/test-survivor-production235-contract.mjs
      - name: Install Playwright browser engines
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute runtime 300 in Chromium and WebKit
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          SURVIVOR_EXPECTED_PRODUCTION=300 SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/chromium node tools/survivor-runtime-smoke.mjs chromium
          SURVIVOR_EXPECTED_PRODUCTION=300 SURVIVOR_URL=http://127.0.0.1:4173/survivor.html SURVIVOR_SMOKE_OUT=artifacts/webkit node tools/survivor-runtime-smoke.mjs webkit
      - name: Upload Survivor browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-browser-${{ github.sha }}
          path: artifacts/
          retention-days: 30
