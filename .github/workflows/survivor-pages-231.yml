name: Survivor Runtime 321 Verification
on:
  push:
    branches: [main]
    paths: ['survivor-runtime321.html','survivor.html','jarvis/survivor-tab.js','jarvis/assets/survivor/**','tools/test-survivor-runtime321-contract.mjs','tools/test-survivor-production241-contract.mjs','tools/survivor-runtime-smoke.mjs','.github/workflows/survivor-pages-231.yml','.github/workflows/pages.yml']
  pull_request:
    paths: ['survivor-runtime321.html','survivor.html','jarvis/survivor-tab.js','jarvis/assets/survivor/**','tools/test-survivor-runtime321-contract.mjs','tools/test-survivor-production241-contract.mjs','tools/survivor-runtime-smoke.mjs','.github/workflows/survivor-pages-231.yml','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: survivor-316-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify Runtime 321 contract
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f survivor-runtime321.html
          node --check tools/test-survivor-runtime321-contract.mjs
          node --check tools/test-survivor-production241-contract.mjs
          node --check tools/survivor-runtime-smoke.mjs
          node --check tools/survivor-runtime321-lives-smoke.mjs
          node tools/test-survivor-runtime321-contract.mjs
          node tools/test-survivor-production241-contract.mjs
          grep -F 'name="survivor-runtime" content="321"' survivor-runtime321.html
          grep -F 'RUNTIME=321' survivor-runtime321.html
          grep -F 'LEVEL_COUNT=45' survivor-runtime321.html
          grep -F 'POSE_COUNT=42' survivor-runtime321.html
      - name: Install Playwright browser engines
        run: |
          set -Eeuo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Execute Runtime 321 in Chromium and WebKit
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          SURVIVOR_EXPECTED_PRODUCTION=321 SURVIVOR_URL=http://127.0.0.1:4173/survivor-runtime321.html SURVIVOR_SMOKE_OUT=artifacts/chromium node tools/survivor-runtime-smoke.mjs chromium
          SURVIVOR_EXPECTED_PRODUCTION=321 SURVIVOR_URL=http://127.0.0.1:4173/survivor-runtime321.html SURVIVOR_SMOKE_OUT=artifacts/webkit node tools/survivor-runtime-smoke.mjs webkit
          SURVIVOR_URL=http://127.0.0.1:4173/survivor-runtime321.html SURVIVOR_LIVES_OUT=artifacts/lives node tools/survivor-runtime321-lives-smoke.mjs
      - name: Upload Survivor browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-runtime321-browser-${{ github.sha }}
          path: artifacts/
          retention-days: 30
