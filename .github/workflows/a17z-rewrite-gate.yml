name: A17Z Rewrite Gate
on:
  pull_request:
    paths:
      - tools/build_a17z_rewrite.py
      - tools/restore_a17z_causal.py
      - .github/workflows/a17z-rewrite-gate.yml
      - a17y.lua
      - toolchain/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh
      - name: Generate A17Z-R1
        run: |
          set -Eeuo pipefail
          python3 tools/build_a17z_rewrite.py
          python3 tools/restore_a17z_causal.py
          lua5.3 -e "assert(loadfile('a17z.lua'))"
      - name: Verify architecture and restored protections
        run: |
          set -Eeuo pipefail
          grep -q '^--a17z unified world-model controller' a17z.lua
          grep -Fq 'local function zBrain' a17z.lua
          for n in neural evo superBrain aiGate learn condBrain; do ! grep -Fq "local function $n" a17z.lua; done
          grep -Fq 'X[41]' a17z.lua
          grep -Fq 'X[42]' a17z.lua
          grep -Fq 'X[43]' a17z.lua
          grep -Fq 'X[46]' a17z.lua
          grep -Fq '.0045' a17z.lua
          grep -Fq 'V[740+km]' a17z.lua
          grep -Fq 'V[750+km]' a17z.lua
          grep -Fq 'V[760+km]' a17z.lua
          grep -Fq 'V[720]=ac' a17z.lua
          grep -Fq 'setgv(3,m_min(V[35],ac))' a17z.lua
          ! grep -Fq 'setgv(3,V[35])' a17z.lua
          python3 - <<'PY'
          from pathlib import Path
          import difflib,json
          p=Path('a17y.lua').read_text();c=Path('a17z.lua').read_text()
          ratio=difflib.SequenceMatcher(None,p,c).ratio()
          report={'parentBytes':len(p),'childBytes':len(c),'similarity':ratio,'unifiedEngine':'zBrain','championState':['X[41]','X[42]','X[43]','X[46]'],'confidenceWeight':'.0045','perModeChampion':'V[740+mode]','rollbackBackup':'V[750+mode]','outcomeStreak':'V[760+mode]','authorityCeiling':'V[720], applied at final GVar output','classification':'A17Z_R1_ARCHITECTURAL_REWRITE_EXPERIMENTAL'}
          Path('REWRITE-AUDIT.json').write_text(json.dumps(report,indent=2))
          assert ratio < .97 and len(c)>65000
          PY
      - name: Compile and normalize A17Z-R1
        run: |
          set -Eeuo pipefail
          MAX_BYTES=87050 toolchain/compile_mt12.sh a17z.lua a17z.luac
          test -s a17z.luac
          test "$(wc -c < a17z.luac)" -le 87050
          sha256sum a17z.lua a17z.luac > SHA256SUMS.txt
          printf 'A17Z-R1 unified world-model rewrite\nPer-mode causal champion learning, confidence streaks, consecutive-outcome hysteresis, rollback backups, and final authority ceiling restored\nExperimental: bench and road validation required\n' > BUILD-AUDIT.txt
          zip -9 a17z-r1.zip a17z.lua a17z.luac SHA256SUMS.txt BUILD-AUDIT.txt REWRITE-AUDIT.json
      - uses: actions/upload-artifact@v6
        with:
          name: a17z-r1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            a17z.lua
            a17z.luac
            SHA256SUMS.txt
            BUILD-AUDIT.txt
            REWRITE-AUDIT.json
            a17z-r1.zip
          if-no-files-found: error
          retention-days: 180
