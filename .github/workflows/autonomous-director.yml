name: A17Y Engineering OS v3
run-name: Director ${{ inputs.request_id || github.sha }}
on:
  workflow_dispatch:
    inputs:
      mission:
        description: Optional objective; blank lets the Director choose from evidence
        required: false
        default: Autonomously diagnose and improve the highest-value evidence-supported weakness
      logs:
        description: Optional selected CSV paths; repository evidence is discovered when blank
        required: false
        default: ''
      model:
        description: Primary GitHub Models model ID
        required: false
        default: openai/gpt-4.1
      request_id:
        description: Unique UI request identifier
        required: false
        default: manual
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - a17y.lua
      - tests/replays/**
      - evidence/**
      - research/current.json
      - research/questions.json
      - director/**
      - workbench/**
      - protected/**
      - toolchain/**
      - scripts/mt12-harness.lua
      - scripts/mt12-replay.lua
      - .github/workflows/autonomous-director.yml
permissions:
  contents: write
  actions: read
  models: read
concurrency:
  group: a17y-engineering-os-v3-${{ inputs.request_id || github.ref }}
  cancel-in-progress: false
jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIRECTOR_MISSION: ${{ inputs.mission || 'Autonomously diagnose and improve the highest-value evidence-supported weakness' }}
      DIRECTOR_LOGS: ${{ inputs.logs || '' }}
      DIRECTOR_MODEL: ${{ inputs.model || 'openai/gpt-4.1' }}
      A17Y_REQUEST_ID: ${{ inputs.request_id || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install deterministic MT12 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh
      - name: Validate v3 architecture
        run: |
          test -f a17y.lua
          test -f research/current.json
          for f in research/run.mjs director/run.mjs director/v2/evidence.mjs director/v2/scoring.mjs director/v2/memory.mjs director/v2/model-client.mjs director/v2/dependency.mjs director/v2/digital-twin.mjs director/v2/prepare.mjs director/v2/replay.mjs director/v2/finalize.mjs director/v2/validate-evidence.mjs workbench/rcos.mjs toolchain/normalize_luac53_mt12.js; do node --check "$f"; done
          bash -n toolchain/compile_mt12.sh
          luac5.3 -p a17y.lua
          luac5.3 -p scripts/mt12-harness.lua
          luac5.3 -p scripts/mt12-replay.lua
      - name: Validate selected replay paths
        run: |
          set -euo pipefail
          for p in $DIRECTOR_LOGS; do case "$p" in tests/replays/*.csv) test -f "$p";; *) echo "Rejected replay path: $p" >&2; exit 1;; esac; done
      - name: Validate hash-bound bench and road evidence
        run: node director/v2/validate-evidence.mjs
      - name: Discover logs, dependencies and cited research
        run: node director/v2/prepare.mjs
      - name: Generate repeatable Digital Twin scenarios
        run: node director/v2/digital-twin.mjs dist-director/DIGITAL-TWIN.json
      - name: Run intelligent closed loop with service fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          MODELS=("${DIRECTOR_MODEL}" "openai/gpt-4.1-mini" "openai/gpt-4o")
          : > dist-director/AI-ATTEMPTS.log
          ok=0
          for model in "${MODELS[@]}"; do
            for attempt in 1 2 3; do
              echo "model=$model attempt=$attempt request=$A17Y_REQUEST_ID" | tee -a dist-director/AI-ATTEMPTS.log
              export DIRECTOR_MODEL="$model"
              if node director/run.mjs >>dist-director/DIRECTOR-STDOUT.log 2>>dist-director/DIRECTOR-STDERR.log; then ok=1; break 2; fi
              sleep $((attempt*20))
            done
          done
          if [[ "$ok" != 1 ]]; then echo 'NO CHANGE RECOMMENDED: AI service unavailable or all model attempts failed.' > dist-director/STATUS.txt; fi
      - name: Replay recorded telemetry through parent and children
        if: always()
        run: node director/v2/replay.mjs
      - name: Calibrate scores, authority and validated memory
        if: always()
        run: node director/v2/finalize.mjs
      - name: Capture complete diagnostics
        if: always()
        run: |
          mkdir -p dist-director
          cp director/memory.json dist-director/ENGINEERING-MEMORY.json
          cp research/current.json dist-director/RESEARCH-CURRENT.json
          sha256sum a17y.lua > dist-director/PARENT-SHA256.txt
          printf '%s\n' "$A17Y_REQUEST_ID" > dist-director/REQUEST-ID.txt
          printf '%s\n' "$DIRECTOR_MODEL" > dist-director/REQUESTED-MODEL.txt
          git status --short > dist-director/GIT-STATUS.txt
          env | grep -E '^(DIRECTOR_|A17Y_REQUEST_ID|GITHUB_RUN_|GITHUB_SHA)' | sed 's/GITHUB_TOKEN=.*/GITHUB_TOKEN=REDACTED/' > dist-director/RUN-ENV.txt || true
          cd dist-director
          zip -9 -r ../a17y-engineering-os-v3.zip .
      - name: Publish v3 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a17y-engineering-${{ inputs.request_id || github.run_id }}
          path: a17y-engineering-os-v3.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish console-compatible evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a17y-autonomous-director-${{ inputs.request_id || github.run_id }}
          path: a17y-engineering-os-v3.zip
          if-no-files-found: error
          retention-days: 90
      - name: Persist validated engineering memory
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          node -e "import('./director/v2/memory.mjs').then(m=>m.load('director/memory.json'))"
          if git diff --quiet -- director/memory.json; then exit 0; fi
          git config user.name 'A17Y Engineering Director'
          git config user.email 'actions@users.noreply.github.com'
          git add director/memory.json
          git commit -m 'Record validated engineering evidence [skip ci]'
          git pull --rebase origin main
          git push
