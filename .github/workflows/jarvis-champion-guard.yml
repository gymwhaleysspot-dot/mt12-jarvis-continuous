name: Jarvis Champion Protection Gate
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/jarvis-champion-guard.yml
      - tools/jarvis_champion_guard.py
      - public/builds/**
      - factory/tracks.json
permissions:
  contents: write
concurrency:
  group: jarvis-champion-protection
  cancel-in-progress: true
jobs:
  protect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Enforce direct champion comparison
        run: |
          set -euo pipefail
          python3 -m py_compile tools/jarvis_champion_guard.py
          python3 tools/jarvis_champion_guard.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('public/jarvis-data/champion-protection.json').read_text())
          i=json.loads(Path('public/builds/index.json').read_text())
          assert r['schema']=='JARVIS-CHAMPION-GUARD-1'
          assert i['championProtected'] is True
          assert r['rules']['directComparisonRequired'] is True
          assert r['rules']['regressionsAllowed'] is False
          if i.get('recommended'):
              assert sum(1 for b in i['builds'] if b.get('recommended'))==1
          print(r['champion'], r['promotedThisRun'])
          PY
      - name: Persist protected champion state
        run: |
          set -euo pipefail
          git config user.name 'Jarvis Champion Authority'
          git config user.email 'actions@users.noreply.github.com'
          # Recompute the champion state from the newest main on every attempt.
          # Never rebase a stale generated index across another Jarvis writer.
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/jarvis_champion_guard.py
            git add public/builds/index.json public/builds/recommended.json public/jarvis-data/champion-protection.json factory/memory/champion-history.json
            if git diff --cached --quiet; then
              echo 'Champion state already current on main.'
              exit 0
            fi
            git commit -m 'Enforce Jarvis champion protection [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Champion state changed concurrently; recomputing from latest main (attempt $n/5)."
            sleep $((n*5))
          done
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: jarvis-champion-protection
          path: public/jarvis-data/champion-protection.json
          retention-days: 90
