name: Verify Survivor Live Runtime
on:
  workflow_run:
    workflows: ["Deploy Michael Current to Pages"]
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Runtime 320 cinematic atlas-3D / 45-level build reached Pages
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          LIVE_BASE: https://gymwhaleysspot-dot.github.io/mt12-jarvis-continuous
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 20); do
            html="$(curl -fsSL -H 'Cache-Control: no-cache, no-store' "$LIVE_BASE/survivor-runtime320.html?verify=$DEPLOY_SHA-$attempt" || true)"
            tab="$(curl -fsSL -H 'Cache-Control: no-cache, no-store' "$LIVE_BASE/jarvis/survivor-tab.js?verify=$DEPLOY_SHA-$attempt" || true)"
            if printf '%s' "$html" | grep -q 'name="survivor-runtime" content="320"' && \
               printf '%s' "$html" | grep -q 'MODEL_RENDERER_VERSION=10' && \
               printf '%s' "$html" | grep -q 'LEVEL_COUNT=45' && \
               printf '%s' "$html" | grep -q 'ANIME_DEPTH_ATLAS_3D_V6' && \
               printf '%s' "$html" | grep -q 'jarvis-survivor-replay-v16' && \
               printf '%s' "$tab" | grep -q '20260820runtime320graphics3dv14' && \
               printf '%s' "$tab" | grep -q 'RUNTIME 320 // ANIME DEPTH GRAPHICS V15' && \
               printf '%s' "$tab" | grep -q 'survivor-replay-overlay'; then
              echo "Runtime 320 cinematic atlas-3D / 45-level build verified live at $DEPLOY_SHA"
              exit 0
            fi
            sleep 5
          done
          echo 'Live Survivor deployment did not expose Runtime 320 cinematic atlas-3D / 45 levels.' >&2
          echo "Expected SHA: $DEPLOY_SHA" >&2
          exit 1
