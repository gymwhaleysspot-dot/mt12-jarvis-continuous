name: One Button Autonomous MT12 Lua

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

env:
  MT12_LIMIT: '88944'
  MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
  AUTONOMOUS_ARCHITECT_MODEL: openai/gpt-4o-mini
  AUTONOMOUS_BUILDER_MODEL: openai/gpt-4.1

concurrency:
  group: autonomous-one-button-lua
  cancel-in-progress: false

jobs:
  invent-build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.3
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lua5.3
      - name: AI decides what useful new MT12 Lua to create
        run: node scripts/autonomous-scratch-architect.mjs
      - name: AI writes the complete Lua from scratch
        id: synth
        run: |
          FILE=$(node scripts/autonomous-complete-lua.mjs reports/autonomous-scratch-plan.json)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "base=$(basename "$FILE" .lua)" >> "$GITHUB_OUTPUT"
      - name: Syntax validate compile normalize and gate
        run: |
          set -euo pipefail
          FILE="${{ steps.synth.outputs.file }}"
          BASE="${{ steps.synth.outputs.base }}"
          OUT="generations/autonomous/$BASE"
          mkdir -p "$OUT"
          cp "$FILE" "$OUT/$BASE.lua"
          luac5.3 -p "$OUT/$BASE.lua"
          luac5.3 -s -o "$OUT/${BASE}_raw.luac" "$OUT/$BASE.lua"
          cp toolchain/normalize_luac53_mt12.js toolchain/normalize_luac53_mt12.cjs
          node toolchain/normalize_luac53_mt12.cjs "$OUT/${BASE}_raw.luac" "$OUT/$BASE.luac"
          BYTES=$(wc -c < "$OUT/$BASE.luac" | tr -d ' ')
          MARGIN=$((MT12_LIMIT-BYTES))
          test "$BYTES" -le "$MT12_LIMIT"
          test "$MARGIN" -ge 64
          python3 tools/mt12_factory.py "$OUT/$BASE.lua" --release "$BASE" --out "$OUT/audit" --normalizer toolchain/normalize_luac53_mt12.cjs
          LUA_SHA=$(sha256sum "$OUT/$BASE.lua"|awk '{print $1}')
          LUAC_SHA=$(sha256sum "$OUT/$BASE.luac"|awk '{print $1}')
          PLAN=$(cat reports/autonomous-scratch-plan.json)
          node - "$OUT/build.json" "$BYTES" "$MARGIN" "$LUA_SHA" "$LUAC_SHA" <<'NODE'
          const fs=require('fs'),[p,bytes,margin,lua,luac]=process.argv.slice(2),plan=require('./reports/autonomous-scratch-plan.json');
          fs.writeFileSync(p,JSON.stringify({status:'PASS',automatic:true,name:plan.name,title:plan.title,type:plan.id,mission:plan.mission,rationale:plan.rationale,bytes:+bytes,limit:88944,margin:+margin,source:`generations/autonomous/${plan.name}/${plan.name}.lua`,luac:`generations/autonomous/${plan.name}/${plan.name}.luac`,source_sha256:lua,luac_sha256:luac,built:new Date().toISOString()},null,2));
          NODE
          rm "$OUT/${BASE}_raw.luac"
      - name: Publish autonomous vault and status
        run: |
          BASE="${{ steps.synth.outputs.base }}"
          cp "generations/autonomous/$BASE/build.json" reports/autonomous-latest.json
          node - <<'NODE'
          const fs=require('fs'),p='reports/autonomous-catalog.json',b=JSON.parse(fs.readFileSync('reports/autonomous-latest.json'));let d={sequence:0,updated:'',builds:[]};try{d=JSON.parse(fs.readFileSync(p))}catch{};d.sequence=(d.sequence||0)+1;d.builds=[b,...(d.builds||[]).filter(x=>x.name!==b.name)].slice(0,50);d.updated=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(d,null,2));fs.writeFileSync('reports/autonomous-scratch-status.json',JSON.stringify({status:'accepted',updated:d.updated,build:b},null,2));
          NODE
      - name: Commit completed Lua and deployable LUAC
        run: |
          git config user.name 'MT12 Autonomous Architect'
          git config user.email 'actions@users.noreply.github.com'
          git add generations/autonomous reports/autonomous-*.json reports/autonomous-scratch-plan.json
          git commit -m "Autonomously invent and build MT12 Lua ${{ steps.synth.outputs.base }} [skip factory]" || exit 0
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-mt12-${{ steps.synth.outputs.base }}
          path: |
            generations/autonomous/${{ steps.synth.outputs.base }}/${{ steps.synth.outputs.base }}.lua
            generations/autonomous/${{ steps.synth.outputs.base }}/${{ steps.synth.outputs.base }}.luac
            generations/autonomous/${{ steps.synth.outputs.base }}/build.json
