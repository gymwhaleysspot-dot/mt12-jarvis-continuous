name: Build A16K
on:
  push:
    branches: [main]
    paths:
      - 'a16k.lua'
      - '.github/workflows/build-a16k.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAX_BYTES: '87000'
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          luac5.3 -v
          node --version
      - name: Verify A16K source exists
        run: test -f a16k.lua
      - name: Compile, normalize and verify
        run: |
          chmod +x toolchain/compile_mt12.sh
          toolchain/compile_mt12.sh a16k.lua a16k.luac
          grep -Fq 'function fo()setgv(0,0);setgv(1,0);setgv(3,100);setgv(7,1024)end' a16k.lua
          ! grep -Fq 'function fo()fo()end' a16k.lua
          sha256sum a16k.lua a16k.luac > SHA256SUMS.txt
          wc -c a16k.lua a16k.luac
      - name: Package A16K
        run: zip -9 a16k-build.zip a16k.luac SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: a16k-mt12-deploy
          path: a16k-build.zip
          if-no-files-found: error
          retention-days: 30
