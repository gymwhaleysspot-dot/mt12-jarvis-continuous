name: Nickelle Always-On Evolution Watchdog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nickelle-always-on-watchdog.yml'
      - '.github/workflows/michael-global-intelligence-scheduler.yml'
      - '.github/workflows/jarvis-integrated-intelligence.yml'
      - '.github/workflows/nickelle-visual-research.yml'
      - '.github/workflows/keleb-interior-evolution.yml'
      - '.github/workflows/michael-full-reconstruction.yml'
      - '.github/workflows/michael-visual-evolution.yml'
      - '.github/workflows/nickelle-advanced-graphics.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: nickelle-always-on-watchdog
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keep only the global scheduler alive
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          active="$(gh api "/repos/$REPO/actions/workflows/michael-global-intelligence-scheduler.yml/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting")]|length')"
          echo "Global scheduler active/queued: $active"
          [ "$active" -gt 0 ] || gh workflow run michael-global-intelligence-scheduler.yml --repo "$REPO" --ref main
      - name: Report intelligence health without duplicate dispatch
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          for workflow in michael-global-intelligence-scheduler.yml nickelle-autonomous-repair.yml michael-full-reconstruction.yml michael-visual-evolution.yml nickelle-advanced-graphics.yml nickelle-heavy-vision.yml nickelle-visual-research.yml keleb-interior-evolution.yml jarvis-integrated-intelligence.yml; do
            echo "--- $workflow ---"
            gh api "/repos/$REPO/actions/workflows/$workflow/runs?per_page=3" --jq '.workflow_runs[] | [.run_number,.status,(.conclusion // ""),.event,.head_sha,.created_at] | @tsv' || true
          done
