name: Controller Candidate Tournament

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: R patch, F feature, X research, or G generation
        required: true
        default: X
        type: choice
        options: [R, F, X, G]
      series:
        description: Five-character candidate prefix; digit is appended
        required: true
        default: a17zx
        type: string

permissions:
  contents: read

concurrency:
  group: controller-candidate-tournament-manual
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TYPE: ${{ inputs.release_type || 'X' }}
      SERIES: ${{ inputs.series || 'a17zx' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install deterministic Lua toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh
      - name: Validate release request
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TYPE" =~ ^[RFXG]$ ]]
          [[ "$SERIES" =~ ^[a-z0-9]{1,5}$ ]]
          python3 -m json.tool controller-release-policy.json >/dev/null
      - name: Generate, compile, normalize, and self-evaluate five candidates
        run: python3 tools/controller_tournament.py
      - name: Verify tournament evidence
        run: |
          set -Eeuo pipefail
          test -s dist-controller-tournament/TOURNAMENT.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('dist-controller-tournament/TOURNAMENT.json'))
          compiled=[x for x in r['candidates'] if x['status']=='COMPILED']
          assert compiled
          for x in compiled:
            d=f"dist-controller-tournament/{x['candidate']}"
            assert os.path.isfile(f"{d}/{x['candidate']}.lua")
            assert os.path.isfile(f"{d}/{x['candidate']}.luac")
            assert 'candidateIntelligence' in x
            assert 'parentIntelligence' in x
            assert 'intelligenceDelta' in x
          if r['winner']:
            w=next(x for x in compiled if x['candidate']==r['winner'])
            assert w['intelligenceDelta']>0
          print('verdict',r['verdict'],'winner',r['winner'],'runner-up',r['runnerUp'],'compiled',len(compiled))
          PY
      - name: Upload manual tournament evidence
        uses: actions/upload-artifact@v6
        with:
          name: controller-tournament-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-controller-tournament/
          if-no-files-found: error
          retention-days: 180
