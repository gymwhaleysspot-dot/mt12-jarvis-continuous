name: Build a15xr MT12 LUAC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'a15xq.lua'
      - 'scripts/build-a15xr.mjs'
      - 'toolchain/normalize_luac53_mt12.js'
      - '.github/workflows/build-a15xr.yml'

permissions:
  contents: write

concurrency:
  group: build-a15xr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.3
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lua5.3
          command -v luac5.3
      - name: Build a15xr source
        run: |
          mkdir -p reports builds
          node scripts/build-a15xr.mjs
          luac5.3 -p a15xr.lua
      - name: Compile and normalize for MT12
        run: |
          luac5.3 -s -o builds/a15xr_raw.luac a15xr.lua
          node toolchain/normalize_luac53_mt12.js builds/a15xr_raw.luac builds/a15xr.luac
          BYTES=$(wc -c < builds/a15xr.luac | tr -d ' ')
          test "$BYTES" -le 88944
          SHA=$(sha256sum builds/a15xr.luac | cut -d' ' -f1)
          printf '{"file":"builds/a15xr.luac","bytes":%s,"limit":88944,"margin":%s,"sha256":"%s","compiler":"luac5.3 -s","normalized":true}\n' "$BYTES" "$((88944-BYTES))" "$SHA" > reports/a15xr-build.json
          cp a15xr.lua builds/a15xr.lua
          rm -f builds/a15xr_raw.luac
          cat reports/a15xr-build.json
      - name: Commit deploy build
        run: |
          git config user.name 'mt12-a15xr-builder'
          git config user.email 'mt12-a15xr-builder@users.noreply.github.com'
          git add a15xr.lua builds/a15xr.lua builds/a15xr.luac reports/a15xr-source.json reports/a15xr-build.json
          git diff --cached --quiet && exit 0
          git commit -m 'Build normalized a15xr MT12 deploy bytecode [skip factory]'
          git pull --rebase
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: a15xr-mt12-deploy
          path: |
            builds/a15xr.luac
            builds/a15xr.lua
            reports/a15xr-build.json
          retention-days: 30
