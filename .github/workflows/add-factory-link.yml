name: Add LUAC Factory Link

on:
  push:
    paths:
      - '.github/workflows/add-factory-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add factory navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<nav class="tabs"><button class="active" data-page="dash">Dashboard</button><button data-page="logs">Log Viewer</button><button data-page="ai">AI Builder</button><button data-page="compiler">Compiler</button></nav>'
          new='<nav class="tabs"><button class="active" data-page="dash">Dashboard</button><button data-page="logs">Log Viewer</button><button data-page="ai">AI Builder</button><button data-page="compiler">Compiler</button><a class="btn primary" href="factory.html" aria-label="Open LUAC Factory">LUAC Factory</a></nav>'
          if 'href="factory.html"' not in s:
              if old not in s:
                  raise SystemExit('navigation marker not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit navigation fix
        run: |
          git config user.name 'mt12-site-fix'
          git config user.email 'mt12-site-fix@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add LUAC Factory link to main lab'
          git push
