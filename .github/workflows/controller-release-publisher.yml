name: Controller Release Publisher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controller-release-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install deterministic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip
          chmod +x toolchain/compile_mt12.sh
      - name: Resolve immutable release identity
        run: |
          set -Eeuo pipefail
          RELEASE="$(tr -d '[:space:]' < controller-release.txt)"
          [[ "$RELEASE" =~ ^[a-z0-9]{1,10}$ ]]
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
      - name: Generate controller source
        run: |
          set -Eeuo pipefail
          python3 tools/build_a17z_rewrite.py
          python3 tools/restore_a17z_causal.py
          mv a17z.lua "$RELEASE.lua"
          lua5.3 -e "assert(loadfile('$RELEASE.lua'))"
      - name: Enforce protected architecture
        run: |
          set -Eeuo pipefail
          F="$RELEASE.lua"
          grep -Fq 'local function zBrain' "$F"
          grep -Fq 'X[41]' "$F"
          grep -Fq 'X[42]' "$F"
          grep -Fq 'X[43]' "$F"
          grep -Fq 'X[46]' "$F"
          grep -Fq '.0045' "$F"
          grep -Fq 'V[740+km]' "$F"
          grep -Fq 'local bk=750+km' "$F"
          grep -Fq 'V[760+km]' "$F"
          grep -Fq 'V[720]=ac' "$F"
          grep -Fq 'setgv(3,m_min(V[35],ac))' "$F"
          ! grep -Fq 'setgv(3,V[35])' "$F"
      - name: Compile and normalize MT12 bytecode
        run: |
          set -Eeuo pipefail
          MAX_BYTES=87050 toolchain/compile_mt12.sh "$RELEASE.lua" "$RELEASE.luac"
          test -s "$RELEASE.luac"
          test "$(wc -c < "$RELEASE.luac")" -le 87050
      - name: Create immutable release package
        run: |
          set -Eeuo pipefail
          mkdir -p release
          cp "$RELEASE.lua" "$RELEASE.luac" release/
          sha256sum "$RELEASE.lua" "$RELEASE.luac" > release/SHA256SUMS.txt
          LUA_BYTES=$(wc -c < "$RELEASE.lua"); LUAC_BYTES=$(wc -c < "$RELEASE.luac")
          LUA_SHA=$(sha256sum "$RELEASE.lua" | cut -d' ' -f1); LUAC_SHA=$(sha256sum "$RELEASE.luac" | cut -d' ' -f1)
          python3 - <<PY
          import json,os
          r=os.environ['RELEASE']
          m={'release':r,'authority':'EXPERIMENTAL_BENCH_AND_ROAD_REQUIRED','source':f'{r}.lua','deploy':f'{r}.luac','sourceBytes':int('${LUA_BYTES}'),'normalizedBytes':int('${LUAC_BYTES}'),'ceilingBytes':87050,'sourceSha256':'${LUA_SHA}','luacSha256':'${LUAC_SHA}','commit':'${GITHUB_SHA}','immutable':True}
          open('release/MANIFEST.json','w').write(json.dumps(m,indent=2)+'\n')
          PY
          (cd release && zip -9 "$RELEASE.zip" "$RELEASE.lua" "$RELEASE.luac" SHA256SUMS.txt MANIFEST.json)
      - name: Publish permanent immutable download only if novel
        run: |
          set -Eeuo pipefail
          DEST="public/builds/releases/$RELEASE"
          NEW=$(python3 -c "import json;print(json.load(open('release/MANIFEST.json'))['luacSha256'])")
          FOUND=$(python3 - <<'PY'
          import json,glob,os
          target=json.load(open('release/MANIFEST.json'))['luacSha256']
          for p in glob.glob('public/builds/releases/*/MANIFEST.json'):
            try:
              if json.load(open(p)).get('luacSha256')==target:
                print(p); break
            except Exception: pass
          PY
          )
          if [ -n "$FOUND" ]; then echo "Identical LUAC already published at $FOUND"; exit 0; fi
          test ! -e "$DEST"
          mkdir -p "$DEST"; cp release/* "$DEST/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$DEST"
          git commit -m "Publish unique immutable controller release $RELEASE"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v6
        with:
          name: controller-release-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 180
