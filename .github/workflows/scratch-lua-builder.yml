name: MT12 Scratch Lua Builder

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Optional repository path to one scratch JSON specification
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'factory_inbox/scratch-*.json'
      - '.github/workflows/scratch-lua-builder.yml'
      - 'scripts/scratch-lua-generator.mjs'
      - 'toolchain/normalize_luac53_mt12.js'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

env:
  MT12_LIMIT: '88944'

concurrency:
  group: mt12-scratch-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lua 5.3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lua5.3
          command -v lua5.3
          command -v luac5.3
      - name: Build every pending scratch request
        id: build
        shell: bash
        env:
          REQUESTED_SPEC: ${{ inputs.spec_path || '' }}
        run: |
          set -euo pipefail
          mkdir -p reports generations/scratch generations/scratch-source
          cp toolchain/normalize_luac53_mt12.js toolchain/normalize_luac53_mt12.cjs
          mapfile -t SPECS < <(node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const requested=process.env.REQUESTED_SPEC||'';
          let files=[];
          if(requested){files=[requested]}
          else if(fs.existsSync('factory_inbox')){
            files=fs.readdirSync('factory_inbox').filter(x=>/^scratch-.*\.json$/.test(x)).map(x=>path.join('factory_inbox',x)).sort();
          }
          for(const f of files){
            try{
              const s=JSON.parse(fs.readFileSync(f,'utf8'));
              const n=String(s.name||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,6).toLowerCase();
              if(n && !fs.existsSync(`generations/scratch/${n}/build.json`)) console.log(f);
            }catch(e){console.error(`Ignoring invalid request ${f}: ${e.message}`)}
          }
          NODE
          )
          if [ "${#SPECS[@]}" -eq 0 ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No pending scratch requests"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          for SPEC in "${SPECS[@]}"; do
            echo "Processing $SPEC"
            node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!/^[A-Za-z0-9_-]{1,6}$/.test(s.name||''))throw Error('name must be 1-6 safe characters');if(!String(s.mission||'').trim())throw Error('mission required')" "$SPEC"
            FILE=$(node scripts/scratch-lua-generator.mjs "$SPEC")
            test -f "$FILE"
            BASE=$(basename "$FILE" .lua)
            OUT="generations/scratch/$BASE"
            mkdir -p "$OUT"
            cp "$FILE" "$OUT/$BASE.lua"
            luac5.3 -p "$OUT/$BASE.lua"
            luac5.3 -s -o "$OUT/${BASE}_raw.luac" "$OUT/$BASE.lua"
            node toolchain/normalize_luac53_mt12.cjs "$OUT/${BASE}_raw.luac" "$OUT/$BASE.luac"
            BYTES=$(wc -c < "$OUT/$BASE.luac" | tr -d ' ')
            MARGIN=$((MT12_LIMIT-BYTES))
            if [ "$BYTES" -gt "$MT12_LIMIT" ]; then
              echo "Normalized LUAC exceeds MT12 limit: $BYTES > $MT12_LIMIT" >&2
              exit 1
            fi
            SHA_LUA=$(sha256sum "$OUT/$BASE.lua" | awk '{print $1}')
            SHA_LUAC=$(sha256sum "$OUT/$BASE.luac" | awk '{print $1}')
            node - "$OUT/build.json" "$BASE" "$OUT/$BASE.lua" "$OUT/$BASE.luac" "$BYTES" "$MARGIN" "$SHA_LUA" "$SHA_LUAC" "$SPEC" <<'NODE'
          const fs=require('fs');
          const [p,name,source,luac,bytes,margin,sourceSha,luacSha,spec]=process.argv.slice(2);
          fs.writeFileSync(p,JSON.stringify({status:'PASS',name,source,luac,bytes:Number(bytes),limit:88944,margin:Number(margin),source_sha256:sourceSha,luac_sha256:luacSha,spec,built:new Date().toISOString()},null,2)+'\n');
          NODE
            rm -f "$OUT/${BASE}_raw.luac"
            python3 tools/mt12_factory.py "$OUT/$BASE.lua" --release "$BASE" --out "$OUT/audit" --normalizer toolchain/normalize_luac53_mt12.cjs || true
          done
      - name: Rebuild scratch catalog
        if: steps.build.outputs.built == 'true'
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='generations/scratch',builds=[];
          if(fs.existsSync(root)) for(const n of fs.readdirSync(root)){
            const p=path.join(root,n,'build.json');
            try{builds.push(JSON.parse(fs.readFileSync(p,'utf8')))}catch{}
          }
          builds.sort((a,b)=>Date.parse(b.built||0)-Date.parse(a.built||0));
          fs.mkdirSync('reports',{recursive:true});
          fs.writeFileSync('reports/scratch-catalog.json',JSON.stringify({updated:new Date().toISOString(),builds:builds.slice(0,50)},null,2)+'\n');
          if(builds[0])fs.writeFileSync('reports/scratch-latest.json',JSON.stringify(builds[0],null,2)+'\n');
          NODE
      - name: Commit complete source, normalized LUAC and reports
        if: steps.build.outputs.built == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MT12 Scratch Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add generations/scratch reports/scratch-catalog.json reports/scratch-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Build complete scratch MT12 Lua batch [skip factory]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          exit 1
      - name: Upload scratch outputs
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mt12-scratch-builds-${{ github.run_number }}
          path: |
            generations/scratch/
            reports/scratch-catalog.json
            reports/scratch-latest.json
          retention-days: 30
