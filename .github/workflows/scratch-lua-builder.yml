name: MT12 Scratch Lua Builder

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: Repository path to scratch build JSON specification
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'factory_inbox/scratch-*.json'
      - '.github/workflows/scratch-lua-builder.yml'
      - 'scripts/scratch-lua-generator.mjs'
      - 'toolchain/normalize_luac53_mt12.js'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

env:
  MT12_LIMIT: '88944'

concurrency:
  group: mt12-scratch-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve queued specification
        id: spec
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SPEC="${{ inputs.spec_path }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            SPEC=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'factory_inbox/scratch-*.json' | tail -n 1 || true)
          else
            SPEC=""
          fi
          if [ -z "${SPEC:-}" ]; then
            SPEC=$(node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='factory_inbox';
          const files=fs.existsSync(dir)?fs.readdirSync(dir).filter(x=>/^scratch-.*\.json$/.test(x)):[];
          files.sort((a,b)=>fs.statSync(path.join(dir,b)).mtimeMs-fs.statSync(path.join(dir,a)).mtimeMs);
          for(const f of files){
            try{
              const s=JSON.parse(fs.readFileSync(path.join(dir,f),'utf8'));
              const n=String(s.name||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,6).toLowerCase();
              if(n && !fs.existsSync(`generations/scratch/${n}/build.json`)){console.log(path.join(dir,f));break}
            }catch{}
          }
          NODE
          )
          fi
          if [ -z "${SPEC:-}" ]; then
            echo "No unbuilt scratch requests found"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f "$SPEC"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$SPEC" >> "$GITHUB_OUTPUT"
          echo "Building $SPEC"
      - name: Install Lua 5.3
        if: steps.spec.outputs.found == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lua5.3
          command -v luac5.3
      - name: Validate specification
        if: steps.spec.outputs.found == 'true'
        run: |
          SPEC="${{ steps.spec.outputs.path }}"
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!/^[a-zA-Z0-9_-]{1,6}$/.test(s.name||''))throw Error('name must be 1-6 safe characters');if(!s.mission)throw Error('mission required')" "$SPEC"
      - name: Generate complete Lua from scratch
        if: steps.spec.outputs.found == 'true'
        id: generate
        run: |
          FILE=$(node scripts/scratch-lua-generator.mjs "${{ steps.spec.outputs.path }}")
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "base=$(basename "$FILE" .lua)" >> "$GITHUB_OUTPUT"
      - name: Syntax compile and normalize
        if: steps.spec.outputs.found == 'true'
        run: |
          set -euo pipefail
          FILE="${{ steps.generate.outputs.file }}"
          BASE="${{ steps.generate.outputs.base }}"
          OUT="generations/scratch/$BASE"
          mkdir -p "$OUT" reports
          cp "$FILE" "$OUT/$BASE.lua"
          luac5.3 -p "$OUT/$BASE.lua"
          luac5.3 -s -o "$OUT/${BASE}_raw.luac" "$OUT/$BASE.lua"
          cp toolchain/normalize_luac53_mt12.js toolchain/normalize_luac53_mt12.cjs
          node toolchain/normalize_luac53_mt12.cjs "$OUT/${BASE}_raw.luac" "$OUT/$BASE.luac"
          BYTES=$(wc -c < "$OUT/$BASE.luac" | tr -d ' ')
          MARGIN=$((MT12_LIMIT-BYTES))
          test "$BYTES" -le "$MT12_LIMIT"
          SHA_LUA=$(sha256sum "$OUT/$BASE.lua" | awk '{print $1}')
          SHA_LUAC=$(sha256sum "$OUT/$BASE.luac" | awk '{print $1}')
          cat > "$OUT/build.json" <<JSON
          {"status":"PASS","name":"$BASE","source":"$OUT/$BASE.lua","luac":"$OUT/$BASE.luac","bytes":$BYTES,"limit":$MT12_LIMIT,"margin":$MARGIN,"source_sha256":"$SHA_LUA","luac_sha256":"$SHA_LUAC","spec":"${{ steps.spec.outputs.path }}","built":"$(date -u +%FT%TZ)"}
          JSON
          rm -f "$OUT/${BASE}_raw.luac"
      - name: Run MT12 audit factory
        if: steps.spec.outputs.found == 'true'
        run: |
          BASE="${{ steps.generate.outputs.base }}"
          python3 tools/mt12_factory.py "generations/scratch/$BASE/$BASE.lua" --release "$BASE" --out "generations/scratch/$BASE/audit" --normalizer toolchain/normalize_luac53_mt12.cjs || true
      - name: Publish latest scratch build report
        if: steps.spec.outputs.found == 'true'
        run: |
          BASE="${{ steps.generate.outputs.base }}"
          mkdir -p reports
          cp "generations/scratch/$BASE/build.json" reports/scratch-latest.json
          node - <<'NODE'
          const fs=require('fs');const p='reports/scratch-catalog.json';let d={updated:'',builds:[]};try{d=JSON.parse(fs.readFileSync(p))}catch{}
          const b=JSON.parse(fs.readFileSync('reports/scratch-latest.json'));d.builds=(d.builds||[]).filter(x=>x.name!==b.name);d.builds.unshift(b);d.builds=d.builds.slice(0,50);d.updated=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Commit complete Lua and normalized LUAC
        if: steps.spec.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name "MT12 Scratch Factory"
          git config user.email "actions@users.noreply.github.com"
          git add generations/scratch reports/scratch-latest.json reports/scratch-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build complete scratch MT12 Lua ${{ steps.generate.outputs.base }} [skip factory]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: steps.spec.outputs.found == 'true'
        with:
          name: mt12-scratch-${{ steps.generate.outputs.base }}
          path: |
            generations/scratch/${{ steps.generate.outputs.base }}/${{ steps.generate.outputs.base }}.lua
            generations/scratch/${{ steps.generate.outputs.base }}/${{ steps.generate.outputs.base }}.luac
            generations/scratch/${{ steps.generate.outputs.base }}/build.json
          retention-days: 30
