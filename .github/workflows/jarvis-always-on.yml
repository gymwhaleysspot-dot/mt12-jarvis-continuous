name: Jarvis Always-On Orchestrator

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/jarvis-always-on.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: jarvis-always-on-orchestrator
  cancel-in-progress: true

jobs:
  keep-jarvis-working:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect activity and dispatch next useful task
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Productive workflows that count as Jarvis actively working.
          PRODUCTIVE=(
            jarvis-complete-factory.yml
            controller-tournament.yml
            historical-log-reingest.yml
            jarvis-knowledge-graph.yml
            research.yml
            chief-engineer.yml
            firmware-catalog.yml
            discovery.yml
            workbench.yml
            guaranteed-luac.yml
            force-candidate.yml
            device-release.yml
            real-world-completion.yml
            control-center.yml
            rcos.yml
            v3-operations.yml
          )

          active=0
          active_names=()
          for wf in "${PRODUCTIVE[@]}"; do
            json="$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$REPO/actions/workflows/$wf/runs?per_page=10" 2>/dev/null || printf '{\"workflow_runs\":[]}')"
            count="$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length' <<<"$json")"
            if (( count > 0 )); then
              active=$((active + count))
              active_names+=("$wf:$count")
            fi
          done

          if (( active > 0 )); then
            echo "Jarvis is active: $active productive run(s): ${active_names[*]}"
            exit 0
          fi

          # No productive work is running. Rotate through useful autonomous tasks.
          # The full factory appears multiple times because it is Jarvis's primary brain loop.
          QUEUE=(
            jarvis-complete-factory.yml
            jarvis-knowledge-graph.yml
            historical-log-reingest.yml
            jarvis-complete-factory.yml
            controller-tournament.yml
            firmware-catalog.yml
            jarvis-complete-factory.yml
            discovery.yml
            chief-engineer.yml
          )

          slot=$(( $(date -u +%s) / 300 % ${#QUEUE[@]} ))
          selected="${QUEUE[$slot]}"
          echo "Jarvis is idle. Selected autonomous task: $selected"

          case "$selected" in
            jarvis-complete-factory.yml)
              gh workflow run "$selected" --repo "$REPO" --ref main -f mode=full
              ;;
            *)
              gh workflow run "$selected" --repo "$REPO" --ref main
              ;;
          esac

          sleep 3
          gh run list --repo "$REPO" --workflow "$selected" --limit 1 \
            --json databaseId,status,conclusion,workflowName,createdAt \
            --jq '.[0] | "Dispatched: \(.workflowName) run #\(.databaseId), status=\(.status), created=\(.createdAt)"'
