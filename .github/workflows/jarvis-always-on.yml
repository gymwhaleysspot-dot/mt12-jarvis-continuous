name: Jarvis Always-On Orchestrator

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Jarvis Complete Rewrite LUAC Factory
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: jarvis-always-on-orchestrator
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Enforce producer cooldown after a completed generation
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Rewrite generation completed; waiting 5 minutes before considering the next generation.'
          sleep 300

      - name: Keep one controller producer and one intelligence lane active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          active_count() {
            local wf="$1" json
            json="$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$REPO/actions/workflows/$wf/runs?per_page=20" 2>/dev/null || printf '{"workflow_runs":[]}')"
            jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length' <<<"$json"
          }

          dispatch() {
            local wf="$1"
            echo "Dispatching $wf"
            gh workflow run "$wf" --repo "$REPO" --ref main
          }

          primary='jarvis-complete-rewrite-factory.yml'
          primary_active="$(active_count "$primary")"
          if (( primary_active == 0 )); then
            dispatch "$primary"
            echo 'Primary LUAC rewrite lane restarted.'
          else
            echo "Primary LUAC rewrite lane active: $primary_active run(s)."
          fi

          # These lanes learn/analyze only; standalone candidate builders are excluded.
          INTELLIGENCE=(historical-log-reingest.yml jarvis-knowledge-graph.yml firmware-catalog.yml chief-engineer.yml discovery.yml evidence-authority.yml)
          intelligence_active=0
          intelligence_names=()
          for wf in "${INTELLIGENCE[@]}"; do
            n="$(active_count "$wf")"
            if (( n > 0 )); then
              intelligence_active=$((intelligence_active+n))
              intelligence_names+=("$wf:$n")
            fi
          done
          if (( intelligence_active == 0 )); then
            slot=$(( $(date -u +%s) / 300 % ${#INTELLIGENCE[@]} ))
            dispatch "${INTELLIGENCE[$slot]}"
          else
            echo "Intelligence lane active: ${intelligence_names[*]}"
          fi

          echo 'Current productive runs:'
          gh run list --repo "$REPO" --limit 30 \
            --json databaseId,status,conclusion,workflowName,createdAt \
            --jq '.[] | select(.status!="completed") | "- \(.workflowName) #\(.databaseId): \(.status)"'
