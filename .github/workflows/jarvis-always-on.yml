name: Jarvis Always-On Orchestrator

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/jarvis-always-on.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: jarvis-always-on-orchestrator
  cancel-in-progress: true

jobs:
  keep-jarvis-working:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Keep file production and intelligence lanes active
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          active_count() {
            local wf="$1" json
            json="$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$REPO/actions/workflows/$wf/runs?per_page=12" 2>/dev/null || printf '{"workflow_runs":[]}')"
            jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested" or .status=="pending")] | length' <<<"$json"
          }

          dispatch() {
            local wf="$1"
            shift
            echo "Dispatching $wf $*"
            gh workflow run "$wf" --repo "$REPO" --ref main "$@"
          }

          # Lane 1: at least one workflow must be producing deployable controller files.
          FILE_PRODUCERS=(
            jarvis-complete-factory.yml
            guaranteed-luac.yml
            workbench.yml
          )

          producer_active=0
          producer_names=()
          for wf in "${FILE_PRODUCERS[@]}"; do
            n="$(active_count "$wf")"
            if (( n > 0 )); then
              producer_active=$((producer_active+n))
              producer_names+=("$wf:$n")
            fi
          done

          if (( producer_active == 0 )); then
            # Factory receives most slots because it builds, compiles, normalizes,
            # simulates, replays, ranks and publishes complete candidate sets.
            BUILD_QUEUE=(
              jarvis-complete-factory.yml
              jarvis-complete-factory.yml
              guaranteed-luac.yml
              jarvis-complete-factory.yml
              workbench.yml
              jarvis-complete-factory.yml
            )
            slot=$(( $(date -u +%s) / 300 % ${#BUILD_QUEUE[@]} ))
            selected="${BUILD_QUEUE[$slot]}"
            case "$selected" in
              jarvis-complete-factory.yml) dispatch "$selected" -f mode=full ;;
              *) dispatch "$selected" ;;
            esac
            echo "File-production lane started: $selected"
          else
            echo "File-production lane active: ${producer_names[*]}"
          fi

          # Lane 2: intelligence and maintenance may run beside file production.
          INTELLIGENCE=(
            controller-tournament.yml
            historical-log-reingest.yml
            jarvis-knowledge-graph.yml
            research.yml
            chief-engineer.yml
            firmware-catalog.yml
            discovery.yml
          )

          intelligence_active=0
          intelligence_names=()
          for wf in "${INTELLIGENCE[@]}"; do
            n="$(active_count "$wf")"
            if (( n > 0 )); then
              intelligence_active=$((intelligence_active+n))
              intelligence_names+=("$wf:$n")
            fi
          done

          if (( intelligence_active == 0 )); then
            INTELLIGENCE_QUEUE=(
              historical-log-reingest.yml
              jarvis-knowledge-graph.yml
              controller-tournament.yml
              firmware-catalog.yml
              chief-engineer.yml
              discovery.yml
            )
            slot=$(( $(date -u +%s) / 300 % ${#INTELLIGENCE_QUEUE[@]} ))
            selected="${INTELLIGENCE_QUEUE[$slot]}"
            dispatch "$selected"
            echo "Intelligence lane started: $selected"
          else
            echo "Intelligence lane active: ${intelligence_names[*]}"
          fi

          sleep 3
          echo 'Current productive runs:'
          gh run list --repo "$REPO" --limit 20 \
            --json databaseId,status,conclusion,workflowName,createdAt \
            --jq '.[] | select(.status!="completed") | "- \(.workflowName) #\(.databaseId): \(.status)"'
