name: Michael Cross-Agent Whole-Car Tournament

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/michael_cross_agent_tournament.mjs'
      - 'tools/michael_artist_council.mjs'
      - 'michael/art/ultra-art-director.json'
      - 'nickelle/artist-brain.json'
      - 'keleb/artist-brain.json'

permissions:
  contents: write

concurrency:
  group: michael-cross-agent-whole-car-tournament
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Restore Nickelle and Keleb measured artist state from ai-state
        run: |
          set -Eeuo pipefail
          git fetch origin ai-state
          mkdir -p /tmp/ai-state/keleb michael/reconstruction
          git show origin/ai-state:keleb/measured-state.json >/tmp/ai-state/keleb/measured-state.json
          git show origin/ai-state:keleb/artist-council.json >/tmp/ai-state/keleb/artist-council.json
          git show origin/ai-state:michael/reconstruction/advanced-state.json >michael/reconstruction/advanced-state.json
          git show origin/ai-state:michael/reconstruction/autonomous-state.json >michael/reconstruction/autonomous-state.json 2>/dev/null || true
      - name: Run Ultra Art Director combined exterior interior tournament
        run: |
          node --check tools/michael_artist_council.mjs
          node --check tools/michael_cross_agent_tournament.mjs
          node tools/michael_cross_agent_tournament.mjs /tmp/cross-agent-tournament.json
          cat /tmp/cross-agent-tournament.json
      - name: Persist compatibility and art-director verdict to ai-state only
        run: |
          set -Eeuo pipefail
          git config user.name 'Michael Ultra Art Director'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin ai-state
          state_tree="$(mktemp -d /tmp/michael-tournament-ai-state.XXXXXX)/tree"
          git worktree add --detach "$state_tree" origin/ai-state
          (
            cd "$state_tree"
            mkdir -p michael/system
            cp /tmp/cross-agent-tournament.json michael/system/cross-agent-tournament.json
            git add michael/system/cross-agent-tournament.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update isolated whole-car Ultra Art Director state [skip ci]'
            git push origin HEAD:ai-state
          )
      - name: Archive compatibility evidence
        uses: actions/upload-artifact@v6
        with:
          name: michael-cross-agent-${{ github.run_number }}
          path: /tmp/cross-agent-tournament.json
          retention-days: 90
