name: Deploy Michael V57 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate Michael V57 release
        run: |
          node --check jarvis/michael-graphics-v39.js
          node --check jarvis/mjx7303-racing-michael-v39.js
          node --check jarvis/racing-tab.js
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const need=(p,s)=>{const v=fs.readFileSync(p,'utf8');if(!v.includes(s))throw Error(`${p} missing ${s}`)};
          need('index.html','michael71');
          need('racing-mjx7303-michael-v39.html','MICHAEL PERSONAL TWIN V57');
          need('jarvis/michael-graphics-v39.js','MICHAEL_V57');
          need('jarvis/michael-graphics-v39.js','CAMERA_SAFE_STUDIO_FOUNDATION');
          need('jarvis/michael-engine-v45.js','MICHAEL_ENGINE_V57');
          need('jarvis/mjx7303-racing-michael-v39.js','MICHAEL V57');
          need('jarvis/racing-tab.js','MICHAEL V57');
          const release=JSON.parse(fs.readFileSync('public/michael-v57-release.json'));
          if(release.engine!=='MICHAEL_V57'||release.cache!=='michael71')throw Error('V57 release manifest mismatch');
          const poly=JSON.parse(fs.readFileSync('engine/polyglot.json'));
          if(poly.engine!=='MICHAEL_V57'||poly.languages.length!==12)throw Error('V57 polyglot contract mismatch');
          if(fs.statSync('jarvis/generated/michael-assembly.wasm').size<100)throw Error('AssemblyScript WASM is incomplete');
          let b64='';for(let i=0;i<14;i++){const n=String(i).padStart(2,'0'),t=fs.readFileSync(`jarvis/michael-v40-payload-${n}.js`,'utf8'),m=t.match(/export default ['"]([^'"]+)/);if(!m)throw Error(`payload ${i} invalid`);b64+=m[1]}
          const b=Buffer.from(b64,'base64');if(b.subarray(0,4).toString()!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('GLB invalid');
          const sha=crypto.createHash('sha256').update(b).digest('hex');
          if(sha!=='f0825ec3dee992c6ae69065c5760e3926d3db4be525502faf3a72d6b86120bf6')throw Error(`GLB sha mismatch: ${sha}`);
          console.log({engine:release.engine,cache:release.cache,languages:poly.languages.length,glbBytes:b.length,sha});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
