name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: actions/configure-pages@v5
      - name: Verify Survivor Runtime 313 contracts
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f survivor-runtime313.html
          node --check tools/test-survivor-production235-contract.mjs
          node --check tools/survivor-runtime-smoke.mjs
          node tools/test-survivor-production235-contract.mjs
          grep -F 'name="survivor-runtime" content="313"' survivor-runtime313.html
          grep -F 'RUNTIME=313' survivor-runtime313.html
          grep -F 'LEVEL_COUNT=45' survivor-runtime313.html
          grep -F 'POSE_COUNT=42' survivor-runtime313.html
      - name: Install Playwright browser engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Browser-boot Runtime 313 before deployment
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/predeploy
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/predeploy/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          SURVIVOR_EXPECTED_PRODUCTION=313 SURVIVOR_URL=http://127.0.0.1:4173/survivor-runtime313.html SURVIVOR_SMOKE_OUT=artifacts/predeploy/chromium node tools/survivor-runtime-smoke.mjs chromium
          SURVIVOR_EXPECTED_PRODUCTION=313 SURVIVOR_URL=http://127.0.0.1:4173/survivor-runtime313.html SURVIVOR_SMOKE_OUT=artifacts/predeploy/webkit node tools/survivor-runtime-smoke.mjs webkit
      - name: Stamp deployment identity
        env:
          SURVIVOR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA,p='survivor-runtime313.html';
          if(!/^[0-9a-f]{40}$/.test(sha||''))throw Error('Missing deployment SHA');
          let h=fs.readFileSync(p,'utf8');h=h.replace(/<meta name="survivor-build" content="[^"]+">/g,'');h=h.replace('<head>',`<head><meta name="survivor-build" content="${sha}">`);h=h.replace("globalThis.__SURVIVOR_DEPLOY_SHA__='SOURCE'",`globalThis.__SURVIVOR_DEPLOY_SHA__='${sha}'`);fs.writeFileSync(p,h);
          fs.writeFileSync('jarvis/survivor-build.json',JSON.stringify({runtime:313,modelRenderer:4,levels:45,poses:42,deploySha:sha,artifact:p,authority:'CINEMATIC_ASSET_KERNEL_V8',generatedAt:new Date().toISOString()},null,2)+'\n');
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Runtime 313 identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -Eeuo pipefail
          base="${PAGE_URL%/}";ok=0
          for attempt in $(seq 1 36); do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            html="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache, no-store' "${base}/survivor-runtime313.html?verify=${stamp}" || true)"
            manifest="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache, no-store' "${base}/jarvis/survivor-build.json?verify=${stamp}" || true)"
            tab="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache, no-store' "${base}/jarvis/survivor-tab.js?verify=${stamp}" || true)"
            if grep -Fq 'name="survivor-runtime" content="313"' <<<"$html" && grep -Fq "name=\"survivor-build\" content=\"${GITHUB_SHA}\"" <<<"$html" && grep -Fq '"runtime": 313' <<<"$manifest" && grep -Fq 'survivor-runtime313.html' <<<"$tab";then ok=1;echo "Runtime 313 live at ${GITHUB_SHA}";break;fi
            echo "Pages propagation ${attempt}/36 waiting for Runtime 313 ${GITHUB_SHA}"
            sleep 10
          done
          test "$ok" -eq 1
      - name: Browser-verify live Runtime 313
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          SURVIVOR_EXPECTED_PRODUCTION=313 SURVIVOR_URL="${base}/survivor-runtime313.html?browser=${GITHUB_SHA}" SURVIVOR_SMOKE_OUT=artifacts/live/chromium node tools/survivor-runtime-smoke.mjs chromium
          SURVIVOR_EXPECTED_PRODUCTION=313 SURVIVOR_URL="${base}/survivor-runtime313.html?browser=${GITHUB_SHA}" SURVIVOR_SMOKE_OUT=artifacts/live/webkit node tools/survivor-runtime-smoke.mjs webkit
      - name: Upload Survivor browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-pages-browser-${{ github.sha }}
          path: artifacts/
          retention-days: 30
