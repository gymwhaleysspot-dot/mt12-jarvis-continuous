name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths: ['index.html','survivor.html','racing-mjx7303-michael-v39.html','michael-health.html','jarvis/**','assets/**','engine/**','public/**','michael/visual/**','nickelle/**','.nojekyll','.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build Production 192 detailed Griffin GLB
        run: python3 tools/build_griffin_skeletal_192.py
      - name: Validate Survivor Production 193
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          test -f jarvis/griffin-render-184.js
          test -f jarvis/griffin-3d-192.js
          test -f jarvis/griffin-sprite-193.js
          test -s jarvis/assets/survivor/griffin-ascended-atlas-v3.webp
          test -s jarvis/assets/survivor/griffin-atlas-v3.webp
          node --check jarvis/griffin-render-184.js
          node --check jarvis/griffin-3d-192.js
          node --check jarvis/griffin-sprite-193.js
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),need=(p,s)=>{const t=fs.readFileSync(p,'utf8');if(!t.includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          need('jarvis/core-survivor.js','Defense Satellites');
          need('jarvis/griffin-render-184.js','PRODUCTION_193_AUTHORED_SPRITE_BOOTSTRAP');
          need('jarvis/griffin-render-184.js','griffin-sprite-193.js?v=20260816production193');
          need('jarvis/griffin-sprite-193.js','AUTHORED_SPRITE_ATLAS');
          need('jarvis/griffin-sprite-193.js','griffin-ascended-atlas-v3.webp');
          const a=fs.statSync('jarvis/assets/survivor/griffin-ascended-atlas-v3.webp').size,b=fs.statSync('jarvis/assets/survivor/griffin-atlas-v3.webp').size;if(a<400000||b<300000)throw Error('Griffin authored atlas quality gate failed');
          console.log({survivor:'PRODUCTION_193',griffin:'AUTHORED_SPRITE_ATLAS',ascendedBytes:a,baseBytes:b});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
