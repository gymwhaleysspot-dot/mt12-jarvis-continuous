name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - 'tools/build-survivor-production200.mjs'
      - 'tools/build-survivor-production201.mjs'
      - 'tools/build-survivor-production202.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 202
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          test -f jarvis/production201-replay46-total-repair.inc.js
          test -f jarvis/production202-state-of-art-fight-engine.inc.js
          test -f tools/build-survivor-production202.mjs
          node --check jarvis/production201-replay46-total-repair.inc.js
          node --check jarvis/production202-state-of-art-fight-engine.inc.js
          node --check tools/build-survivor-production202.mjs
          node tools/build-survivor-production202.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');need('survivor.html','jarvis/core-survivor.js?v=20260816production202');
          for(const m of ['PRODUCTION_196_READY','PRODUCTION_197_READY','PRODUCTION_198_READY','PRODUCTION_199_READY','PRODUCTION_200_READY','PRODUCTION_201_READY','PRODUCTION_202_READY'])need('jarvis/core-survivor.js',m);
          for(const m of ['STATE-OF-ART 2D ARENA FIGHT ENGINE','confirmedHitsDriveChains:true','whiffsHaveRecovery:true','vanishCostsResource:true','blastClashesRequireCollision:true','transformationsChangeState:true','firstFightUsesSameCombatAuthority:true'])need('jarvis/core-survivor.js',m);
          const html=text('survivor.html');if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(html))throw Error('Standalone Griffin renderer reintroduced');
          const root='jarvis/assets/survivor/';const griffin=['griffin-atlas-v3.webp','griffin-ascended-atlas-v3.webp','griffin-speed-form-atlas-v1.webp','griffin-guardian-form-atlas-v1.webp','griffin-destroyer-form-atlas-v1.webp','griffin-instinct-form-atlas-v1.webp','griffin-celestial-overdrive-atlas-v1.webp','griffin-omega-instinct-atlas-v1.webp'];for(const n of griffin){if(!fs.existsSync(root+n)||fs.statSync(root+n).size<100000)throw Error('Missing Griffin atlas '+n)}
          const portraits=['lira-nexus-v1.webp','kraken-abyss-v1.webp','kairox-caldera-v1.webp','mireya-prism-v1.webp','zephyra-tempest-v1.webp','solenne-corona-v1.webp','sable-eclipse-v1.webp','orun-ion-v1.webp','mordren-singularity-v1.webp'];for(const n of portraits)if(!fs.existsSync(root+'arenas/'+n))throw Error('Missing opponent arena art '+n);
          console.log({survivor:'PRODUCTION_202',engine:'RUSH_CHAIN_VANISH_CLASH_RECOVERY_RESOURCE_STATE_MACHINE',spriteAudit:'GRIFFIN_FULL_ATLASES_OPPONENT_FULL_COMBAT_ATLASES_NOT_YET_PROVEN',renderer:'SINGLE_VISIBLE_2D_STAGE'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
