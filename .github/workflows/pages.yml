name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - 'tools/build-survivor-production200.mjs'
      - 'tools/build-survivor-production201.mjs'
      - 'tools/build-survivor-production202.mjs'
      - 'tools/build-survivor-production203.mjs'
      - 'tools/build-survivor-production204.mjs'
      - 'tools/build-survivor-production205.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 205 stage authority
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          test -f jarvis/production203-round-art-sprite-authority.inc.js
          test -f jarvis/production204-replay47-authority.inc.js
          test -f jarvis/production205-stage-authority.inc.js
          test -f tools/build-survivor-production204.mjs
          test -f tools/build-survivor-production205.mjs
          node --check jarvis/production203-round-art-sprite-authority.inc.js
          node --check jarvis/production204-replay47-authority.inc.js
          node --check jarvis/production205-stage-authority.inc.js
          node --check tools/build-survivor-production204.mjs
          node --check tools/build-survivor-production205.mjs
          node tools/build-survivor-production204.mjs
          node tools/build-survivor-production205.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          need('survivor.html','jarvis/core-survivor.js?v=20260817production205stageauthority');
          for(const m of ['PRODUCTION_196_READY','PRODUCTION_197_READY','PRODUCTION_198_READY','PRODUCTION_199_READY','PRODUCTION_200_READY','PRODUCTION_201_READY','PRODUCTION_202_READY','PRODUCTION_203_READY','PRODUCTION_204_READY','PRODUCTION_205_READY'])need('jarvis/core-survivor.js',m);
          for(const m of ['REPLAY 48 AUTHORITY UNIFICATION','production151State.transformStarts','production152State.formsSeen','production155.formEngagements','production162State.sprites.hit','voiceDirection111','readyNeverExceedsExpected:true','BRIDGE_NOT_RENDERER'])need('jarvis/core-survivor.js',m);
          for(const m of ['TOURNAMENT ROUND → STAGE AUTHORITY','p205TournamentRound','campaignCannotPinArena:true','roundChangeForcesArenaChange:true','opponentIdentityMatchesStage:true','noSecondRenderer:true'])need('jarvis/core-survivor.js',m);
          const core=text('jarvis/core-survivor.js');
          if((core.match(/const production204=/g)||[]).length!==1)throw Error('Production 204 authority bridge must be assembled exactly once');
          if((core.match(/const production205=/g)||[]).length!==1)throw Error('Production 205 stage authority must be assembled exactly once');
          const inc=text('jarvis/production205-stage-authority.inc.js');
          if(!/tournament140[\s\S]{0,180}campaign/.test(inc))throw Error('Stage authority must prefer tournament state before campaign fallback');
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(text('survivor.html')))throw Error('Standalone Griffin renderer reintroduced');
          console.log({survivor:'PRODUCTION_205',stage:'TOURNAMENT_ROUND_AUTHORITATIVE',campaign:'SYNCED_NOT_PINNING',arenas:9,opponents:9,forms:'REPLAY_48_AUTHORITY_PRESERVED',damage:'HIT_CELL_AUTHORITY_PRESERVED',voice:'DIRECTED_AUTHORITY_PRESERVED',renderer:'EXISTING_SINGLE_VISIBLE_2D_STAGE'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
