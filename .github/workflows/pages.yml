name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production*.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 219 replay55 cleanup
        run: |
          set -Eeuo pipefail
          required=(
            survivor.html jarvis/core-survivor.js
            jarvis/production203-round-art-sprite-authority.inc.js
            jarvis/production204-replay47-authority.inc.js
            jarvis/production205-stage-authority.inc.js
            jarvis/production206-scene-fight-authority.inc.js
            jarvis/production207-level-scene-authority.inc.js
            jarvis/production209-canonical-arena-render-source.inc.js
            jarvis/production210-live-stage-arena-authority.inc.js
            jarvis/production211-canonical-round-scene-authority.inc.js
            jarvis/production212-tournament-progression-handoff.inc.js
            jarvis/production213-visible-opponent-authority.inc.js
            jarvis/production214-final-boss-compositor.inc.js
            jarvis/production215-live-raf-render-authority.inc.js
            jarvis/production216-single-raf-vfx-readability.inc.js
            jarvis/production217-canonical-opponent-only.inc.js
            jarvis/production218-engine-kernel-stage-runtime.inc.js
            jarvis/production219-replay55-runtime-cleanup.inc.js
            tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs
            tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs
            tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs
            tools/build-survivor-production211.mjs tools/build-survivor-production212.mjs
            tools/build-survivor-production213.mjs tools/build-survivor-production215.mjs
            tools/build-survivor-production217.mjs tools/build-survivor-production218.mjs
            tools/build-survivor-production219.mjs
          )
          for f in "${required[@]}"; do test -f "$f"; done
          for f in "${required[@]}"; do case "$f" in *.js|*.mjs) node --check "$f";; esac; done
          node tools/build-survivor-production204.mjs
          node tools/build-survivor-production205.mjs
          node tools/build-survivor-production206.mjs
          node tools/build-survivor-production207.mjs
          node tools/build-survivor-production209.mjs
          node tools/build-survivor-production210.mjs
          node tools/build-survivor-production211.mjs
          node tools/build-survivor-production212.mjs
          node tools/build-survivor-production213.mjs
          node tools/build-survivor-production215.mjs
          node tools/build-survivor-production217.mjs
          node tools/build-survivor-production218.mjs
          node tools/build-survivor-production219.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          const core=text('jarvis/core-survivor.js');
          for(const n of [203,204,205,206,207,209,210,211,212,213,214,215,216,217,218,219])need('jarvis/core-survivor.js',`PRODUCTION_${n}_READY`);
          for(const n of [204,205,206,207,209,210,211,212,213,214,215,216,217,218,219])if((core.match(new RegExp(`const production${n}=`, 'g'))||[]).length!==1)throw Error(`Production ${n} must be assembled exactly once`);
          const inc218=text('jarvis/production218-engine-kernel-stage-runtime.inc.js');for(const m of ['p218StageManifest','p218Fixed={dt:1/60','p218PreloadWindow','p218ActorGuard','p218VfxBudget'])if(!inc218.includes(m))throw Error('Production 218 missing '+m);
          const inc219=text('jarvis/production219-replay55-runtime-cleanup.inc.js');for(const m of ['p219Leash','p219SceneSync','p219Voice','p219RetireLegacyLoops','p219AscensionSeconds','duelDistanceBounded:','levelBoundaryRebindsExistingArenaImage:true','voiceQueueBounded:','nineStageAcceptance:'])if(!inc219.includes(m))throw Error('Production 219 missing '+m);
          if(/document\.createElement\(['\"]canvas['\"]\)/.test(inc219)||/requestAnimationFrame\s*\(/.test(inc219))throw Error('Production 219 must not create a canvas or RAF');
          const ladder=['LIRA','KAIROX','SOLENNE','MIREYA','ZEPHYRA','ORUN','MORDREN','SABLE','KRAKEN'];for(const name of ladder)if(!inc218.includes(`opponent:'${name}'`))throw Error('Stage manifest missing '+name);
          const rivalAssets=['kairox-atlas-v2.webp','mireya-atlas-v2.webp','orun-atlas-v2.webp','sable-atlas-v2.webp','kraken-atlas-v2.webp','solenne-atlas-v2.webp','zephyra-atlas-v2.webp','mordren-atlas-v2.webp'];for(const n of rivalAssets){const p=`jarvis/assets/survivor/rivals/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<10000)throw Error('Missing/undersized rival atlas '+n)}
          const arenas=['lira-nexus-v1.webp','kraken-abyss-v1.webp','kairox-caldera-v1.webp','mireya-prism-v1.webp','zephyra-tempest-v1.webp','solenne-corona-v1.webp','sable-eclipse-v1.webp','orun-ion-v1.webp','mordren-singularity-v1.webp'],hashes=new Set();for(const n of arenas){const p=`jarvis/assets/survivor/arenas/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<50000)throw Error('Missing/undersized arena '+n);hashes.add(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'))}if(hashes.size!==arenas.length)throw Error('Arena artwork must remain byte-distinct');
          console.log({survivor:'PRODUCTION_219',engine:'CUSTOM_FIXED_STEP_CANVAS',duel:'BOUNDED',scene:'LEVEL_BOUNDARY_REBIND',voice:'DEDUPED_BOUNDED_QUEUE',legacyLoops:'RETIRED',acceptance:'NINE_STAGES_PLUS_ASCENSION',arenas:arenas.length,rivals:rivalAssets.length});
          NODE
      - name: Stamp Survivor deployment authority
        env:
          SURVIVOR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA;if(!/^[0-9a-f]{40}$/.test(sha||''))throw Error('Missing exact deployment SHA');
          const path='survivor.html';let html=fs.readFileSync(path,'utf8'),rx=/jarvis\/core-survivor\.js\?v=[^"'<>\s]+/g,refs=html.match(rx)||[];if(refs.length!==1)throw Error(`Expected exactly one Survivor core script reference, found ${refs.length}`);html=html.replace(rx,`jarvis/core-survivor.js?v=${sha}`);
          const marker=`<meta name="survivor-build" content="${sha}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">`;if(!html.includes('name="survivor-build"'))html=html.replace('<head>',`<head>${marker}`);else html=html.replace(/<meta name="survivor-build" content="[^"]+">/,`<meta name="survivor-build" content="${sha}">`);fs.writeFileSync(path,html);
          fs.writeFileSync('jarvis/survivor-build.json',JSON.stringify({production:219,deploySha:sha,core:'jarvis/core-survivor.js',engineAuthority:'CUSTOM_HTML5_CANVAS_FIXED_STEP_60HZ',sceneAuthority:'CAMPAIGN_STAGE_LEVEL_BOUNDARY_REBIND',assetAuthority:'REUSE_CANONICAL_IMAGES_PRELOAD_CURRENT_NEXT',progressionAuthority:'BOSS_DEATH_TO_NEXT_ROUND',opponentAuthority:'ONE_CANONICAL_TOURNAMENT_ACTOR_BOUNDED_DUEL',renderAuthority:'ONE_FINAL_COMPOSITOR_SINGLE_RAF',vfxAuthority:'MOBILE_READABILITY_BOUNDED',voiceAuthority:'DEDUPED_BOUNDED_SAFARI_QUEUE',replayAuthority:'DETERMINISTIC_STATE_HASH_PLUS_NINE_STAGE_ASCENSION_ACCEPTANCE',generatedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA,html=fs.readFileSync('survivor.html','utf8'),core=fs.readFileSync('jarvis/core-survivor.js','utf8'),manifest=JSON.parse(fs.readFileSync('jarvis/survivor-build.json','utf8'));
          if(!html.includes(`jarvis/core-survivor.js?v=${sha}`))throw Error('Survivor HTML is not bound to this deployment SHA');if(!html.includes(`name="survivor-build" content="${sha}"`))throw Error('Survivor build marker missing');if(!core.includes('PRODUCTION_219_READY'))throw Error('Production 219 missing from deployed core');if(manifest.deploySha!==sha||manifest.production!==219||manifest.voiceAuthority!=='DEDUPED_BOUNDED_SAFARI_QUEUE')throw Error('Survivor build manifest disagrees with deployment');console.log({deploySha:sha,production:manifest.production,cacheKey:'COMMIT_SHA',engine:manifest.engineAuthority,scene:manifest.sceneAuthority,voice:manifest.voiceAuthority});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
