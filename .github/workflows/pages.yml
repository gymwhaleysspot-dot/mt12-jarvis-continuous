name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing.html
      - racing-v2.html
      - racing-mjx7303-v6.html
      - racing-mjx7303-v15.html
      - racing-mjx7303-v19.html
      - racing-mjx7303-v20.html
      - assets/mjx7303/**
      - jarvis/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Validate current Jarvis workstation
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');const c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];
          const ids=new Set(c.workspaces.map(x=>x.id));for(const id of required)if(!ids.has(id))throw Error('Required workspace missing '+id);
          for(const p of ['racing-mjx7303-v20.html','racing-mjx7303-v19.html','jarvis/mjx7303-physics-v4.js','jarvis/mjx7303-playcanvas-v20.js','assets/mjx7303/mjx7303.glb'])if(!fs.existsSync(p))throw Error('Racing V20 asset missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs');const check=(f,t,l=t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${l} in ${f}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');check('index.html','jarvis/app.js');check('index.html','classic-token.js');check('jarvis/state.js','public/device-data/releases.json');
          check('racing-mjx7303-v20.html','MJX 7303 MT12 V20 PlayCanvas');check('racing-mjx7303-v20.html','mjx7303-physics-v4.js');check('racing-mjx7303-v20.html','mjx7303-playcanvas-v20.js');check('racing-mjx7303-v20.html','racing-mjx7303-v19.html','V19 runtime fallback');
          check('jarvis/racing-tab.js','racing-mjx7303-v20.html');check('jarvis/racing-tab.js','PlayCanvas V20');check('jarvis/mjx7303-playcanvas-v20.js','playcanvas@2.21.3');check('jarvis/mjx7303-playcanvas-v20.js','assets/mjx7303/mjx7303.glb');check('jarvis/mjx7303-playcanvas-v20.js','__V20_READY');
          const b=fs.readFileSync('assets/mjx7303/mjx7303.glb');
          if(b.length<20000)throw Error('MJX7303 GLB unexpectedly small: '+b.length);
          if(b.subarray(0,4).toString('ascii')!=='glTF')throw Error('MJX7303 GLB magic header invalid');
          if(b.readUInt32LE(4)!==2)throw Error('MJX7303 GLB is not glTF 2.0');
          if(b.readUInt32LE(8)!==b.length)throw Error('MJX7303 GLB length header mismatch');
          for(const f of ['chief.html','builds.html','mission.html','completion.html','device.html','control.html','research.html','discovery.html','v3.html','updates.html','builder.html','web/index.html']){if(!fs.existsSync(f))throw Error('Compatibility route missing '+f);check(f,'Opening Jarvis')}
          console.log({pages:'PASS',racing:'V20 PlayCanvas',glbBytes:b.length,glb:'VALID_GLB2',fallback:'V19'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
