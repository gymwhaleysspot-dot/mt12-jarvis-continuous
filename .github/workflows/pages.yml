name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-v30.html
      - racing-mjx7303-v29.html
      - racing-mjx7303-v28.html
      - jarvis/**
      - tools/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Install Blender CAD toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -2
      - name: Build MJX 7303 V30 clean continuous CAD asset
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_mjx7303_v30_blender.py
          mkdir -p assets/mjx7303
          MJX_V30_OUT=assets/mjx7303/mjx7303-v30.glb blender --background --factory-startup --python tools/build_mjx7303_v30_blender.py
          test -s assets/mjx7303/mjx7303-v30.glb
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/mjx7303/mjx7303-v30.glb');
          if(b.length<10000)throw Error('V30 CAD GLB too small: '+b.length);
          if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('V30 CAD GLB invalid');
          const jl=b.readUInt32LE(12),jt=b.readUInt32LE(16);if(jt!==0x4E4F534A||20+jl>b.length)throw Error('V30 GLB JSON chunk invalid');
          const g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');
          for(const token of ['BODY_SHELL_CONTINUOUS_V30','Windshield','WhiteRoof','WingBlade','FrontSplitter'])if(!names.some(n=>n.includes(token)))throw Error('V30 CAD component missing '+token);
          console.log({asset:'MJX7303_V30_CLEAN_CAD',bytes:b.length,nodes:names.length,glb:'VALID_GLB2'});
          NODE
      - name: Validate Jarvis XR V30 engine
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];const ids=new Set(c.workspaces.map(x=>x.id));for(const id of required)if(!ids.has(id))throw Error('Required workspace missing '+id);
          for(const p of ['racing-mjx7303-v30.html','jarvis/jarvis-xr-engine-v29.js','jarvis/jarvis-dynamics-v30.js','jarvis/mjx7303-racing-v30.js','jarvis/mjx7303-physics-v4.js','assets/mjx7303/mjx7303-v30.glb'])if(!fs.existsSync(p))throw Error('V30 component missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs'),check=(f,t,l=t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${l} in ${f}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');
          check('racing-mjx7303-v30.html','JARVIS XR ENGINE V30');check('racing-mjx7303-v30.html','mjx7303-racing-v30.js');
          check('jarvis/mjx7303-racing-v30.js','./jarvis-dynamics-v30.js');
          check('jarvis/racing-tab.js','racing-mjx7303-v30.html');check('jarvis/racing-tab.js','RACING V30 CLEAN BODY');
          check('jarvis/jarvis-xr-engine-v29.js',"getContext('webgl2'");check('jarvis/jarvis-xr-engine-v29.js','Dggx');check('jarvis/jarvis-xr-engine-v29.js','aces');check('jarvis/jarvis-xr-engine-v29.js','loadGLB');
          check('jarvis/jarvis-dynamics-v30.js','fixed=1/120');check('jarvis/jarvis-dynamics-v30.js','impactDamage');check('jarvis/jarvis-dynamics-v30.js','_healthySpawn');
          check('jarvis/mjx7303-racing-v30.js','JarvisXRRenderer');check('jarvis/mjx7303-racing-v30.js','JarvisDynamics');check('jarvis/mjx7303-racing-v30.js','__V30_READY');
          const runtime=fs.readFileSync('jarvis/mjx7303-racing-v30.js','utf8')+fs.readFileSync('jarvis/jarvis-xr-engine-v29.js','utf8');for(const banned of ['playcanvas@','three.module','babylon.js','BABYLON'])if(runtime.includes(banned))throw Error('External renderer leaked into V30: '+banned);
          const b=fs.readFileSync('assets/mjx7303/mjx7303-v30.glb');if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('V30 XR asset failed final validation');
          console.log({pages:'PASS',racing:'V30',renderer:'JARVIS_XR_WEBGL2',body:'CLEAN_CONTINUOUS_C3_WRC_STYLE',physics:'SPAWN_SAFE_120HZ',externalRenderer:false});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
