name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - 'tools/build-survivor-production200.mjs'
      - 'tools/build-survivor-production201.mjs'
      - 'tools/build-survivor-production202.mjs'
      - 'tools/build-survivor-production203.mjs'
      - 'tools/build-survivor-production204.mjs'
      - 'tools/build-survivor-production205.mjs'
      - 'tools/build-survivor-production206.mjs'
      - 'tools/build-survivor-production207.mjs'
      - 'tools/build-survivor-production209.mjs'
      - 'tools/build-survivor-production210.mjs'
      - 'tools/build-survivor-production211.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 211 canonical round scene authority
        run: |
          set -Eeuo pipefail
          for f in survivor.html jarvis/core-survivor.js jarvis/production203-round-art-sprite-authority.inc.js jarvis/production204-replay47-authority.inc.js jarvis/production205-stage-authority.inc.js jarvis/production206-scene-fight-authority.inc.js jarvis/production207-level-scene-authority.inc.js jarvis/production209-canonical-arena-render-source.inc.js jarvis/production210-live-stage-arena-authority.inc.js jarvis/production211-canonical-round-scene-authority.inc.js tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs tools/build-survivor-production211.mjs; do test -f "$f"; done
          for f in jarvis/production203-round-art-sprite-authority.inc.js jarvis/production204-replay47-authority.inc.js jarvis/production205-stage-authority.inc.js jarvis/production206-scene-fight-authority.inc.js jarvis/production207-level-scene-authority.inc.js jarvis/production209-canonical-arena-render-source.inc.js jarvis/production210-live-stage-arena-authority.inc.js jarvis/production211-canonical-round-scene-authority.inc.js tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs tools/build-survivor-production211.mjs; do node --check "$f"; done
          node tools/build-survivor-production204.mjs
          node tools/build-survivor-production205.mjs
          node tools/build-survivor-production206.mjs
          node tools/build-survivor-production207.mjs
          node tools/build-survivor-production209.mjs
          node tools/build-survivor-production210.mjs
          node tools/build-survivor-production211.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          for(const m of ['PRODUCTION_203_READY','PRODUCTION_204_READY','PRODUCTION_205_READY','PRODUCTION_206_READY','PRODUCTION_207_READY','PRODUCTION_209_READY','PRODUCTION_210_READY','PRODUCTION_211_READY'])need('jarvis/core-survivor.js',m);
          for(const m of ['CANONICAL CAMPAIGN ROUND → TOURNAMENT SCENE AUTHORITY','campaignStageIsCanonical:true','tournamentRoundIsZeroBasedMirror:true','staleEventRoundCannotOverrideStage:true','resetClearsSceneLocks:true','ladderOpponentMatchesArena:true','existingArenaImageRebound:true','singleRendererPreserved:true'])need('jarvis/core-survivor.js',m);
          const core=text('jarvis/core-survivor.js');for(const n of [204,205,206,207,209,210,211])if((core.match(new RegExp(`const production${n}=`, 'g'))||[]).length!==1)throw Error(`Production ${n} must be assembled exactly once`);
          const inc=text('jarvis/production211-canonical-round-scene-authority.inc.js');
          if(!inc.includes("const p211Ladder=Object.freeze(['LIRA','KAIROX','SOLENNE','MIREYA','ZEPHYRA','ORUN','MORDREN','SABLE','KRAKEN'])"))throw Error('Production 211 ladder must match Production 140');
          if(!inc.includes("const campaignStage=p211Positive(typeof campaign==='object'&&campaign?.stage)"))throw Error('campaign.stage must be canonical');
          if(!inc.includes('tournament140.round=wanted'))throw Error('Tournament round must be synchronized as zero-based mirror');
          if(!inc.includes('p205State.eventRound=0'))throw Error('Reset must clear stale event-round lock');
          if(!inc.includes("p210Wanted=function(level,spec)"))throw Error('Arena request identity must be rebound for Production 211');
          if(/return Math\.max\(1,\.\.\.candidates\)/.test(inc))throw Error('Production 211 must not vote across stale mixed-base authorities');
          const arenaDir='jarvis/assets/survivor/arenas';const arenas=['lira-nexus-v1.webp','kraken-abyss-v1.webp','kairox-caldera-v1.webp','mireya-prism-v1.webp','zephyra-tempest-v1.webp','solenne-corona-v1.webp','sable-eclipse-v1.webp','orun-ion-v1.webp','mordren-singularity-v1.webp'];const hashes=new Set();for(const n of arenas){const p=`${arenaDir}/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<50000)throw Error('Missing/undersized arena '+n);hashes.add(require('crypto').createHash('sha256').update(fs.readFileSync(p)).digest('hex'))}if(hashes.size!==arenas.length)throw Error('Arena artwork must be byte-distinct for every level');
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(text('survivor.html')))throw Error('Standalone Griffin renderer reintroduced');
          console.log({survivor:'PRODUCTION_211',scene:'CAMPAIGN_STAGE_TO_LADDER_ARENA',arenas:arenas.length,distinctArenaHashes:hashes.size,renderer:'EXISTING_SINGLE'});
          NODE
      - name: Stamp Survivor deployment authority
        env:
          SURVIVOR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const sha=process.env.SURVIVOR_DEPLOY_SHA;
          if(!/^[0-9a-f]{40}$/.test(sha||'')) throw Error('Missing exact deployment SHA');
          const path='survivor.html';let html=fs.readFileSync(path,'utf8');const rx=/jarvis\/core-survivor\.js\?v=[^"'<>\s]+/g;const refs=html.match(rx)||[];if(refs.length!==1)throw Error(`Expected exactly one Survivor core script reference, found ${refs.length}`);html=html.replace(rx,`jarvis/core-survivor.js?v=${sha}`);
          const marker=`<meta name="survivor-build" content="${sha}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">`;if(!html.includes('name="survivor-build"'))html=html.replace('<head>',`<head>${marker}`);else html=html.replace(/<meta name="survivor-build" content="[^"]+">/,`<meta name="survivor-build" content="${sha}">`);fs.writeFileSync(path,html);
          fs.writeFileSync('jarvis/survivor-build.json',JSON.stringify({production:211,deploySha:sha,core:'jarvis/core-survivor.js',sceneAuthority:'CAMPAIGN_STAGE_TO_LADDER_ARENA',generatedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          node <<'NODE'
          const fs=require('fs');const sha=process.env.SURVIVOR_DEPLOY_SHA,html=fs.readFileSync('survivor.html','utf8'),core=fs.readFileSync('jarvis/core-survivor.js','utf8'),manifest=JSON.parse(fs.readFileSync('jarvis/survivor-build.json','utf8'));
          if(!html.includes(`jarvis/core-survivor.js?v=${sha}`))throw Error('Survivor HTML is not bound to this deployment SHA');if(!html.includes(`name="survivor-build" content="${sha}"`))throw Error('Survivor build marker missing');if(!core.includes('PRODUCTION_211_READY'))throw Error('Production 211 missing from deployed core');if(manifest.deploySha!==sha||manifest.production!==211)throw Error('Survivor build manifest disagrees with deployment');console.log({deploySha:sha,production:manifest.production,cacheKey:'COMMIT_SHA',manifest:'jarvis/survivor-build.json'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
