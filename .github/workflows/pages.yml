name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - 'tools/build-survivor-production200.mjs'
      - 'tools/build-survivor-production201.mjs'
      - 'tools/build-survivor-production202.mjs'
      - 'tools/build-survivor-production203.mjs'
      - 'tools/build-survivor-production204.mjs'
      - 'tools/build-survivor-production205.mjs'
      - 'tools/build-survivor-production206.mjs'
      - 'tools/build-survivor-production207.mjs'
      - 'tools/build-survivor-production209.mjs'
      - 'tools/build-survivor-production210.mjs'
      - 'tools/build-survivor-production211.mjs'
      - 'tools/build-survivor-production212.mjs'
      - 'tools/build-survivor-production213.mjs'
      - 'tools/build-survivor-production215.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 215 live RAF authority
        run: |
          set -Eeuo pipefail
          for f in survivor.html jarvis/core-survivor.js jarvis/production203-round-art-sprite-authority.inc.js jarvis/production204-replay47-authority.inc.js jarvis/production205-stage-authority.inc.js jarvis/production206-scene-fight-authority.inc.js jarvis/production207-level-scene-authority.inc.js jarvis/production209-canonical-arena-render-source.inc.js jarvis/production210-live-stage-arena-authority.inc.js jarvis/production211-canonical-round-scene-authority.inc.js jarvis/production212-tournament-progression-handoff.inc.js jarvis/production213-visible-opponent-authority.inc.js jarvis/production214-final-boss-compositor.inc.js jarvis/production215-live-raf-render-authority.inc.js tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs tools/build-survivor-production211.mjs tools/build-survivor-production212.mjs tools/build-survivor-production213.mjs tools/build-survivor-production215.mjs; do test -f "$f"; done
          for f in jarvis/production203-round-art-sprite-authority.inc.js jarvis/production204-replay47-authority.inc.js jarvis/production205-stage-authority.inc.js jarvis/production206-scene-fight-authority.inc.js jarvis/production207-level-scene-authority.inc.js jarvis/production209-canonical-arena-render-source.inc.js jarvis/production210-live-stage-arena-authority.inc.js jarvis/production211-canonical-round-scene-authority.inc.js jarvis/production212-tournament-progression-handoff.inc.js jarvis/production213-visible-opponent-authority.inc.js jarvis/production214-final-boss-compositor.inc.js jarvis/production215-live-raf-render-authority.inc.js tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs tools/build-survivor-production211.mjs tools/build-survivor-production212.mjs tools/build-survivor-production213.mjs tools/build-survivor-production215.mjs; do node --check "$f"; done
          node tools/build-survivor-production204.mjs
          node tools/build-survivor-production205.mjs
          node tools/build-survivor-production206.mjs
          node tools/build-survivor-production207.mjs
          node tools/build-survivor-production209.mjs
          node tools/build-survivor-production210.mjs
          node tools/build-survivor-production211.mjs
          node tools/build-survivor-production212.mjs
          node tools/build-survivor-production213.mjs
          node tools/build-survivor-production215.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          for(const m of ['PRODUCTION_203_READY','PRODUCTION_204_READY','PRODUCTION_205_READY','PRODUCTION_206_READY','PRODUCTION_207_READY','PRODUCTION_209_READY','PRODUCTION_210_READY','PRODUCTION_211_READY','PRODUCTION_212_READY','PRODUCTION_213_READY','PRODUCTION_214_READY','PRODUCTION_215_READY'])need('jarvis/core-survivor.js',m);
          const core=text('jarvis/core-survivor.js');for(const n of [204,205,206,207,209,210,211,212,213,214,215])if((core.match(new RegExp(`const production${n}=`, 'g'))||[]).length!==1)throw Error(`Production ${n} must be assembled exactly once`);
          const inc215=text('jarvis/production215-live-raf-render-authority.inc.js');
          for(const m of ['const p215Render133=render133','render133=p215FinalRender','render128=p215FinalRender','render127=p215FinalRender','vector113Frame=p215FinalRender','loop127ResolvesFinalRender127:','activeBossHasVisibleDrawEvidence:'])if(!inc215.includes(m))throw Error('Production 215 missing '+m);
          if(/document\.createElement\(['\"]canvas['\"]\)/.test(inc215))throw Error('Production 215 must not create a second canvas');
          if(!inc215.includes("typeof p214DrawBoss==='function'&&p214DrawBoss()"))throw Error('Production 215 must repair a missed boss on the existing canvas');
          const inc211=text('jarvis/production211-canonical-round-scene-authority.inc.js');if(!inc211.includes("const p211Ladder=Object.freeze(['LIRA','KAIROX','SOLENNE','MIREYA','ZEPHYRA','ORUN','MORDREN','SABLE','KRAKEN'])"))throw Error('Production 211 ladder must match Production 140');
          const inc212=text('jarvis/production212-tournament-progression-handoff.inc.js');if(!inc212.includes('const p212Kill=kill')||!inc212.includes('resolveRound140(now)'))throw Error('Production 212 progression handoff missing');
          const inc213=text('jarvis/production213-visible-opponent-authority.inc.js');if(!inc213.includes('p213EnsureBoss')||!inc213.includes('p213AtlasFor'))throw Error('Production 213 opponent authority missing');
          const inc214=text('jarvis/production214-final-boss-compositor.inc.js');if(!inc214.includes('p214DrawBoss'))throw Error('Production 214 boss painter missing');
          const rivalAssets=['kairox-atlas-v2.webp','mireya-atlas-v2.webp','orun-atlas-v2.webp','sable-atlas-v2.webp','kraken-atlas-v2.webp','solenne-atlas-v2.webp','zephyra-atlas-v2.webp','mordren-atlas-v2.webp'];for(const n of rivalAssets){const p=`jarvis/assets/survivor/rivals/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<10000)throw Error('Missing/undersized rival atlas '+n)}
          const arenaDir='jarvis/assets/survivor/arenas',arenas=['lira-nexus-v1.webp','kraken-abyss-v1.webp','kairox-caldera-v1.webp','mireya-prism-v1.webp','zephyra-tempest-v1.webp','solenne-corona-v1.webp','sable-eclipse-v1.webp','orun-ion-v1.webp','mordren-singularity-v1.webp'],hashes=new Set();for(const n of arenas){const p=`${arenaDir}/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<50000)throw Error('Missing/undersized arena '+n);hashes.add(require('crypto').createHash('sha256').update(fs.readFileSync(p)).digest('hex'))}if(hashes.size!==arenas.length)throw Error('Arena artwork must be byte-distinct for every level');
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(text('survivor.html')))throw Error('Standalone Griffin renderer reintroduced');
          console.log({survivor:'PRODUCTION_215',rootCause:'LOOP127_DIRECT_RENDER127_BYPASS',renderer:'FINAL_RENDER_ALIASES_UNIFIED',bossProof:'BASE_DRAW_OR_SAME_CANVAS_POSTPASS',arenas:arenas.length,rivals:rivalAssets.length});
          NODE
      - name: Stamp Survivor deployment authority
        env:
          SURVIVOR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA;if(!/^[0-9a-f]{40}$/.test(sha||''))throw Error('Missing exact deployment SHA');
          const path='survivor.html';let html=fs.readFileSync(path,'utf8'),rx=/jarvis\/core-survivor\.js\?v=[^"'<>\s]+/g,refs=html.match(rx)||[];if(refs.length!==1)throw Error(`Expected exactly one Survivor core script reference, found ${refs.length}`);html=html.replace(rx,`jarvis/core-survivor.js?v=${sha}`);
          const marker=`<meta name="survivor-build" content="${sha}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">`;if(!html.includes('name="survivor-build"'))html=html.replace('<head>',`<head>${marker}`);else html=html.replace(/<meta name="survivor-build" content="[^"]+">/,`<meta name="survivor-build" content="${sha}">`);fs.writeFileSync(path,html);
          fs.writeFileSync('jarvis/survivor-build.json',JSON.stringify({production:215,deploySha:sha,core:'jarvis/core-survivor.js',sceneAuthority:'CAMPAIGN_STAGE_TO_LADDER_ARENA',progressionAuthority:'BOSS_DEATH_TO_NEXT_ROUND',opponentAuthority:'LIVE_RAF_FINAL_RENDER_BOSS_PROOF',renderAuthority:'RENDER133_128_127_VECTOR113_UNIFIED',generatedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA,html=fs.readFileSync('survivor.html','utf8'),core=fs.readFileSync('jarvis/core-survivor.js','utf8'),manifest=JSON.parse(fs.readFileSync('jarvis/survivor-build.json','utf8'));
          if(!html.includes(`jarvis/core-survivor.js?v=${sha}`))throw Error('Survivor HTML is not bound to this deployment SHA');if(!html.includes(`name="survivor-build" content="${sha}"`))throw Error('Survivor build marker missing');if(!core.includes('PRODUCTION_215_READY'))throw Error('Production 215 missing from deployed core');if(manifest.deploySha!==sha||manifest.production!==215||manifest.renderAuthority!=='RENDER133_128_127_VECTOR113_UNIFIED')throw Error('Survivor build manifest disagrees with deployment');console.log({deploySha:sha,production:manifest.production,cacheKey:'COMMIT_SHA',renderer:manifest.renderAuthority,manifest:'jarvis/survivor-build.json'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
