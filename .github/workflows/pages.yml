name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 199
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          test -f jarvis/production196-contact-choreography.inc.js
          compgen -G 'jarvis/production197*.inc.js' >/dev/null
          test -f jarvis/production198-full-fight-pass.inc.js
          test -f jarvis/production199-replay43-closures.inc.js
          test -f tools/build-survivor-production199.mjs
          node --check jarvis/production196-contact-choreography.inc.js
          node --check "$(compgen -G 'jarvis/production197*.inc.js' | head -1)"
          node --check jarvis/production198-full-fight-pass.inc.js
          node --check jarvis/production199-replay43-closures.inc.js
          node --check tools/build-survivor-production199.mjs
          node tools/build-survivor-production199.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          need('survivor.html','jarvis/core-survivor.js?v=20260816production199');
          if(text('survivor.html').includes('jarvis/core-survivor.js?v=20260816production198'))throw Error('Stale Production 198 cache key remains');
          for(const marker of ['PRODUCTION_196_READY','PRODUCTION_197_READY','PRODUCTION_198_READY','PRODUCTION_199_READY'])need('jarvis/core-survivor.js',marker);
          for(const marker of [
            'KI_BLAST_CONTACT','BEAM_CONTACT','LIGHTNING_CONTACT',
            'impactVfxRequireConfirmedEvent:true','blastEndpointsStayOnDefender:true','attackSpritesRequireCombatPhase:true',
            'transformationsAreTurningPoints:true','mobileVfxBudgetBounded:','proceduralCharacterOverlayRetired:true','SINGLE VISIBLE 2D STAGE',
            'staleTransformPoseRepaired:','targetStartsVisible:','hitCellsFollowDamage:','earlyFinishersDenied:true',
            'firstTwoAscensionsFitThreeRoundRun:','p199EnsureTargetVisible','p199RepairTransformPose',
            'gates:[0,18,42,78,126,186,258,342,426,510,570]'
          ])need('jarvis/core-survivor.js',marker);
          const html=text('survivor.html');
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(html))throw Error('Standalone Griffin renderer reintroduced');
          const assets=['griffin-atlas-v3.webp','griffin-ascended-atlas-v3.webp','griffin-speed-form-atlas-v1.webp','griffin-guardian-form-atlas-v1.webp','griffin-destroyer-form-atlas-v1.webp','griffin-instinct-form-atlas-v1.webp','griffin-celestial-overdrive-atlas-v1.webp','griffin-omega-instinct-atlas-v1.webp'];
          for(const name of assets){const p='jarvis/assets/survivor/'+name;if(!fs.existsSync(p)||fs.statSync(p).size<100000)throw Error(`Missing/undersized authored fighter asset ${p}`)}
          const vfxDir='jarvis/assets/survivor/vfx';const vfx=fs.existsSync(vfxDir)?fs.readdirSync(vfxDir).filter(n=>/-energy-atlas-v1\.webp$/.test(n)):[];
          if(vfx.length<10)throw Error(`Expected ten fighter VFX atlases, found ${vfx.length}`);
          console.log({survivor:'PRODUCTION_199',source:'REPLAY_43',gameplay:'VISIBLE_TARGET_RUSH_FINISHER_GATE',sprites:'EVENT_CONTACT_REACTION_RECOVERY',graphics:'PRODUCTION_198_CEL_PLUS_CONTACT_FOCUS',transformations:'18S_42S_THREE_ROUND_ASCENSION',cache:'PRODUCTION_199',vfxAtlases:vfx.length,renderer:'SINGLE_VISIBLE_2D_STAGE'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
