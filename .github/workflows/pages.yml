name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-*.html
      - jarvis/**
      - tools/**
      - assets/mjx7303/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Assemble MICHAEL V45 licensed C3 WRC asset
        run: |
          set -euo pipefail
          mkdir -p assets/mjx7303
          cat tools/michael-v40-private/body.glb.b64.* | base64 -d > assets/mjx7303/michael-v39.glb
          echo 'f4d91611ef369eb2bd6e865d4b03d224d8545e0af8a19c72f3ff93e1ab9b8f4a  assets/mjx7303/michael-v39.glb' | sha256sum -c -
          test "$(stat -c '%s' assets/mjx7303/michael-v39.glb)" -eq 3154380
          cp assets/mjx7303/michael-v39.glb assets/mjx7303/michael-v40.bin
          for part in 00 01 02 03 04 05 06; do { printf "export default '"; tr -d '\r\n' < "tools/michael-v40-private/body.glb.b64.$part"; printf "';\\n"; } > "jarvis/michael-v40-payload-$part.js"; done
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/mjx7303/michael-v39.glb');
          if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('MICHAEL V45 GLB invalid');
          const jl=b.readUInt32LE(12),jt=b.readUInt32LE(16);if(jt!==0x4E4F534A||20+jl>b.length)throw Error('MICHAEL V45 GLB JSON invalid');
          const g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');
          if(!names.some(n=>n.includes('MICHAEL_LICENSED_C3_WRC_BODY_V40')))throw Error('Licensed C3 WRC authority mesh missing');
          if(names.some(n=>/VISUAL_HULL|SCAN_BODY_V39/.test(n)))throw Error('Legacy visual-hull mesh survived V40 replacement');
          const tris=(g.accessors||[]).filter(a=>a.type==='SCALAR'&&a.componentType===5125).reduce((n,a)=>n+(a.count||0),0)/3;
          console.log({asset:'MICHAEL_V40_PERSONAL_C3_WRC',bytes:b.length,nodes:names.length,indexedTriangles:tris,glb:'VALID_GLB2'});
          NODE
          rm -rf tools/michael-v40-private
      - name: Validate MICHAEL engine and runtime
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs'),check=(f,t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${t} in ${f}`)};
          for(const p of ['racing-mjx7303-michael-v39.html','jarvis/michael-graphics-v39.js','jarvis/michael-engine-v45.js','jarvis/mjx7303-racing-michael-v39.js','assets/mjx7303/michael-v39.glb','assets/mjx7303/michael-v40.bin','jarvis/michael-v40-payload-00.js','jarvis/michael-v40-payload-01.js','jarvis/michael-v40-payload-02.js','jarvis/michael-v40-payload-03.js','jarvis/michael-v40-payload-04.js','jarvis/michael-v40-payload-05.js','jarvis/michael-v40-payload-06.js'])if(!fs.existsSync(p))throw Error('MICHAEL runtime component missing '+p);
          check('racing-mjx7303-michael-v39.html','MICHAEL PERSONAL TWIN V45');check('racing-mjx7303-michael-v39.html','LICENSED C3 WRC DIGITAL TWIN');check('racing-mjx7303-michael-v39.html','garage-atmosphere');check('racing-mjx7303-michael-v39.html','michael58');check('jarvis/racing-tab.js','michael58');check('index.html','racing-tab.js?v=20260808michael58');
          check('jarvis/michael-graphics-v39.js','MICHAEL_V45');check('jarvis/michael-engine-v45.js','MICHAEL_ENGINE_V45');check('jarvis/michael-engine-v45.js','MichaelFrameGraph');check('jarvis/michael-engine-v45.js','MichaelWorld');check('jarvis/michael-graphics-v39.js','WRC_PRESENTATION_ENGINE');check('jarvis/michael-graphics-v39.js','printerToMichael');check('jarvis/michael-graphics-v39.js','addCompletedTwin');check('jarvis/michael-graphics-v39.js','wheelbase:3.75');check('jarvis/michael-graphics-v39.js','wheels:4');check('jarvis/michael-graphics-v39.js','wrcLivery:true');check('jarvis/michael-graphics-v39.js','addMichaelWorld');check('jarvis/michael-graphics-v39.js','worldTrees:80');check('jarvis/michael-graphics-v39.js','roadEnvironment:true');check('jarvis/michael-graphics-v39.js','transparentGlass:true');check('jarvis/michael-graphics-v39.js','fittedLights:true');check('jarvis/michael-graphics-v39.js','[.72,.012,.026]');check('jarvis/michael-graphics-v39.js','2.25');
          check('jarvis/mjx7303-racing-michael-v39.js','michael-v40-payload-00.js');check('jarvis/mjx7303-racing-michael-v39.js','michael-v40-payload-06.js');check('jarvis/mjx7303-racing-michael-v39.js','createObjectURL');check('jarvis/mjx7303-racing-michael-v39.js','mjx7303-v33.glb');check('jarvis/mjx7303-racing-michael-v39.js','MICHAEL V45');check('jarvis/mjx7303-racing-michael-v39.js','__MICHAEL_READY');
          check('jarvis/racing-tab.js','MICHAEL V45');check('jarvis/racing-tab.js','racing-mjx7303-michael-v39.html');
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live MICHAEL V39 asset, shell and engine
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/";asset="${base}jarvis/michael-v40-payload-00.js?v=smoke-${GITHUB_SHA}";assetLast="${base}jarvis/michael-v40-payload-06.js?v=smoke-${GITHUB_SHA}";shell="${base}racing-mjx7303-michael-v39.html?v=smoke-${GITHUB_SHA}";engine="${base}jarvis/michael-graphics-v39.js?v=smoke-${GITHUB_SHA}";ok=0
          for attempt in $(seq 1 30); do
            echo "MICHAEL live smoke $attempt/30";ca=$(curl -L -sS -o /tmp/michael-00.js -w '%{http_code}' "$asset" || true);cz=$(curl -L -sS -o /tmp/michael-06.js -w '%{http_code}' "$assetLast" || true);cs=$(curl -L -sS -o /tmp/michael.html -w '%{http_code}' "$shell" || true);ce=$(curl -L -sS -o /tmp/michael.js -w '%{http_code}' "$engine" || true)
            if [ "$ca" = 200 ] && [ "$cz" = 200 ] && [ "$cs" = 200 ] && [ "$ce" = 200 ] && grep -q "^export default '" /tmp/michael-00.js && grep -q "^export default '" /tmp/michael-06.js && grep -q 'MICHAEL PERSONAL TWIN V45' /tmp/michael.html && grep -q 'MICHAEL_V45' /tmp/michael.js; then echo "{MICHAEL_LIVE_CHUNKS: PASS}";ok=1;break;fi
            echo "asset00=$ca asset06=$cz shell=$cs engine=$ce";sleep 5
          done
          test "$ok" -eq 1
