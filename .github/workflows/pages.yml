name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-v29.html
      - racing-mjx7303-v28.html
      - jarvis/**
      - tools/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Install Blender CAD toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -2
      - name: Build MJX 7303 continuous CAD asset for XR
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_mjx7303_v28_blender.py
          mkdir -p assets/mjx7303
          MJX_V28_OUT=assets/mjx7303/mjx7303-v28.glb blender --background --factory-startup --python tools/build_mjx7303_v28_blender.py
          test -s assets/mjx7303/mjx7303-v28.glb
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/mjx7303/mjx7303-v28.glb');
          if(b.length<10000)throw Error('XR CAD GLB too small: '+b.length);
          if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('XR CAD GLB invalid');
          const jl=b.readUInt32LE(12),jt=b.readUInt32LE(16);if(jt!==0x4E4F534A||20+jl>b.length)throw Error('XR CAD JSON chunk invalid');
          const g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');
          if(!names.some(n=>n.includes('BODY_SHELL_CONTINUOUS_V28')))throw Error('Continuous body shell missing');
          if(!names.some(n=>n.includes('Windshield')))throw Error('Windshield missing');
          if(names.some(n=>n.includes('GREENHOUSE_REFERENCE_V27')))throw Error('Floating V27 greenhouse leaked into XR asset');
          console.log({asset:'MJX7303_CONTINUOUS_CAD',bytes:b.length,nodes:names.length,glb:'VALID_GLB2'});
          NODE
      - name: Validate Jarvis XR V29 engine
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];const ids=new Set(c.workspaces.map(x=>x.id));for(const id of required)if(!ids.has(id))throw Error('Required workspace missing '+id);
          for(const p of ['racing-mjx7303-v29.html','jarvis/jarvis-xr-engine-v29.js','jarvis/jarvis-dynamics-v29.js','jarvis/mjx7303-racing-v29.js','jarvis/mjx7303-physics-v4.js','assets/mjx7303/mjx7303-v28.glb'])if(!fs.existsSync(p))throw Error('V29 component missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs'),check=(f,t,l=t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${l} in ${f}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');
          check('racing-mjx7303-v29.html','JARVIS XR ENGINE V29');check('racing-mjx7303-v29.html','mjx7303-physics-v4.js');check('racing-mjx7303-v29.html','mjx7303-racing-v29.js');
          check('jarvis/racing-tab.js','racing-mjx7303-v29.html');check('jarvis/racing-tab.js','RACING V29 CUSTOM XR ENGINE');
          check('jarvis/jarvis-xr-engine-v29.js',"getContext('webgl2'");check('jarvis/jarvis-xr-engine-v29.js','Dggx');check('jarvis/jarvis-xr-engine-v29.js','aces');check('jarvis/jarvis-xr-engine-v29.js','uShadow');check('jarvis/jarvis-xr-engine-v29.js','loadGLB');check('jarvis/jarvis-xr-engine-v29.js','quality');
          check('jarvis/jarvis-dynamics-v29.js','fixed=1/120');check('jarvis/jarvis-dynamics-v29.js','impact(');check('jarvis/jarvis-dynamics-v29.js','snapshot()');
          check('jarvis/mjx7303-racing-v29.js','JarvisXRRenderer');check('jarvis/mjx7303-racing-v29.js','JarvisDynamics');check('jarvis/mjx7303-racing-v29.js','__V29_READY');
          const runtime=fs.readFileSync('jarvis/mjx7303-racing-v29.js','utf8')+fs.readFileSync('jarvis/jarvis-xr-engine-v29.js','utf8');
          for(const banned of ['playcanvas@','three.module','babylon.js','BABYLON'])if(runtime.includes(banned))throw Error('External renderer leaked into V29: '+banned);
          const b=fs.readFileSync('assets/mjx7303/mjx7303-v28.glb');if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('XR asset failed final validation');
          console.log({pages:'PASS',racing:'V29',renderer:'JARVIS_XR_WEBGL2',pbr:'GGX',tone:'ACES',shadows:'CUSTOM_DEPTH_PCF',physics:'JARVIS_DYNAMICS_120HZ',vehicleBackend:'MT12_V4',externalRenderer:false});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
