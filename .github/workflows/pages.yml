name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-v30.html
      - racing-mjx7303-v29.html
      - racing-mjx7303-v28.html
      - jarvis/**
      - tools/**
      - assets/mjx7303/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Install Blender reconstruction toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 mesa-utils
          blender --version | head -2
          glxinfo -B || true
      - name: Build and render MJX 7303 V33 blueprint master
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_mjx7303_v33_blender.py
          mkdir -p assets/mjx7303/v33-previews
          xvfb-run -a -s '-screen 0 1920x1080x24' env MJX_V33_OUT=assets/mjx7303/mjx7303-v33.glb MJX_V33_PREVIEW_DIR=assets/mjx7303/v33-previews blender --background --factory-startup --python tools/build_mjx7303_v33_blender.py
          test -s assets/mjx7303/mjx7303-v33.glb
          for view in front three side rear top; do test -s "assets/mjx7303/v33-previews/$view.png"; done
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/mjx7303/mjx7303-v33.glb');
          if(b.length<50000)throw Error('V33 blueprint master GLB too small: '+b.length);
          if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('V33 blueprint master GLB invalid');
          const jl=b.readUInt32LE(12),jt=b.readUInt32LE(16);if(jt!==0x4E4F534A||20+jl>b.length)throw Error('V33 GLB JSON chunk invalid');
          const g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');
          for(const token of ['BODY_SHELL_V33_BLUEPRINT','Windshield_V33','RoofPanel_V33','RearWingMain_V33','FrontSplitter_V33','FenderLip_V33','Tire_V33','Dashboard_V33','Seat_V33'])if(!names.some(n=>n.includes(token)))throw Error('V33 Blender component missing '+token);
          console.log({asset:'MJX7303_V33_BLUEPRINT_MASTER',bytes:b.length,nodes:names.length,previews:5,glb:'VALID_GLB2'});
          NODE
      - name: Persist V33 GLB and visual QA renders
        run: |
          set -euo pipefail
          git config user.name "jarvis-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/mjx7303/mjx7303-v33.glb assets/mjx7303/v33-previews/*.png
          if git diff --cached --quiet; then
            echo "V33 blueprint master and previews already current on main."
          else
            git commit -m "Persist MJX 7303 V33 blueprint master and previews"
            pushed=0
            for attempt in 1 2 3; do
              echo "Synchronizing generated V33 asset commit with origin/main (attempt $attempt/3)..."
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Unable to persist V33 generated assets after 3 synchronized push attempts." >&2
              exit 1
            fi
          fi
      - name: Validate Jarvis XR V33 runtime
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];const ids=new Set(c.workspaces.map(x=>x.id));for(const id of required)if(!ids.has(id))throw Error('Required workspace missing '+id);
          for(const p of ['racing-mjx7303-v30.html','jarvis/jarvis-xr-engine-v29.js','jarvis/jarvis-dynamics-v30.js','jarvis/mjx7303-racing-v30.js','jarvis/mjx7303-physics-v4.js','assets/mjx7303/mjx7303-v33.glb'])if(!fs.existsSync(p))throw Error('V33 runtime component missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs'),check=(f,t,l=t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${l} in ${f}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');
          check('racing-mjx7303-v30.html','JARVIS XR ENGINE V33');check('racing-mjx7303-v30.html','BOOTING JARVIS XR V33');check('racing-mjx7303-v30.html','xr33');check('racing-mjx7303-v30.html','V33 BLUEPRINT MASTER');
          check('jarvis/mjx7303-racing-v30.js','mjx7303-v33.glb');check('jarvis/mjx7303-racing-v30.js','JARVIS XR V33');check('jarvis/mjx7303-racing-v30.js','__V33_READY');
          check('jarvis/racing-tab.js','xr33');check('jarvis/racing-tab.js','Simulator V33');check('jarvis/racing-tab.js','RACING V33 BLUEPRINT MASTER');
          check('tools/build_mjx7303_v33_blender.py','BODY_SHELL_V33_BLUEPRINT');check('tools/build_mjx7303_v33_blender.py','Dashboard_V33');check('tools/build_mjx7303_v33_blender.py','v33-previews');
          check('jarvis/jarvis-xr-engine-v29.js',"getContext('webgl2'");check('jarvis/jarvis-xr-engine-v29.js','Dggx');check('jarvis/jarvis-xr-engine-v29.js','aces');check('jarvis/jarvis-xr-engine-v29.js','loadGLB');
          check('jarvis/jarvis-dynamics-v30.js','fixed=1/120');check('jarvis/jarvis-dynamics-v30.js','impactDamage');check('jarvis/jarvis-dynamics-v30.js','_healthySpawn');
          const b=fs.readFileSync('assets/mjx7303/mjx7303-v33.glb');if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('V33 XR asset failed final validation');
          for(const v of ['front','three','side','rear','top'])if(fs.statSync(`assets/mjx7303/v33-previews/${v}.png`).size<5000)throw Error('V33 preview too small '+v);
          console.log({pages:'PASS',racing:'V33_BLUEPRINT_MASTER',shell:'V33',cache:'xr33',previews:5,renderer:'JARVIS_XR_WEBGL2',physics:'SPAWN_SAFE_120HZ',externalRenderer:false});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4