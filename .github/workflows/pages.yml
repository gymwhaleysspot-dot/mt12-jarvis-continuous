name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing.html
      - racing-v2.html
      - racing-mjx7303-v6.html
      - jarvis/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Validate current Jarvis workstation
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');const c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];
          const ids=new Set(c.workspaces.map(x=>x.id));
          for(const id of required)if(!ids.has(id))throw Error('Required Jarvis workspace missing: '+id);
          if(c.workspaces.length<required.length)throw Error('Jarvis workspace contract incomplete');
          if(c.missions.length<15)throw Error('Capability mission contract incomplete');
          if(!c.missions.some(x=>x.id==='firmware-catalog'))throw Error('Firmware catalog mission missing');
          if(!c.missions.some(x=>x.id==='firmware-build-flash'))throw Error('Firmware build/flash mission missing');
          for(const p of ['racing-mjx7303-v6.html','jarvis/mjx7303-physics-v4.js','jarvis/mjx7303-render-v6.js','jarvis/mjx7303-game-v6.js'])if(!fs.existsSync(p))throw Error('Racing simulator asset missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          grep -q 'Jarvis MT12 Engineering Workstation' index.html
          grep -q 'jarvis/app.js' index.html
          grep -q 'classic-token.js' index.html
          grep -q 'jarvis/firmware-center.js' index.html
          grep -q 'public/device-data/releases.json' jarvis/state.js
          grep -q 'EdgeTX' jarvis/firmware-center.js
          grep -q 'ExpressLRS' jarvis/firmware-center.js
          grep -q 'firmware-catalog' jarvis/firmware-center.js
          grep -q 'firmware-build-flash' jarvis/firmware-center.js
          grep -q 'MJX 7303 MT12 Simulator V7' racing-mjx7303-v6.html
          grep -q 'body\[data-mode="garage"\] .controls{display:none}' racing-mjx7303-v6.html
          grep -q 'mjx7303-physics-v4.js' racing-mjx7303-v6.html
          grep -q 'mjx7303-game-v6.js' racing-mjx7303-v6.html
          grep -q 'racing-mjx7303-v6.html' jarvis/racing-tab.js
          grep -q 'THREE' jarvis/mjx7303-render-v6.js
          for f in chief.html builds.html mission.html completion.html device.html control.html research.html discovery.html v3.html updates.html builder.html web/index.html; do test -f "$f"; grep -q 'Opening Jarvis' "$f"; done
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
