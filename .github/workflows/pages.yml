name: Publish A17Y Engineering OS
on:
  push:
    branches: [main]
    paths:
      - index.html
      - home/**
      - mission.html
      - completion.html
      - control.html
      - device.html
      - builder.html
      - updates.html
      - research.html
      - discovery.html
      - v3.html
      - site-nav.js
      - site-nav.css
      - classic-token.js
      - scripts/prepare-pages.mjs
      - public/v3-data/**
      - public/control-data/**
      - public/device-data/**
      - public/mission-data/**
      - public/completion-data/**
      - completion/**
      - engineering-missions/**
      - device/**
      - director/v3/features.json
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Audit wiring and add global Home navigation
        run: node scripts/prepare-pages.mjs
      - name: Verify published applications
        run: |
          set -euo pipefail
          for f in index.html home/home.css home/api.js home/replay.js home/app.js home/enhancements.js mission.html completion.html control.html device.html builder.html updates.html research.html discovery.html v3.html site-nav.js site-nav.css classic-token.js public/device-data/releases.json; do test -f "$f"; done
          for f in index.html mission.html completion.html control.html device.html builder.html updates.html research.html discovery.html v3.html; do grep -q 'site-nav.js' "$f"; grep -q 'classic-token.js' "$f"; done
          grep -q 'a17y_classic_pat' classic-token.js
          grep -q 'A17YToken' home/api.js
          grep -q 'home/app.js' index.html
          grep -q 'RUN FULL BUILDER' index.html
          grep -q 'UPLOAD WITH MANIFEST' index.html
          grep -q 'Direct artifact downloads' index.html
          grep -q 'home/enhancements.js' site-nav.js
          grep -q 'RUN FULL AI PIPELINE' builder.html
          grep -q 'RUN FULL AI PIPELINE' device.html
          grep -q 'RUN FULL ENGINEERING MISSION' mission.html
          grep -q 'RUN FULL MISSION' completion.html
          grep -q 'Direct workflow artifacts' completion.html
          grep -q 'Synchronized dual-log viewer' mission.html
          grep -q 'BUILD TAR.GZ + MANIFEST' device.html
          grep -q 'VERIFY OFFICIAL FILENAME + SHA-256' device.html
          node --check classic-token.js
          node --check site-nav.js
          node --check home/api.js
          node --check home/replay.js
          node --check home/app.js
          node --check home/enhancements.js
          node --check scripts/prepare-pages.mjs
          node --check completion/run.mjs
          node --check completion/verify-restore.mjs
          node --check engineering-missions/run.mjs
          node --check engineering-missions/tournament.mjs
          node --check engineering-missions/stress.mjs
          node --check engineering-missions/memory-lab.mjs
          node --check engineering-missions/finalize.mjs
          node -e "JSON.parse(require('fs').readFileSync('completion/schema.json'))"
          if [ -f public/control-data/log-hashes.json ]; then node -e "JSON.parse(require('fs').readFileSync('public/control-data/log-hashes.json'))"; fi
          if [ -f public/mission-data/current.json ]; then node -e "JSON.parse(require('fs').readFileSync('public/mission-data/current.json'))"; fi
          if [ -f public/completion-data/dashboard.json ]; then node -e "JSON.parse(require('fs').readFileSync('public/completion-data/dashboard.json'))"; fi
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
