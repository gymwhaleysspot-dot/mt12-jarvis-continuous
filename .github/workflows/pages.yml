name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - jarvis/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Validate clean Jarvis application
        run: |
          set -euo pipefail
          node --check classic-token.js
          node --check jarvis/api.js
          node --check jarvis/state.js
          node --check jarvis/app.js
          node --check scripts/prepare-pages.mjs
          node -e "const c=require('./jarvis/capabilities.json');if(c.workspaces.length<10||c.missions.length<20)throw Error('Capability contract incomplete');if(!c.domains.some(x=>x.includes('EdgeTX'))||!c.domains.some(x=>x.includes('ExpressLRS')))throw Error('Firmware scope missing')"
          node scripts/prepare-pages.mjs
          grep -q 'Jarvis MT12 Engineering Intelligence' index.html
          grep -q 'jarvis/app.js' index.html
          grep -q 'classic-token.js' index.html
          for f in chief.html builds.html mission.html completion.html device.html control.html research.html discovery.html v3.html updates.html builder.html web/index.html; do test -f "$f"; grep -q 'Opening Jarvis' "$f"; done
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
