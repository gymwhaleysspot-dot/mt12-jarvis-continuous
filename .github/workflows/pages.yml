name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-v30.html
      - racing-mjx7303-v29.html
      - racing-mjx7303-v28.html
      - jarvis/**
      - tools/**
      - assets/mjx7303/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Install Blender realism toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 mesa-utils
          blender --version | head -2
      - name: Build MJX 7303 V36 reference master and five-view QA
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_mjx7303_v36_blender.py
          rm -rf assets/mjx7303/v36-previews
          mkdir -p assets/mjx7303/v36-previews
          rm -f assets/mjx7303/mjx7303-v36.glb
          xvfb-run -a -s '-screen 0 1920x1080x24' env MJX_V36_OUT=assets/mjx7303/mjx7303-v36.glb MJX_V36_PREVIEW_DIR=assets/mjx7303/v36-previews blender --background --factory-startup --python tools/build_mjx7303_v36_blender.py
          test -s assets/mjx7303/mjx7303-v36.glb
          for view in front three side rear top; do test -s "assets/mjx7303/v36-previews/$view.png"; done
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/mjx7303/mjx7303-v36.glb');
          if(b.length<70000)throw Error('V36 realism GLB too small: '+b.length);
          if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('V36 GLB invalid');
          const jl=b.readUInt32LE(12),jt=b.readUInt32LE(16);if(jt!==0x4E4F534A||20+jl>b.length)throw Error('V36 GLB JSON invalid');
          const g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');
          const required=['BODY_SHELL_V36_REFERENCE','GreenhouseShell_V36','Windshield_V36','RearWingMain_V36','FrontSplitter_V36','Tire_V36','WheelSpoke_V36','Dashboard_V36','RoofLiveryWhite_V36'];
          for(const t of required)if(!names.some(n=>n.includes(t))){console.error('Exported V36 node names:',names);throw Error('V36 component missing '+t)}
          const src=fs.readFileSync('tools/build_mjx7303_v36_blender.py','utf8');
          for(const t of ['RimOuter_V36','RimInnerDark_V36','BrakeDisc_V36'])if(!src.includes(t))throw Error('V36 wheel source component missing '+t);
          console.log({asset:'MJX7303_V36_REFERENCE_MASTER',bytes:b.length,nodes:names.length,previews:5,glb:'VALID_GLB2',wheelSource:'VALID'});
          NODE
      - name: Validate Jarvis V36 realism runtime
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs'),check=(f,t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${t} in ${f}`)};
          for(const p of ['racing-mjx7303-v30.html','jarvis/jarvis-ai-graphics-v35.js','jarvis/jarvis-dynamics-v30.js','jarvis/mjx7303-racing-v30.js','assets/mjx7303/mjx7303-v36.glb'])if(!fs.existsSync(p))throw Error('V36 runtime component missing '+p);
          check('racing-mjx7303-v30.html','JARVIS REALISM ENGINE V36');check('racing-mjx7303-v30.html','V36 REFERENCE RECONSTRUCTION');check('racing-mjx7303-v30.html','xr36');
          check('jarvis/mjx7303-racing-v30.js','mjx7303-v36.glb');check('jarvis/mjx7303-racing-v30.js','JARVIS V36');check('jarvis/mjx7303-racing-v30.js','__V36_READY');
          check('jarvis/racing-tab.js','xr36');check('jarvis/racing-tab.js','Simulator V36');check('jarvis/racing-tab.js','RACING V36 REALISM MASTER');
          check('jarvis/jarvis-ai-graphics-v35.js','AUTOMOTIVE_CINEMATIC_ULTRA');check('jarvis/jarvis-ai-graphics-v35.js','4096');
          check('tools/build_mjx7303_v36_blender.py','BODY_SHELL_V36_REFERENCE');check('tools/build_mjx7303_v36_blender.py','GreenhouseShell_V36');check('tools/build_mjx7303_v36_blender.py','WheelSpoke_V36');
          const b=fs.readFileSync('assets/mjx7303/mjx7303-v36.glb');if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('V36 asset invalid');
          for(const v of ['front','three','side','rear','top'])if(fs.statSync(`assets/mjx7303/v36-previews/${v}.png`).size<7000)throw Error('V36 preview too small '+v);
          console.log({pages:'PASS',racing:'V36_REALISM_MASTER',renderer:'V35_CINEMATIC_ULTRA',previews:5,delivery:'DIRECT_PAGES_ARTIFACT'});
          NODE
      - name: Stage immutable Pages payload
        run: |
          set -euo pipefail
          test -s assets/mjx7303/mjx7303-v36.glb
          du -h assets/mjx7303/mjx7303-v36.glb
          echo 'V36 generated GLB will be deployed from this exact workspace; no binary git rebase/push is used.'
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
