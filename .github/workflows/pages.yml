name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - 'tools/build-survivor-production200.mjs'
      - 'tools/build-survivor-production201.mjs'
      - 'tools/build-survivor-production202.mjs'
      - 'tools/build-survivor-production203.mjs'
      - 'tools/build-survivor-production204.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 204
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          test -f jarvis/production203-round-art-sprite-authority.inc.js
          test -f jarvis/production204-replay47-authority.inc.js
          test -f tools/build-survivor-production204.mjs
          node --check jarvis/production203-round-art-sprite-authority.inc.js
          node --check jarvis/production204-replay47-authority.inc.js
          node --check tools/build-survivor-production204.mjs
          node tools/build-survivor-production204.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          need('survivor.html','jarvis/core-survivor.js?v=20260816production204');
          for(const m of ['PRODUCTION_196_READY','PRODUCTION_197_READY','PRODUCTION_198_READY','PRODUCTION_199_READY','PRODUCTION_200_READY','PRODUCTION_201_READY','PRODUCTION_202_READY','PRODUCTION_203_READY','PRODUCTION_204_READY'])need('jarvis/core-survivor.js',m);
          for(const m of ['REPLAY 47 AUTHORITY UNIFICATION','allElevenFormsReachable:true','engagementTelemetryTracksLiveForm:true','damageEventsDriveHitCells:true','rivalContactsCounted:true','voiceHasFallback:true','oneAuthoritativeAssetRegistry:true','singleVisible2DStage:true'])need('jarvis/core-survivor.js',m);
          for(const m of ['ROUND-LOCKED ARENA + UNIQUE ROSTER SPRITE AUTHORITY','allNineOpponentsHaveOwnCombatSprites:true','firstFightUsesLiraArtAndLiraSprites:true','noSharedLiraSpriteForOtherFighters:true'])need('jarvis/core-survivor.js',m);
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(text('survivor.html')))throw Error('Standalone Griffin renderer reintroduced');
          console.log({survivor:'PRODUCTION_204',source:'REPLAY_47',forms:'LIVE_ENGAGEMENT_AUTHORITY',damage:'HIT_CELL_AUTHORITY',rivals:'CONTACT_LEDGER',voice:'QUEUE_PLUS_BROWSER_FALLBACK',assets:'PRODUCTION_203_REGISTRY',renderer:'SINGLE_VISIBLE_2D_STAGE'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
