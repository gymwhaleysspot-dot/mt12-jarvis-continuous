name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing-mjx7303-v30.html
      - racing-mjx7303-v29.html
      - racing-mjx7303-v28.html
      - jarvis/**
      - tools/**
      - assets/mjx7303/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Install Blender CAD toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version | head -2
      - name: Build MJX 7303 V31 reference-driven CAD asset
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_mjx7303_v31_blender.py
          mkdir -p assets/mjx7303
          MJX_V31_OUT=assets/mjx7303/mjx7303-v31.glb blender --background --factory-startup --python tools/build_mjx7303_v31_blender.py
          test -s assets/mjx7303/mjx7303-v31.glb
          node - <<'NODE'
          const fs=require('fs'),b=fs.readFileSync('assets/mjx7303/mjx7303-v31.glb');
          if(b.length<10000)throw Error('V31 CAD GLB too small: '+b.length);
          if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(4)!==2||b.readUInt32LE(8)!==b.length)throw Error('V31 CAD GLB invalid');
          const jl=b.readUInt32LE(12),jt=b.readUInt32LE(16);if(jt!==0x4E4F534A||20+jl>b.length)throw Error('V31 GLB JSON chunk invalid');
          const g=JSON.parse(b.subarray(20,20+jl).toString('utf8').trim()),names=(g.nodes||[]).map(n=>n.name||'');
          for(const token of ['BODY_SHELL_REFERENCE_V31','Windshield','IntegratedWhiteRoof','RearWing','FrontSplitter'])if(!names.some(n=>n.includes(token)))throw Error('V31 CAD component missing '+token);
          console.log({asset:'MJX7303_V31_REFERENCE_CAD',bytes:b.length,nodes:names.length,glb:'VALID_GLB2'});
          NODE
      - name: Persist generated V31 CAD asset to main
        run: |
          set -euo pipefail
          git config user.name "jarvis-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/mjx7303/mjx7303-v31.glb
          if git diff --cached --quiet; then
            echo "V31 CAD asset already current on main."
          else
            git commit -m "Persist generated MJX 7303 V31 reference CAD asset"
            git push origin HEAD:main
          fi
      - name: Validate Jarvis XR V31 runtime
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];const ids=new Set(c.workspaces.map(x=>x.id));for(const id of required)if(!ids.has(id))throw Error('Required workspace missing '+id);
          for(const p of ['racing-mjx7303-v30.html','jarvis/jarvis-xr-engine-v29.js','jarvis/jarvis-dynamics-v30.js','jarvis/mjx7303-racing-v30.js','jarvis/mjx7303-physics-v4.js','assets/mjx7303/mjx7303-v31.glb'])if(!fs.existsSync(p))throw Error('Reference runtime component missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs'),check=(f,t,l=t)=>{const s=fs.readFileSync(f,'utf8');if(!s.includes(t))throw Error(`Validation missing ${l} in ${f}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');
          check('racing-mjx7303-v30.html','JARVIS XR ENGINE V31');check('racing-mjx7303-v30.html','BOOTING JARVIS XR V31');check('racing-mjx7303-v30.html','xr31b');check('racing-mjx7303-v30.html','mjx7303-racing-v30.js');
          check('jarvis/mjx7303-racing-v30.js','mjx7303-v31.glb');check('jarvis/mjx7303-racing-v30.js','JARVIS XR V31');check('jarvis/mjx7303-racing-v30.js','./jarvis-dynamics-v30.js');check('jarvis/mjx7303-racing-v30.js','__V31_READY');
          check('jarvis/racing-tab.js','xr31b');check('jarvis/racing-tab.js','Simulator V31');check('jarvis/racing-tab.js','RACING V31 REFERENCE BODY');
          check('jarvis/jarvis-xr-engine-v29.js',"getContext('webgl2'");check('jarvis/jarvis-xr-engine-v29.js','Dggx');check('jarvis/jarvis-xr-engine-v29.js','aces');check('jarvis/jarvis-xr-engine-v29.js','loadGLB');
          check('jarvis/jarvis-dynamics-v30.js','fixed=1/120');check('jarvis/jarvis-dynamics-v30.js','impactDamage');check('jarvis/jarvis-dynamics-v30.js','_healthySpawn');
          const b=fs.readFileSync('assets/mjx7303/mjx7303-v31.glb');if(b.subarray(0,4).toString('ascii')!=='glTF'||b.readUInt32LE(8)!==b.length)throw Error('V31 XR asset failed final validation');
          console.log({pages:'PASS',racing:'V31_REFERENCE_BODY',shell:'V31',cache:'xr31b',renderer:'JARVIS_XR_WEBGL2',physics:'SPAWN_SAFE_120HZ',externalRenderer:false});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
