name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths: ['index.html','survivor.html','racing-mjx7303-michael-v39.html','michael-health.html','jarvis/**','assets/**','engine/**','public/**','michael/visual/**','nickelle/**','tools/build-survivor-production196.mjs','tools/build-survivor-production197.mjs','tools/build-survivor-production198.mjs','.nojekyll','.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 198
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          test -f jarvis/production196-contact-choreography.inc.js
          test -f jarvis/production197-replay42.inc.js
          test -f jarvis/production198-replay43.inc.js
          node --check tools/build-survivor-production198.mjs
          node --check jarvis/production198-replay43.inc.js
          node tools/build-survivor-production196.mjs
          node tools/build-survivor-production197.mjs
          node tools/build-survivor-production198.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          need('survivor.html','core-survivor.js?v=20260816production198');
          if(text('survivor.html').includes('core-survivor.js?v=20260816production162'))throw Error('Stale Production 162 cache key remains');
          need('jarvis/core-survivor.js','PRODUCTION_196_READY');
          need('jarvis/core-survivor.js','PRODUCTION_197_READY');
          need('jarvis/core-survivor.js','PRODUCTION_198_READY');
          need('jarvis/core-survivor.js','KI_BLAST_CONTACT');
          need('jarvis/core-survivor.js','BEAM_CONTACT');
          need('jarvis/core-survivor.js','LIGHTNING_CONTACT');
          need('jarvis/core-survivor.js','REPLAY 43 COMPLETE GAMEPLAY + AUTHORED SPRITE + CEL GRAPHICS AUTHORITY');
          need('jarvis/core-survivor.js','EVENT / CONTACT / RECOVERY — NEVER WALL CLOCK');
          need('jarvis/core-survivor.js','transformPoseOnlyWhileTransforming:true');
          need('jarvis/core-survivor.js','authoredSpritesOnly:true');
          need('jarvis/core-survivor.js','contactBeforeImpact:true');
          need('jarvis/core-survivor.js','defenderBoundVfx:true');
          need('jarvis/core-survivor.js','mobileEffectBudget:true');
          need('jarvis/core-survivor.js','p198EnsureTargetVisible');
          need('jarvis/core-survivor.js','p198RushFollowThrough');
          need('jarvis/core-survivor.js','p198TransformGates=[0,18,42,78,126,186,258,342,426,510,570]');
          need('jarvis/core-survivor.js','proceduralCharacterOverlayRetired:true');
          need('jarvis/core-survivor.js','SINGLE VISIBLE 2D STAGE');
          const html=text('survivor.html');if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(html))throw Error('Standalone Griffin renderer reintroduced');
          console.log({survivor:'PRODUCTION_198',source:'REPLAY_43',gameplay:'TARGETED_RUSH_RECOVERY',sprites:'EVENT_DRIVEN_AUTHORED_16_CELL',graphics:'CONTACT_CEL_LIGHTING',transformations:'18_42_SECOND_OPENING_ASCENSIONS',cache:'BUSTED_198',renderer:'SINGLE_VISIBLE_2D_STAGE'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
