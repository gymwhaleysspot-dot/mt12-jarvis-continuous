name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify required site contracts
        run: |
          set -Eeuo pipefail
          test -s marble-pacman.html
          grep -F 'PAC-MARBLE' marble-pacman.html
          test -s survivor-runtime323.html
          test -s survivor-ps2.html
          test -s momto-live.html
          test -s momto-live.json
          grep -F 'Birth Mother' momto-live.html
          grep -F 'Birth Father' momto-live.html
          grep -F 'Live Activity' momto-live.html
          grep -F 'Search AI' momto-live.html
          python3 - <<'PY'
          import json
          d=json.load(open("momto-live.json",encoding="utf-8"))
          assert d["case"]["status"]=="active"
          assert "birth_name" not in d
          assert d["enhancements"]["total"]==5000
          for p in ("brain.json","maze-brain.json"):
              json.load(open(p,encoding="utf-8"))
          maze=json.load(open("maze-brain.json",encoding="utf-8"))
          levels=maze.get("levels",[])
          assert len(levels)==12
          from collections import deque
          for i,z in enumerate(levels,1):
              assert z[26][14]=="." and z[25][14]=="." and z[24][14]==".", f"level {i}: blocked player start"
              assert z[12][13]=="." and z[12][14]=="." and z[12][15]==".", f"level {i}: blocked ghost start"
              open_cells={(x,y) for y,row in enumerate(z) for x,ch in enumerate(row) if ch=="."}
              seen={(14,26)}
              q=deque([(14,26)])
              while q:
                  x,y=q.popleft()
                  for dx,dy in ((1,0),(-1,0),(0,1),(0,-1)):
                      p=(x+dx,y+dy)
                      if p in open_cells and p not in seen:
                          seen.add(p); q.append(p)
              assert seen==open_cells, f"level {i}: unreachable cells"
          print("required public artifacts validated; all Pac-Marble levels reachable")
          PY

      - name: Run bounded Pages build
        run: |
          set -Eeuo pipefail
          node scripts/prepare-pages.mjs
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='artifacts/' --exclude='factory/' --exclude='logs/' --exclude='tools/' --exclude='scripts/' --exclude='public/builds/' ./ _site/
          if [ -f factory/evolution-controller.json ]; then
            node <<'NODE'
          const fs=require('fs'),path=require('path');
          const x=JSON.parse(fs.readFileSync('factory/evolution-controller.json','utf8'));
          for(const p of [x.sourcePath,x.deployPath].filter(Boolean)){
            if(!fs.existsSync(p)) continue;
            const d=path.join('_site',p);
            fs.mkdirSync(path.dirname(d),{recursive:true});
            fs.copyFileSync(p,d);
          }
          NODE
          fi
          test -f _site/index.html
          test -s _site/marble-pacman.html
          test -s _site/brain.json
          test -s _site/maze-brain.json
          test -s _site/momto-live.html
          test -s _site/momto-live.json
          test -s _site/survivor-runtime323.html
          test -s _site/survivor-ps2.html
          bytes="$(du -sb _site | cut -f1)"
          test "$bytes" -lt 900000000
          echo "Pages artifact size: $bytes bytes"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
