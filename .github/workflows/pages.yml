name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths: ['index.html','survivor.html','racing-mjx7303-michael-v39.html','michael-health.html','jarvis/**','assets/**','engine/**','public/**','michael/visual/**','nickelle/**','.nojekyll','.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Validate Survivor Production 162 rollback
        run: |
          set -Eeuo pipefail
          test -f survivor.html
          test -f jarvis/core-survivor.js
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          need('survivor.html','jarvis/core-survivor.js?v=20260816production162');
          need('jarvis/core-survivor.js','PRODUCTION 162');
          need('jarvis/core-survivor.js','proceduralCharacterOverlayRetired:true');
          need('jarvis/core-survivor.js','SINGLE VISIBLE 2D STAGE');
          const html=text('survivor.html');
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(html))throw Error('Standalone Griffin renderer reintroduced into live entrypoint');
          console.log({survivor:'PRODUCTION_162_RESTORED',renderer:'SINGLE_VISIBLE_2D_STAGE',standaloneGriffinOverlay:false});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
