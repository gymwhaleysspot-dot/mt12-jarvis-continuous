name: Publish Jarvis Engineering OS
on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/jarvis-os.css
      - assets/jarvis-os.js
      - classic-token.js
      - chief.html
      - builds.html
      - mission.html
      - completion.html
      - control.html
      - device.html
      - builder.html
      - updates.html
      - research.html
      - discovery.html
      - v3.html
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/builds/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Build unified Jarvis OS and compatibility routes
        run: node scripts/prepare-pages.mjs
      - name: Validate unified application
        run: |
          set -euo pipefail
          for f in index.html assets/jarvis-os.css assets/jarvis-os.js classic-token.js chief.html builds.html mission.html completion.html control.html device.html builder.html updates.html research.html discovery.html v3.html; do test -s "$f"; done
          grep -q 'Jarvis Engineering Intelligence' index.html
          grep -q 'data-route="command"' index.html
          grep -q 'data-route="evidence"' index.html
          grep -q 'data-route="intelligence"' index.html
          grep -q 'data-route="factory"' index.html
          grep -q 'data-route="controllers"' index.html
          grep -q 'data-route="system"' index.html
          grep -q 'classic-token.js' index.html
          grep -q 'jarvis-os.js' index.html
          grep -q 'jarvis-os.css' index.html
          grep -q 'index.html#intelligence' research.html
          grep -q 'index.html#factory' builder.html
          grep -q 'index.html#controllers' builds.html
          grep -q 'index.html#system' control.html
          node --check assets/jarvis-os.js
          node --check classic-token.js
          node --check scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
