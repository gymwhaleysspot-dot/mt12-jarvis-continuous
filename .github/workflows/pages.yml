name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production*.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 224 Replay 59 global scene authority
        run: |
          set -Eeuo pipefail
          required=(
            survivor.html jarvis/core-survivor.js
            jarvis/production220-direct-nine-arena-bindings.inc.js
            jarvis/production221-replay56-runtime-fixes.inc.js
            jarvis/production222-replay57-performance-contact-fixes.inc.js
            jarvis/production223-replay58-stage-pixel-authority.inc.js
            jarvis/production224-replay59-global-scene-authority.inc.js
            tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs
            tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs
            tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs
            tools/build-survivor-production211.mjs tools/build-survivor-production212.mjs
            tools/build-survivor-production213.mjs tools/build-survivor-production215.mjs
            tools/build-survivor-production217.mjs tools/build-survivor-production218.mjs
            tools/build-survivor-production219.mjs tools/build-survivor-production220.mjs
            tools/build-survivor-production222.mjs tools/build-survivor-production224.mjs
          )
          for f in "${required[@]}"; do test -f "$f"; done
          for f in "${required[@]}"; do case "$f" in *.js|*.mjs) node --check "$f";; esac; done
          for n in 204 205 206 207 209 210 211 212 213 215 217 218 219 220 222 224; do node "tools/build-survivor-production${n}.mjs"; done
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),text=p=>fs.readFileSync(p,'utf8');
          const core=text('jarvis/core-survivor.js'),inc224=text('jarvis/production224-replay59-global-scene-authority.inc.js');
          for(const n of [220,221,222,223,224])if(!core.includes(`PRODUCTION_${n}_READY`))throw Error(`Production ${n} missing from assembled core`);
          for(const n of [220,221,222,223,224])if((core.match(new RegExp(`const production${n}=`, 'g'))||[]).length!==1)throw Error(`Production ${n} must be assembled exactly once`);
          for(const m of ['arena119=function(g)','FINAL_ARENA119_USES_STAGE_SLOT','ATOMIC_STAGE_OPPONENT_ARENA','stageOpponentAtomic','bossMatchesStage','finalRendererUsesStageSlot','legacyAtlas117ArenaRetired:true','singleSceneAuthority:true'])if(!inc224.includes(m))throw Error('Production 224 missing '+m);
          if(/atlas117\.arena/.test(inc224))throw Error('Production 224 may not use the static arena image');
          if(/document\.createElement\(['\"]canvas['\"]\)/.test(inc224)||/requestAnimationFrame\s*\(/.test(inc224))throw Error('Production 224 must not create canvas/RAF');
          const expected=[['LIRA','lira-nexus-v1.webp'],['KAIROX','kairox-caldera-v1.webp'],['SOLENNE','solenne-corona-v1.webp'],['MIREYA','mireya-prism-v1.webp'],['ZEPHYRA','zephyra-tempest-v1.webp'],['ORUN','orun-ion-v1.webp'],['MORDREN','mordren-singularity-v1.webp'],['SABLE','sable-eclipse-v1.webp'],['KRAKEN','kraken-abyss-v1.webp']];
          const inc220=text('jarvis/production220-direct-nine-arena-bindings.inc.js'),hashes=new Set();
          for(let i=0;i<expected.length;i++){const [opponent,arena]=expected[i],stage=i+1;if(!inc220.includes(`{stage:${stage},opponent:'${opponent}',arena:'${arena}'`))throw Error(`Stage ${stage} mapping missing`);const p=`jarvis/assets/survivor/arenas/${arena}`;if(!fs.existsSync(p)||fs.statSync(p).size<50000)throw Error('Missing/undersized arena '+arena);hashes.add(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex'))}if(hashes.size!==9)throw Error('Arena files must be byte-distinct');
          console.log({survivor:'PRODUCTION_224',source:'REPLAY_59',scene:'ATOMIC_STAGE_OPPONENT_ARENA',finalPainter:'ARENA119_STAGE_SLOT',arenas:9,staticArenaRetired:true,renderer:'EXISTING_SINGLE'});
          NODE
      - name: Stamp Survivor Production 224 deployment authority
        env:
          SURVIVOR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA;if(!/^[0-9a-f]{40}$/.test(sha||''))throw Error('Missing exact deployment SHA');
          const path='survivor.html';let html=fs.readFileSync(path,'utf8'),rx=/jarvis\/core-survivor\.js\?v=[^"'<>\s]+/g,refs=html.match(rx)||[];if(refs.length!==1)throw Error(`Expected exactly one Survivor core reference, found ${refs.length}`);html=html.replace(rx,`jarvis/core-survivor.js?v=${sha}`);
          const marker=`<meta name="survivor-build" content="${sha}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">`;if(!html.includes('name="survivor-build"'))html=html.replace('<head>',`<head>${marker}`);else html=html.replace(/<meta name="survivor-build" content="[^"]+">/,`<meta name="survivor-build" content="${sha}">`);fs.writeFileSync(path,html);
          fs.writeFileSync('jarvis/survivor-build.json',JSON.stringify({production:224,deploySha:sha,core:'jarvis/core-survivor.js',engineAuthority:'CUSTOM_HTML5_CANVAS_FIXED_STEP_60HZ',sceneAuthority:'GLOBAL_ATOMIC_CAMPAIGN_STAGE_OPPONENT_ARENA',finalArenaPainter:'ARENA119_STAGE_SPECIFIC_IMAGE_SLOT',assetAuthority:'NINE_DISTINCT_STAGE_IMAGE_SLOTS',fallbackAuthority:'NO_PREVIOUS_STATIC_OR_HIGHLAND_SCENE',opponentAuthority:'ONE_CANONICAL_STAGE_BOUND_TOURNAMENT_ACTOR',renderAuthority:'ONE_FINAL_COMPOSITOR_SINGLE_RAF',replayAuthority:'REPLAY59_PRODUCTION224_ACCEPTANCE',generatedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          node <<'NODE'
          const fs=require('fs'),sha=process.env.SURVIVOR_DEPLOY_SHA,html=fs.readFileSync('survivor.html','utf8'),core=fs.readFileSync('jarvis/core-survivor.js','utf8'),m=JSON.parse(fs.readFileSync('jarvis/survivor-build.json','utf8'));if(!html.includes(`jarvis/core-survivor.js?v=${sha}`)||!html.includes(`name="survivor-build" content="${sha}"`))throw Error('Exact-SHA Survivor cache identity missing');if(!core.includes('PRODUCTION_224_READY'))throw Error('Production 224 missing from deployed core');if(m.deploySha!==sha||m.production!==224||m.finalArenaPainter!=='ARENA119_STAGE_SPECIFIC_IMAGE_SLOT')throw Error('Production 224 manifest mismatch');console.log({deploySha:sha,production:m.production,scene:m.sceneAuthority,painter:m.finalArenaPainter});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
