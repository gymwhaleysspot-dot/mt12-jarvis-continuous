name: Publish A17Y Engineering OS
on:
  push:
    branches: [main]
    paths:
      - index.html
      - control.html
      - device.html
      - builder.html
      - updates.html
      - research.html
      - discovery.html
      - v3.html
      - public/v3-data/**
      - public/control-data/**
      - public/device-data/**
      - device/**
      - director/v3/features.json
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Verify published pages
        run: |
          test -f index.html
          test -f control.html
          test -f device.html
          test -f builder.html
          test -f updates.html
          test -f research.html
          test -f discovery.html
          test -f v3.html
          test -f public/device-data/releases.json
          grep -q 'LUAC AI Builder' device.html
          grep -q 'RUN LUAC AI BUILDER' builder.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
