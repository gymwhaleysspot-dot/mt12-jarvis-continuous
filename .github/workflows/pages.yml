name: Deploy Michael Current to Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'survivor.html'
      - 'racing-mjx7303-michael-v39.html'
      - 'michael-health.html'
      - 'jarvis/**'
      - 'assets/**'
      - 'engine/**'
      - 'public/**'
      - 'michael/visual/**'
      - 'nickelle/**'
      - 'tools/build-survivor-production198.mjs'
      - 'tools/build-survivor-production199.mjs'
      - 'tools/build-survivor-production200.mjs'
      - 'tools/build-survivor-production201.mjs'
      - 'tools/build-survivor-production202.mjs'
      - 'tools/build-survivor-production203.mjs'
      - 'tools/build-survivor-production204.mjs'
      - 'tools/build-survivor-production205.mjs'
      - 'tools/build-survivor-production206.mjs'
      - 'tools/build-survivor-production207.mjs'
      - 'tools/build-survivor-production209.mjs'
      - 'tools/build-survivor-production210.mjs'
      - 'tools/build-survivor-production211.mjs'
      - 'tools/build-survivor-production212.mjs'
      - 'tools/build-survivor-production213.mjs'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build and validate Survivor Production 213 visible opponent authority
        run: |
          set -Eeuo pipefail
          for f in survivor.html jarvis/core-survivor.js jarvis/production203-round-art-sprite-authority.inc.js jarvis/production204-replay47-authority.inc.js jarvis/production205-stage-authority.inc.js jarvis/production206-scene-fight-authority.inc.js jarvis/production207-level-scene-authority.inc.js jarvis/production209-canonical-arena-render-source.inc.js jarvis/production210-live-stage-arena-authority.inc.js jarvis/production211-canonical-round-scene-authority.inc.js jarvis/production212-tournament-progression-handoff.inc.js jarvis/production213-visible-opponent-authority.inc.js tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs tools/build-survivor-production211.mjs tools/build-survivor-production212.mjs tools/build-survivor-production213.mjs; do test -f "$f"; done
          for f in jarvis/production203-round-art-sprite-authority.inc.js jarvis/production204-replay47-authority.inc.js jarvis/production205-stage-authority.inc.js jarvis/production206-scene-fight-authority.inc.js jarvis/production207-level-scene-authority.inc.js jarvis/production209-canonical-arena-render-source.inc.js jarvis/production210-live-stage-arena-authority.inc.js jarvis/production211-canonical-round-scene-authority.inc.js jarvis/production212-tournament-progression-handoff.inc.js jarvis/production213-visible-opponent-authority.inc.js tools/build-survivor-production204.mjs tools/build-survivor-production205.mjs tools/build-survivor-production206.mjs tools/build-survivor-production207.mjs tools/build-survivor-production209.mjs tools/build-survivor-production210.mjs tools/build-survivor-production211.mjs tools/build-survivor-production212.mjs tools/build-survivor-production213.mjs; do node --check "$f"; done
          node tools/build-survivor-production204.mjs
          node tools/build-survivor-production205.mjs
          node tools/build-survivor-production206.mjs
          node tools/build-survivor-production207.mjs
          node tools/build-survivor-production209.mjs
          node tools/build-survivor-production210.mjs
          node tools/build-survivor-production211.mjs
          node tools/build-survivor-production212.mjs
          node tools/build-survivor-production213.mjs
          node --check jarvis/core-survivor.js
          node <<'NODE'
          const fs=require('fs'),text=p=>fs.readFileSync(p,'utf8'),need=(p,s)=>{if(!text(p).includes(s))throw Error(`${p} missing ${s}`)};
          need('survivor.html','JARVIS ARCADE PROTOCOL');
          for(const m of ['PRODUCTION_203_READY','PRODUCTION_204_READY','PRODUCTION_205_READY','PRODUCTION_206_READY','PRODUCTION_207_READY','PRODUCTION_209_READY','PRODUCTION_210_READY','PRODUCTION_211_READY','PRODUCTION_212_READY','PRODUCTION_213_READY'])need('jarvis/core-survivor.js',m);
          for(const m of ['VISIBLE TOURNAMENT OPPONENT + IDENTITY-CORRECT FINAL RENDERER','hudOpponentHasRenderableBoss:','bossForcedIntoVisibleStage:','rivalUsesIdentityAtlas:','production121IsSingleFinalRenderer:true','noSecondCanvasRenderer:true'])need('jarvis/core-survivor.js',m);
          const core=text('jarvis/core-survivor.js');for(const n of [204,205,206,207,209,210,211,212,213])if((core.match(new RegExp(`const production${n}=`, 'g'))||[]).length!==1)throw Error(`Production ${n} must be assembled exactly once`);
          const inc211=text('jarvis/production211-canonical-round-scene-authority.inc.js');
          if(!inc211.includes("const p211Ladder=Object.freeze(['LIRA','KAIROX','SOLENNE','MIREYA','ZEPHYRA','ORUN','MORDREN','SABLE','KRAKEN'])"))throw Error('Production 211 ladder must match Production 140');
          const inc212=text('jarvis/production212-tournament-progression-handoff.inc.js');
          if(!inc212.includes('const p212Kill=kill')||!inc212.includes('resolveRound140(now)'))throw Error('Production 212 progression handoff missing');
          const inc213=text('jarvis/production213-visible-opponent-authority.inc.js');
          if(!inc213.includes("render121=function(source='main')"))throw Error('Production 213 must repair the existing final Production 121 renderer');
          if(!inc213.includes('p213EnsureBoss')||!inc213.includes("campaign.phase='BOSS_READY'"))throw Error('Production 213 active-opponent watchdog missing');
          if(!inc213.includes('p213AtlasFor')||!inc213.includes('liraAtlases131'))throw Error('Production 213 rival atlas selection missing');
          if(!inc213.includes('if(boss)visible.push(boss)'))throw Error('Active tournament boss must be guaranteed into the render list');
          if(!inc213.includes("production161?.ready&&elapsed>.08"))throw Error('Tournament-only opening must not wait for legacy wave ticks');
          if(!inc213.includes('p213TournamentBosses().length===1'))throw Error('Exactly-one active boss invariant missing');
          if(/document\.createElement\(['\"]canvas['\"]\)/.test(inc213))throw Error('Production 213 must not create a second canvas renderer');
          const rivalAssets=['kairox-atlas-v2.webp','mireya-atlas-v2.webp','orun-atlas-v2.webp','sable-atlas-v2.webp','kraken-atlas-v2.webp','solenne-atlas-v2.webp','zephyra-atlas-v2.webp','mordren-atlas-v2.webp'];for(const n of rivalAssets){const p=`jarvis/assets/survivor/rivals/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<10000)throw Error('Missing/undersized rival atlas '+n)}
          const arenaDir='jarvis/assets/survivor/arenas';const arenas=['lira-nexus-v1.webp','kraken-abyss-v1.webp','kairox-caldera-v1.webp','mireya-prism-v1.webp','zephyra-tempest-v1.webp','solenne-corona-v1.webp','sable-eclipse-v1.webp','orun-ion-v1.webp','mordren-singularity-v1.webp'];const hashes=new Set();for(const n of arenas){const p=`${arenaDir}/${n}`;if(!fs.existsSync(p)||fs.statSync(p).size<50000)throw Error('Missing/undersized arena '+n);hashes.add(require('crypto').createHash('sha256').update(fs.readFileSync(p)).digest('hex'))}if(hashes.size!==arenas.length)throw Error('Arena artwork must be byte-distinct for every level');
          if(/griffin-(?:dom|character|skeletal|3d|sprite|render)-/i.test(text('survivor.html')))throw Error('Standalone Griffin renderer reintroduced');
          console.log({survivor:'PRODUCTION_213',opponent:'HUD_TO_VISIBLE_BOSS',art:'IDENTITY_CORRECT_RIVAL_ATLAS',progression:'BOSS_DEATH_TO_NEXT_ROUND',arenas:arenas.length,rivals:rivalAssets.length,renderer:'PRODUCTION_121_EXISTING_SINGLE'});
          NODE
      - name: Stamp Survivor deployment authority
        env:
          SURVIVOR_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const sha=process.env.SURVIVOR_DEPLOY_SHA;
          if(!/^[0-9a-f]{40}$/.test(sha||'')) throw Error('Missing exact deployment SHA');
          const path='survivor.html';let html=fs.readFileSync(path,'utf8');const rx=/jarvis\/core-survivor\.js\?v=[^"'<>\s]+/g;const refs=html.match(rx)||[];if(refs.length!==1)throw Error(`Expected exactly one Survivor core script reference, found ${refs.length}`);html=html.replace(rx,`jarvis/core-survivor.js?v=${sha}`);
          const marker=`<meta name="survivor-build" content="${sha}"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">`;if(!html.includes('name="survivor-build"'))html=html.replace('<head>',`<head>${marker}`);else html=html.replace(/<meta name="survivor-build" content="[^"]+">/,`<meta name="survivor-build" content="${sha}">`);fs.writeFileSync(path,html);
          fs.writeFileSync('jarvis/survivor-build.json',JSON.stringify({production:213,deploySha:sha,core:'jarvis/core-survivor.js',sceneAuthority:'CAMPAIGN_STAGE_TO_LADDER_ARENA',progressionAuthority:'BOSS_DEATH_TO_NEXT_ROUND',opponentAuthority:'HUD_TO_VISIBLE_IDENTITY_CORRECT_BOSS',generatedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          node <<'NODE'
          const fs=require('fs');const sha=process.env.SURVIVOR_DEPLOY_SHA,html=fs.readFileSync('survivor.html','utf8'),core=fs.readFileSync('jarvis/core-survivor.js','utf8'),manifest=JSON.parse(fs.readFileSync('jarvis/survivor-build.json','utf8'));
          if(!html.includes(`jarvis/core-survivor.js?v=${sha}`))throw Error('Survivor HTML is not bound to this deployment SHA');if(!html.includes(`name="survivor-build" content="${sha}"`))throw Error('Survivor build marker missing');if(!core.includes('PRODUCTION_213_READY'))throw Error('Production 213 missing from deployed core');if(manifest.deploySha!==sha||manifest.production!==213||manifest.opponentAuthority!=='HUD_TO_VISIBLE_IDENTITY_CORRECT_BOSS')throw Error('Survivor build manifest disagrees with deployment');console.log({deploySha:sha,production:manifest.production,cacheKey:'COMMIT_SHA',opponent:manifest.opponentAuthority,manifest:'jarvis/survivor-build.json'});
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
