name: Publish Jarvis MT12 Platform
on:
  push:
    branches: [main]
    paths:
      - index.html
      - racing.html
      - racing-v2.html
      - racing-mjx7303-v6.html
      - racing-mjx7303-v15.html
      - jarvis/**
      - classic-token.js
      - scripts/prepare-pages.mjs
      - factory/**
      - research/**
      - public/**
      - device/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Validate current Jarvis workstation
        run: |
          set -euo pipefail
          node --check classic-token.js
          for f in jarvis/*.js scripts/*.mjs device/*.mjs; do [ -f "$f" ] && node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs');const c=require('./jarvis/capabilities.json');
          if(c.schema<7)throw Error('Jarvis capability contract must be schema 7+');
          const required=['command','factory','evidence','intelligence','vehicle','releases','radio','firmware','system','tools','racing'];
          const ids=new Set(c.workspaces.map(x=>x.id));
          for(const id of required)if(!ids.has(id))throw Error('Required Jarvis workspace missing: '+id);
          if(c.workspaces.length<required.length)throw Error('Jarvis workspace contract incomplete');
          if(c.missions.length<15)throw Error('Capability mission contract incomplete');
          if(!c.missions.some(x=>x.id==='firmware-catalog'))throw Error('Firmware catalog mission missing');
          if(!c.missions.some(x=>x.id==='firmware-build-flash'))throw Error('Firmware build/flash mission missing');
          for(const p of ['racing-mjx7303-v15.html','jarvis/mjx7303-physics-v4.js','jarvis/ai3d-engine-v15.js','jarvis/mjx7303-asset-v13.js','jarvis/mjx7303-game-v11.js'])if(!fs.existsSync(p))throw Error('Racing V16 asset missing: '+p);
          NODE
          node scripts/prepare-pages.mjs
          node - <<'NODE'
          const fs=require('fs');
          const check=(file,token,label=token)=>{const s=fs.readFileSync(file,'utf8');if(!s.includes(token))throw Error(`Validation missing ${label} in ${file}`)};
          check('index.html','Jarvis MT12 Engineering Workstation');
          check('index.html','jarvis/app.js');
          check('index.html','classic-token.js');
          check('index.html','jarvis/firmware-center.js');
          check('jarvis/state.js','public/device-data/releases.json');
          check('jarvis/firmware-center.js','EdgeTX');
          check('jarvis/firmware-center.js','ExpressLRS');
          check('jarvis/firmware-center.js','firmware-catalog');
          check('jarvis/firmware-center.js','firmware-build-flash');
          check('racing-mjx7303-v15.html','MJX 7303 MT12 AI3D V15');
          check('racing-mjx7303-v15.html','body[data-mode="garage"] .controls');
          check('racing-mjx7303-v15.html','mjx7303-physics-v4.js');
          check('racing-mjx7303-v15.html','mjx7303-game-v11.js');
          check('jarvis/racing-tab.js','racing-mjx7303-v15.html');
          check('jarvis/racing-tab.js','portrait16','V16 portrait cache token');
          check('jarvis/ai3d-engine-v15.js',"AI3D_VERSION='15.0.0'");
          check('jarvis/ai3d-engine-v15.js','WebGL2 required');
          check('jarvis/ai3d-engine-v15.js','AIQualityGovernor');
          check('jarvis/mjx7303-asset-v13.js','MJX7303_ASSET_V13');
          check('jarvis/mjx7303-game-v11.js','ai3d-engine-v15.js');
          check('jarvis/mjx7303-game-v11.js','portraitBase','V16 portrait-aware camera');
          if(fs.readFileSync('racing-mjx7303-v15.html','utf8').includes('three.module.js'))throw Error('Three.js unexpectedly present in active Racing shell');
          for(const f of ['chief.html','builds.html','mission.html','completion.html','device.html','control.html','research.html','discovery.html','v3.html','updates.html','builder.html','web/index.html']){
            if(!fs.existsSync(f))throw Error('Compatibility route missing: '+f);
            check(f,'Opening Jarvis','Opening Jarvis compatibility marker');
          }
          console.log('Jarvis Pages validation: PASS — Racing V16 portrait contract and compatibility routes verified.');
          NODE
      - uses: actions/upload-pages-artifact@v4
        with: {path: .}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
