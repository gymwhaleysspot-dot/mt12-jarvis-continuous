name: Keleb Continuous Interior Evolution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keleb-interior-evolution.yml'
      - 'keleb/**'
      - 'tools/build_keleb_interior.py'
      - 'tools/render_keleb_interior.py'
  schedule:
    - cron: '12,32,52 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: keleb-interior-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HOME: /home/runner/.cache/huggingface
      NICKELLE_SEG_MODEL: Xenova/segformer-b5-finetuned-ade-640-640
      NICKELLE_DEPTH_MODEL: onnx-community/depth-anything-v2-base
      KELEB_INTERIOR_BLEND: /tmp/keleb-interior.blend
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Validate Keleb authority and code
        run: |
          node --check keleb/research-run.mjs
          node --check keleb/direct-evidence-run.mjs
          node --check keleb/reconstruct.mjs
          node --check keleb/evolve.mjs
          python3 -m py_compile tools/build_keleb_interior.py tools/render_keleb_interior.py
          node - <<'NODE'
          const fs=require('fs');const t=JSON.parse(fs.readFileSync('keleb/interior-twin.json'));const c=JSON.parse(fs.readFileSync('keleb/config.json'));
          for(const k of ['exteriorGeometry','cameras','steering','vehicleDynamics','telemetry','track','nickelleExteriorState'])if(t.protectedBoundaries[k]!=='read_only')throw Error(`Keleb boundary ${k} not protected`);
          for(const k of ['exterior','camera','steering','physics','telemetry','track','livery','headlights','wheels','body_shell'])if(!c.forbiddenMutationScopes.includes(k))throw Error(`missing forbidden scope ${k}`);
          console.log('Keleb interior-only authority validated');
          NODE
      - name: Acquire direct C3 WRC cockpit evidence
        run: node keleb/direct-evidence-run.mjs | tee /tmp/keleb-direct-evidence.log
      - name: Run Keleb dedicated interior research
        run: node keleb/research-run.mjs | tee /tmp/keleb-research.log
      - name: Reconstruct Keleb interior belief
        run: node keleb/reconstruct.mjs | tee /tmp/keleb-reconstruction.log
      - name: Generate interior candidate population
        run: node keleb/evolve.mjs | tee /tmp/keleb-evolution.log
      - name: Install Blender and glTF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy >/tmp/keleb-blender-install.log 2>&1
          python3 -c 'import numpy; print(numpy.__version__)'
      - name: Build native Keleb interior champion
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender -b --python tools/build_keleb_interior.py
          test -s "$KELEB_INTERIOR_BLEND"
          test -s assets/mjx7303/keleb-interior.glb
      - name: Render canonical interior views directly from native scene
        run: |
          blender -b --python tools/render_keleb_interior.py
          for v in front driver codriver rear top; do test -s "/tmp/keleb-render/$v.png"; done
      - name: Restore heavyweight model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: keleb-heavy-v1-${{ runner.os }}-segformer-b5-depth-anything-v2-base
      - name: Install heavyweight neural runtime
        run: npm install --no-save --package-lock=false pngjs@7.0.0 @huggingface/transformers
      - name: Run heavyweight segmentation and depth on Keleb cockpit
        run: node tools/nickelle_heavy_vision.mjs analyze /tmp/keleb-render /tmp/keleb-heavy-analysis.json
      - name: Preserve Keleb heavyweight perception
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='keleb/heavy-memory.json';let m=JSON.parse(fs.readFileSync(p));const a=JSON.parse(fs.readFileSync('/tmp/keleb-heavy-analysis.json'));
          m.updatedAt=new Date().toISOString();m.runs=(m.runs||0)+1;m.lastAnalysis=a;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
          node keleb/reconstruct.mjs
      - name: Prove interior-only mutation boundary
        run: |
          git diff --exit-code HEAD -- jarvis index.html '*.html' || { echo 'Keleb touched protected exterior/runtime files'; exit 1; }
          test -s assets/mjx7303/keleb-interior.glb
          test -s "$KELEB_INTERIOR_BLEND"
          node -e "const p=require('./keleb/lab/proposal.json'); if(!p.requiresVisualValidation) process.exit(1)"
      - name: Persist Keleb learning and interior asset on newest main
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/keleb-out/keleb /tmp/keleb-out/assets/mjx7303
          cp -a keleb/memory.json keleb/heavy-memory.json keleb/reconstruction.json keleb/research keleb/lab /tmp/keleb-out/keleb/
          cp assets/mjx7303/keleb-interior.glb /tmp/keleb-out/assets/mjx7303/
          git config user.name 'Keleb Interior AI'
          git config user.email 'actions@users.noreply.github.com'
          for n in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p keleb assets/mjx7303
            cp -a /tmp/keleb-out/keleb/. keleb/
            cp /tmp/keleb-out/assets/mjx7303/keleb-interior.glb assets/mjx7303/keleb-interior.glb
            git add keleb assets/mjx7303/keleb-interior.glb
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Keleb learns and rebuilds Michael interior [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((n*4))
          done
          exit 1
      - name: Archive Keleb evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: keleb-interior-${{ github.run_number }}
          path: |
            /tmp/keleb-render
            /tmp/keleb-heavy-analysis.json
            /tmp/keleb-direct-evidence.log
            /tmp/keleb-research.log
            /tmp/keleb-reconstruction.log
            /tmp/keleb-evolution.log
            /tmp/keleb-interior.blend
            keleb
            assets/mjx7303/keleb-interior.glb
          if-no-files-found: warn
          retention-days: 60
