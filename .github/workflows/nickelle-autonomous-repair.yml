name: Nickelle Autonomous Whole-Car Repair

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/nickelle_autonomous_repair.mjs'
      - 'michael/visual/autonomy.json'
      - 'michael/reconstruction/topology-dsl.json'
      - 'michael/visual/owner-reference-observations.json'
      - 'michael/visual/scene-graph.json'
      - 'nickelle/visual-regression.json'
      - 'keleb/reconstruction.json'
      - '.github/workflows/nickelle-autonomous-repair.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: nickelle-autonomous-whole-car-repair
  cancel-in-progress: false

jobs:
  diagnose-and-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: '22', package-manager-cache: false}
      - name: Restore isolated autonomous belief
        run: |
          git fetch origin ai-state:refs/remotes/origin/ai-state || true
          mkdir -p michael/reconstruction
          git show origin/ai-state:michael/reconstruction/autonomous-state.json >michael/reconstruction/autonomous-state.json 2>/dev/null || true
      - name: Validate autonomous graphics stack
        run: |
          set -Eeuo pipefail
          node --check tools/nickelle_autonomous_repair.mjs
          node -e "for(const p of ['michael/visual/autonomy.json','michael/reconstruction/topology-dsl.json','michael/visual/owner-reference-observations.json','michael/visual/scene-graph.json']) JSON.parse(require('fs').readFileSync(p))"
      - name: Install vision runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0 jpeg-js@0.4.4
          npx playwright install --with-deps chromium
      - name: Start current Michael renderer
        run: |
          python3 -m http.server 4173 >/tmp/michael-autonomy-http.log 2>&1 &
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/racing-mjx7303-michael-v39.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/michael-autonomy-http.log; exit 1
      - name: Capture current champion from all canonical views
        env:
          MICHAEL_URL: http://127.0.0.1:4173/racing-mjx7303-michael-v39.html
          MICHAEL_CAPTURE_SIZE: 720
        run: node tools/michael_visual_capture.mjs /tmp/michael-autonomy-baseline
      - name: Solve owner-photo correspondence and whole-car repair plan
        run: node tools/nickelle_autonomous_repair.mjs run /tmp/michael-autonomy-baseline michael/reconstruction/autonomous-state.json
      - name: Verify all twenty autonomy upgrades are live
        run: |
          node - <<'NODE'
          const x=require('./michael/reconstruction/autonomous-state.json');
          const k=Object.keys(x.upgrades||{}),on=k.filter(a=>x.upgrades[a]);
          if(k.length!==20||on.length!==20) throw Error(`Expected 20/20 upgrades, got ${on.length}/${k.length}`);
          if(!Array.isArray(x.specialists)||x.specialists.length<5) throw Error('specialist population missing');
          if(!x.visualDebt?.regions?.length) throw Error('whole-car visual debt map missing');
          console.log('Nickelle autonomous repair: 20/20 upgrades live; focus=',x.focusRegion,'topology queue=',x.topologyQueue.length);
          NODE
      - name: Persist autonomous belief only to ai-state
        run: |
          set -Eeuo pipefail
          cp michael/reconstruction/autonomous-state.json /tmp/nickelle-autonomous-state.json
          git config user.name 'Nickelle Autonomous Repair AI'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin ai-state
          state_tree="$(mktemp -d /tmp/nickelle-autonomous-ai-state.XXXXXX)/tree"
          git worktree add --detach "$state_tree" origin/ai-state
          (
            cd "$state_tree"
            mkdir -p michael/reconstruction
            cp /tmp/nickelle-autonomous-state.json michael/reconstruction/autonomous-state.json
            git add michael/reconstruction/autonomous-state.json
            if ! git diff --cached --quiet; then git commit -m 'Nickelle updates isolated autonomous visual debt [skip ci]'; git push origin HEAD:ai-state; fi
          )
      - name: Route topology debt into full reconstruction
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          q="$(jq '.topologyQueue | length' /tmp/nickelle-autonomous-state.json)"
          if [ "$q" -gt 0 ]; then
            active="$(gh api "/repos/$REPO/actions/workflows/michael-full-reconstruction.yml/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending")]|length')"
            [ "$active" -gt 0 ] || gh workflow run michael-full-reconstruction.yml --repo "$REPO" --ref main
          fi
      - name: Route visual debt into Nickelle tournament
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          set -Eeuo pipefail
          debt="$(jq -r '.visualDebt.regions[0].debt // 0' /tmp/nickelle-autonomous-state.json)"
          awk "BEGIN{exit !($debt > 0.08)}" || exit 0
          wf='michael-visual-evolution.yml'
          encoded="$(gh api "/repos/$REPO/contents/.github/workflows/$wf?ref=main" --jq .content 2>/dev/null || true)"
          if [ -z "$encoded" ]; then echo "Visual tournament route skipped: $wf is absent on main"; exit 0; fi
          source="$(printf '%s' "$encoded" | base64 -d 2>/dev/null || true)"
          if ! grep -Eq '^[[:space:]]*workflow_dispatch:' <<<"$source"; then echo "Visual tournament route skipped: $wf has no workflow_dispatch trigger"; exit 0; fi
          active="$(gh api "/repos/$REPO/actions/workflows/$wf/runs?per_page=20" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending")]|length')"
          [ "$active" -gt 0 ] || gh workflow run "$wf" --repo "$REPO" --ref main
      - name: Preserve autonomous evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nickelle-autonomous-repair-${{ github.run_number }}
          path: |
            /tmp/nickelle-autonomous-state.json
            /tmp/michael-autonomy-baseline
          if-no-files-found: warn
          retention-days: 45
